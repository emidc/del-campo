# Del Campo — Índice de decisiones
#
# Fuente de verdad de QUÉ está decidido. El ADR (en DECISIONS/) explica POR QUÉ.
# Toda otra prosa del repositorio referencia el `id`; no reformula el `statement`.
#
# status:
#   ACCEPTED    decidido; cambiarlo requiere un ADR nuevo que lo supersede
#   PROVISIONAL decidido por ahora; tiene un criterio de falsación explícito
#   OPEN        deliberadamente sin decidir; NO se resuelve durante la implementación
#   SUPERSEDED  reemplazado por otra decisión
#   REJECTED    considerado y descartado; se registra para no re-litigarlo
#
# Una decisión ACCEPTED puede quedar superseded EN PARTE por decisiones posteriores sin
# perder autoridad sobre el resto. Conserva ACCEPTED, su statement reemplaza la cláusula
# afectada por la referencia a la decisión que la reemplaza, y declara
# `superseded_in_part_by` como lista de entradas `{clause, by}`. `clause` nombra la
# cláusula reemplazada; `by` es el id que la reemplaza y debe aparecer en el statement.
# No sirve para cambiar una decisión en silencio: la cláusula reemplazada queda nombrada.
#
# Campos obligatorios: id, title, status, date, statement, source
# PROVISIONAL exige `falsified_by`. OPEN exige `unblocked_by`.

version: 1
updated: 2026-11-07

decisions:

  # ── Dominio ──────────────────────────────────────────────────────────────

  - id: D-0001
    title: Party como identidad raíz del dominio
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §6
    statement: >
      La identidad de una persona física u organización se representa mediante Party.
      Una Party no cambia de id porque cambie de rol, y no se duplica por participar
      en más de un contexto.

  - id: D-0002
    title: Identidad separada de rol; CLIENT es derivado
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §12-15 + revisión externa
    statement: >
      PartyRole almacena únicamente aserciones no derivables, como PROSPECT.
      CLIENT no se almacena: es una vista sobre Party más relación comercial vigente
      o histórica. Como máximo un PartyRole activo por (party, role).

  - id: D-0003
    title: ContactPoint separado de identidad
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §18-21
    statement: >
      Email, teléfono y WhatsApp son ContactPoints con vigencia, no identificadores
      de identidad. Resuelven identidad pero no la constituyen. Una comunicación no
      resoluble permanece UNRESOLVED y nunca se asigna arbitrariamente.

  - id: D-0004
    title: Party admite fusión sin perder referencias
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §7-8 + revisión externa
    statement: >
      Party incluye mergedIntoPartyId y status MERGED. La resolución sigue la cadena.
      El id perdedor nunca se reutiliza ni se elimina, porque Policies, DocumentLinks
      y BusinessAuditEvents append-only ya lo referencian.

  - id: D-0005
    title: Policy guarda identidad; PolicyVersion guarda estado y vigencia
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §25-30 + revisión externa
    adr: DECISIONS/0005-policy-y-policyversion.md
    statement: >
      Policy contiene solo identidad inmutable (aseguradora, número y
      renewedFromPolicyId). Tomador, vigencia, prima, estado y cobertura viven en PolicyVersion.
      Las versiones no se solapan: intervalos semiabiertos por policy, a lo sumo una
      versión abierta. Endoso y cancelación son eventos que producen versiones nuevas.

  - id: D-0006
    title: Una Policy representa un período contractual, no un contrato perpetuo
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §25, §32-33 + revisión externa
    statement: >
      Una renovación crea una Policy nueva encadenada por renewedFromPolicyId.
      Todo lo que cuelga de una póliza cuelga de un período. Las preguntas que abarcan
      varios períodos recorren la cadena, y la migración debe reconstruirla.

  - id: D-0007
    title: Renewal es una vista derivada, no una entidad
    status: PROVISIONAL
    date: 2026-09-07
    source: DOMAIN.md §34-35
    statement: >
      La renovación se detecta y se mide desde la existencia de una Policy sucesora
      encadenada por renewedFromPolicyId y desde la vigencia de la PolicyVersion efectiva.
      No existe entidad Renewal. Calcular un renewal ratio no requiere entidad propia y
      por sí solo no falsifica esta decisión. Opportunity no es la portadora canónica del
      resultado de renovación; sus datos del origen se preservan en staging.
    falsified_by: >
      Necesitar registrar información no derivable de la póliza sucesora: motivo de
      pérdida, intentos de contacto, responsable, SLA o estado propio del proceso de
      renovación.

  - id: D-0008
    title: Las pólizas cargadas manualmente son de primera clase
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §41, INV-009
    statement: >
      Una Policy puede existir sin Quote, sin QuoteOption y sin Issuance. Todo reporte
      que haga join hacia atrás debe hacer visible cuántas pólizas quedan fuera.

  # ── Systems of record ────────────────────────────────────────────────────

  - id: D-0009
    title: Google Drive es el system of record documental
    status: ACCEPTED
    date: 2026-09-07
    source: CHARTER §18, DOMAIN.md §47-49
    statement: >
      Drive es autoritativo sobre contenido, existencia, ubicación y ACLs.
      Broker OS mantiene referencia, clasificación, metadata y estado de
      reconciliación. Nunca es plano de control ni revierte cambios humanos.

  - id: D-0010
    title: Gmail es el system of record de email; no se copian los cuerpos
    status: ACCEPTED
    date: 2026-09-07
    source: CHARTER §19
    statement: >
      Broker OS mantiene un índice de metadata y recupera el contenido desde Gmail
      cuando hace falta. WhatsApp puede requerir otra política; ver D-0028.

  - id: D-0011
    title: BusinessAuditEvent y AgentRun son registros separados
    status: ACCEPTED
    date: 2026-09-07
    source: revisión externa del Charter
    statement: >
      BusinessAuditEvent pertenece a Broker OS, es append-only y no contiene tokens
      ni costos. AgentRun pertenece a Project OS y no contiene datos de cliente.
      El único vínculo es la referencia agentRunId.

  # ── Arquitectura ─────────────────────────────────────────────────────────

  - id: D-0012
    title: Modular monolith con workers separados
    status: ACCEPTED
    date: 2026-09-07
    source: CHARTER §27
    statement: >
      Una sola aplicación modular más procesos worker. No microservicios sin valor
      operativo u organizativo demostrado. Los procesos prolongados no dependen del
      ciclo de vida de un request web.

  - id: D-0013
    title: Supabase se adopta como Postgres administrado
    status: ACCEPTED
    date: 2026-09-07
    source: revisión externa del Charter
    statement: >
      Cada otro producto de Supabase (Auth, Storage, Realtime, Queues) es una decisión
      separada que debe justificarse por sí sola. La base debe permanecer como un
      Postgres plano restaurable en cualquier proveedor.

  - id: D-0014
    title: Vercel se acota a la aplicación web
    status: PROVISIONAL
    date: 2026-09-07
    source: revisión externa del Charter
    statement: >
      Vercel hospeda la app web. El hosting del worker es una decisión separada y
      abierta, dominada por: proceso always-on, IP estable, sesión persistente y
      posible acceso a un segundo factor.
    falsified_by: >
      Que el spike de worker runtime muestre que un solo host cubre ambos casos,
      o que los portales de aseguradoras no impongan restricción por IP.

  - id: D-0058
    title: La app interna de VS01 se construye con Next.js y TypeScript en Vercel
    status: ACCEPTED
    date: 2026-09-23
    source: Respuesta del owner del 2026-09-23 para T-0018 (sesión de dirección Q4, S0); D-0014
    adr: DECISIONS/0058-nextjs-en-vercel.md
    statement: >
      La app web interna de VS01 usa Next.js con TypeScript y se hospeda en Vercel
      conforme D-0014. Reutiliza las consultas de T-0016 y la vinculación de T-0017 y
      respeta los límites de módulos existentes: la app no redefine schema, invariantes
      ni consultas de packages/db. Cada dependencia nueva requiere su ADR según R-05
      antes de incorporarse. No decide hosting de workers ni otros productos de Supabase.

  - id: D-0059
    title: Sesión de VS01 por OIDC corporativo de Google con lista explícita de admisión
    status: ACCEPTED
    date: 2026-09-23
    source: >
      Respuesta del owner del 2026-09-23 para T-0018; Q-10 y SLICES/VS01.md §5.
      Manuel administra el Workspace y coordina el cliente web con audiencia Internal.
    adr: DECISIONS/0059-sesion-y-admision-vs01.md
    statement: >
      La app autentica con Google mediante OIDC integrado en el servidor, usando una
      biblioteca mantenida para autenticación y sesiones, elegida con su ADR según R-05.
      El cliente OAuth es web, de audiencia Internal, y solicita solo scopes de identidad
      (openid, email, profile), sin scopes de Drive; no cambia D-0057. La admisión exige
      token válido, email verificado, pertenencia al Workspace y presencia en una lista
      explícita de cuentas corporativas que provee el owner antes del piloto; la
      identidad se asocia por el identificador estable de Google (sub), no por el email.
      Páginas y consultas de datos exigen sesión válida y admisión vigente del lado del
      servidor, con pruebas negativas. Sin registro público ni acceso automático para
      todo el dominio; los integrantes no se infieren. No usa Supabase Auth (D-0013).
      Desde la fase 5 de T-0035 (2026-11-06), D-0072 reemplaza la audiencia Internal,
      la pertenencia al Workspace y la lista explícita de cuentas: Broker OS admite por
      invitación en la base, con cuentas de Google externas. Lo demás sigue vigente.
    superseded_in_part_by:
      - clause: Cliente OAuth de audiencia Internal
        by: D-0072
      - clause: Admisión por pertenencia al Workspace y por lista explícita de cuentas corporativas
        by: D-0072

  - id: D-0060
    title: openid-client y jose implementan el OIDC y la sesión de VS01
    status: ACCEPTED
    date: 2026-09-24
    source: T-0018; D-0059 delega la biblioteca a un ADR; R-05 exige ADR por dependencia nueva
    adr: DECISIONS/0060-openid-client-y-jose.md
    statement: >
      La biblioteca que D-0059 dejó sin nombrar es openid-client (^6.8.8) para discovery,
      PKCE, canje del código y validación del ID token, acompañada de jose (^6.2.12) para
      cifrar la cookie de sesión como JWE. La regla de admisión —email verificado,
      pertenencia al Workspace por el claim hd y presencia en la lista del owner— queda
      fuera de la biblioteca, como función pura propia y probada, y no dentro de sus
      callbacks. Se descarta Auth.js/NextAuth para VS01. Acotado a
      packages/api/src/session/: ningún otro directorio importa estos paquetes, y el
      resto de la app depende del tipo Principal, no de cómo se obtuvo.

  # ── Método y arnés ───────────────────────────────────────────────────────

  - id: D-0015
    title: Project OS Zero es un repositorio, no una aplicación
    status: ACCEPTED
    date: 2026-09-07
    source: revisión externa del Charter
    adr: DECISIONS/0015-project-os-zero.md
    statement: >
      Project OS es TASKS/, DECISIONS/ y el ledger histórico ops/runs/. Sin base de datos,
      sin servicio, sin adapters, sin UI. Desde el 2026-11-09 la captura de AgentRun no es
      obligatoria y el criterio de promoción por conteo de runs se retiró (D-0085): Project
      OS se promueve a aplicación sólo por una decisión explícita del owner que nombre el
      caso de uso concreto que los archivos no resuelven.
    superseded_in_part_by:
      - clause: Criterio de promoción a aplicación con 30 AgentRuns reales y el tercer script ad-hoc
        by: D-0085

  - id: D-0016
    title: Proveedores de ejecución del arnés, sin asignación por tipo de tarea
    status: ACCEPTED
    date: 2026-09-07
    source: revisión externa del Charter
    statement: >
      Desde el 2026-11-07, el arnés admite Claude Code, Codex y Gemini como agentes de
      ejecución (D-0082). La asignación de proveedores por
      tipo de tarea es una hipótesis no testeada y no se adopta como política hasta
      que exista un experimento pareado con n suficiente. Esta decisión alcanza
      únicamente al arnés de Project OS y no restringe la arquitectura de IA de Broker OS
      como producto, que es una decisión separada.
    superseded_in_part_by:
      - clause: El arnés inicial soporta únicamente Claude Code
        by: D-0082

  - id: D-0017
    title: Toda tarea tiene criterios verificables
    status: ACCEPTED
    date: 2026-09-07
    source: revisión externa del Charter
    statement: >
      Toda tarea declara evidencia que permite comprobar el outcome. Cuando el
      resultado es mecánicamente verificable, declara comandos ejecutables. SPIKE y
      REVIEW pueden usar evidencia y comprobaciones humanas explícitas.

  - id: D-0018
    title: Los archivos de proveedor importan el neutral, no lo proyectan
    status: ACCEPTED
    date: 2026-09-07
    source: revisión externa del Charter
    statement: >
      AGENTS.md es el archivo neutral. CLAUDE.md lo importa con @AGENTS.md y agrega
      debajo solo lo específico de Claude Code. No se construye ningún generador de
      archivos de proveedor.

  - id: D-0019
    title: Vertical Slice 01 es Póliza + Documentos + Búsqueda
    status: ACCEPTED
    date: 2026-09-07
    source: revisión externa del Charter
    statement: >
      La primera rebanada vertical importa las pólizas vigentes en modo lectura, las
      vincula a sus carpetas de Drive y ofrece una búsqueda única. Sin efectos externos,
      sin agentes, sin portal. Debe ser útil aunque el resto del programa se cancele.

  - id: D-0020
    title: ContactPoint entra en VS01 como write-only
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §64 + revisión externa
    statement: >
      La migración puebla ContactPoint aunque VS01 todavía no lo use para resolver
      identidad. Sin esto, emails y teléfonos se descartan en el import y hay que
      reimportar.

  - id: D-0021
    title: La lista de aseguradoras es un conjunto curado con alias de importación
    status: ACCEPTED
    date: 2026-09-07
    source: DOMAIN.md §22-23 + revisión externa
    statement: >
      El importador no crea Insurers sobre la marcha desde strings de Zoho. La lista es
      cerrada y curada, con una tabla de alias para el matching.

  # ── Decisiones deliberadamente abiertas ──────────────────────────────────
  # No se resuelven durante la implementación. Requieren spike y ADR.

  - id: D-0022
    title: Punto de enforcement de autorización
    status: ACCEPTED
    date: 2026-11-03
    adr: DECISIONS/0022-punto-de-enforcement-de-autorizacion.md
    source: >
      DOMAIN.md §69 (abierta el 2026-09-07); spike T-0002 (SPIKES/T-0002-enforcement-autorizacion.md);
      aprobación del owner del 2026-11-03 en el hilo de T-0035; D-0063, D-0071, D-0072, D-0075.
    statement: >
      La autorización es híbrida. RLS de PostgreSQL controla qué filas ve cada principal
      según su identidad, las empresas asignadas y el contexto; la aplicación controla
      qué acciones están permitidas y explica quién puede hacerlas. Las restricciones
      críticas, empezando por que quien redacta una evaluación o un informe no lo
      aprueba ni lo acepta, se hacen cumplir en las dos capas; para uso interno rige la
      excepción de operador único de D-0083, que tampoco habilita entregar al cliente. La app, los workers y los
      agentes usan roles de mínimo privilegio, sin BYPASSRLS; el service role queda para
      migraciones y operación del owner. Cada contexto verifica sus propios permisos y no
      confía ciegamente en una identidad reenviada por otro. Decisiones funcionales: el
      revisor profesional no accede por defecto a pólizas ni a notas internas; el portal
      de empresas (C12) no muestra pólizas completas al inicio; el predicado de
      aseguradora queda fuera de alcance. La autenticación real, la propagación segura de
      la identidad, el uso del pooler, las restricciones de ejecución sobre funciones
      privilegiadas, la cobertura de RLS y la revocación inmediata son criterios de
      implementación y aceptación de C1 (T-0035), no investigación pendiente.

    superseded_in_part_by:
      - clause: Quien redacta una evaluación o un informe no lo aprueba ni lo acepta (sólo para uso interno)
        by: D-0083
  - id: D-0023
    title: Detalle de InsurerProfile
    status: OPEN
    date: 2026-09-07
    source: DOMAIN.md §24, §69
    statement: >
      Determinar qué atributos específicos requiere InsurerProfile además de la
      referencia curada. INSURER no se modela como PartyRole.
    unblocked_by: POC de cotización

  - id: D-0024
    title: Unicidad física de ContactPoint
    status: OPEN
    date: 2026-09-07
    source: DOMAIN.md §20, §69
    statement: >
      Constraint estricta o conflicto explícito gestionado por la aplicación.
      Validar contra datos reales; hay líneas compartidas y números reciclados.
    unblocked_by: POC de WhatsApp

  - id: D-0025
    title: Representación de la cobertura en PolicyVersion
    status: OPEN
    date: 2026-09-07
    source: DOMAIN.md §28, §69
    statement: >
      Cuánto de coverageData debe estructurarse. No decidir antes de observar pólizas
      reales de al menos dos compañías.
    unblocked_by: VS01

  - id: D-0026
    title: Representación de InsuranceProduct
    status: OPEN
    date: 2026-09-07
    source: DOMAIN.md §69
    statement: >
      Determinar cuándo los códigos y nombres de producto dejan de ser suficientes.
    unblocked_by: POC de cotización

  - id: D-0027
    title: Estructura de PortfolioAssignment
    status: ACCEPTED
    date: 2026-11-03
    source: DOMAIN.md §55, §69; aprobación del owner en el hilo de T-0035 (2026-11-03)
    adr: DECISIONS/0078-asignacion-de-clientes.md
    statement: >
      La asignación es explícita, de usuario a cliente, con intervalo de validez y sin
      superposición; el cliente puede ser una empresa o una persona. Asignar una empresa
      da su información comercial, sus pólizas y la identificación mínima de sus miembros
      vigentes, pero no las pólizas personales, el perfil, los contactos ni los
      documentos de esos miembros: eso exige asignar a la persona. La póliza completa la
      ve quien tiene asignado al tomador vigente; quien tenía a un tomador anterior
      conserva sólo la cabecera y las versiones de su época.
    unblocked_by: T-0035

  - id: D-0028
    title: Persistencia de comunicaciones, Gmail vs WhatsApp
    status: SUPERSEDED
    date: 2026-09-07
    source: DOMAIN.md §50-52, §69
    statement: >
      Gmail permite índice de metadata y recuperación posterior. WhatsApp desde un
      dispositivo físico probablemente exija persistir contenido; eso cambia la
      clasificación de datos.
    unblocked_by: POC de WhatsApp

  - id: D-0029
    title: Abstracción RiskObject
    status: OPEN
    date: 2026-09-07
    source: DOMAIN.md §38, §69
    statement: >
      Determinar cuándo emerge una estructura común a distintos ramos. Aplica la regla
      de dos: hacen falta dos estructuras de riesgo con necesidad compartida.
    unblocked_by: segundo ramo modelado

  - id: D-0030
    title: Granularidad futura de Prospect
    status: OPEN
    date: 2026-09-07
    source: DOMAIN.md §14, §69
    statement: >
      Determinar si la prospección debe permanecer como una aserción sobre Party o
      pertenecer a una oportunidad o producto específico.
    unblocked_by: POC de oportunidad comercial

  # ── Cierre de discovery de Migración ─────────────────────────────────────

  - id: D-0031
    title: Baseline de migración y curación humana de T-0004
    status: ACCEPTED
    date: 2026-09-19
    source: Aprobación humana de cierre de T-0004; REVIEWS/T-0004-insumos-vs01.md
    statement: >
      Se acepta el baseline de discovery de T-0004 sobre el lote Zoho de septiembre
      de 2026: Policy con Estado exactamente VIGENTE o Vigencia Fin entre
      2026-01-01 y 2026-09-16 inclusive, sus Endorsements, todas las Opportunities
      y Claims, Tasks creadas en 2026 y closure de Contactos/Cuentas a punto fijo.
      Las contradicciones Estado/fecha no alteran inclusión. Cuenta prevalece como
      tomador cuando hay Cuenta y Contacto; Contacto queda relacionado. Claims
      históricos pueden conservar referencia fuente sin FK interna a Policy.
      El tratamiento de la identidad fiscal de este lote queda definido por D-0035, y
      todo merge fiscal requiere revisión humana. La relación entre tomador y Contacto
      asociado queda definida por D-0036. Emision no es core a migrar; Productos
      representa ramo/tipo.
      La curación humana aprueba 14 NEW_ENTITY y 1 SAME_ENTITY para los 15 Productos
      huérfanos, y 10 NEW_ENTITY y 3 SAME_ENTITY, todos ASEGURADORA, para los 13
      Proveedores huérfanos en scope; sin ALIAS_OF ni REVIEW en esos 28 casos.
      Se preservan source IDs, displays y trazabilidad; no se crean jerarquías ni
      se fusionan entidades por similitud o grupo empresarial. Las restantes
      entradas de los 37 Proveedores conservan su clasificación derivada o pendiente.
      Esto aprueba insumos y tratamiento de migración, no ejecuta altas, merges ni
      importación ni cambia el schema. Esta decisión conserva autoridad sobre evidencia,
      scope, curación y reglas de migración, y no es fuente canónica de semántica de
      dominio: sus conclusiones de dominio viven en DOMAIN.md y en los ADR que las
      motivaron.
    superseded_in_part_by:
      - clause: identidad fiscal obligatoria para entidades validadas
        by: D-0035
      - clause: relación entre tomador y Contacto asociado de una Policy
        by: D-0036

  - id: D-0032
    title: Cierre de discovery documental con conciliación asistida
    status: ACCEPTED
    date: 2026-09-19
    source: Aprobación humana de cierre de T-0004; REVIEWS/T-0004-drive-validation.md
    statement: >
      La estrategia de migración de Drive legacy conserva las referencias existentes
      y permite vincularlas mediante conciliación asistida cuando haya evidencia
      suficiente. Un 404 bajo la identidad de discovery no prueba inexistencia ni
      invalidez de la referencia. T-0004 se cierra con estrategia definida,
      limitaciones observadas mediante muestra y tratamiento explícito de
      conciliación; no exige demostrar vinculación automática general entre Policy
      y documento histórico. Se acepta como capacidad futura que Broker OS pueda
      crear estructura canónica para Contactos/Cuentas sin carpeta histórica validada;
      su diseño, alineación con D-0009 y autorizaciones se resolverán después, sin
      habilitar escrituras ahora ni alterar el alcance de solo lectura de VS01.
      Automatización de Drive, normalización, permisos operativos, creación de
      carpetas, navegación/creación/guardado desde /ingresar, navegación por LLM y
      vínculo automático Policy-documento quedan fuera de T-0004 para trabajo
      posterior específico. No se modifican Drive ni sus permisos para este cierre.

  # ── Alineación de dominio (T-0015) ───────────────────────────────────────

  - id: D-0033
    title: La migración persiste en staging; el dominio recibe solo lo modelado
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; D-0031
    adr: DECISIONS/0033-frontera-staging-y-dominio.md
    statement: >
      La migración persiste el scope aprobado por D-0031 en un staging fiel al origen,
      separado del dominio. Staging responde qué existía en Zoho y conserva IDs
      originales, relaciones relevantes del origen, valores originales necesarios,
      batch/snapshot de importación y trazabilidad hacia el origen. El dominio responde
      cómo entiende Broker OS el negocio y recibe únicamente conceptos suficientemente
      validados para ser MODELED NOW. Persistir información migrada no implica exponerla
      en producto ni promover un módulo de Zoho a entidad de dominio. La única excepción
      a la fidelidad de staging son las reglas de descarte definidas explícitamente.

  - id: D-0034
    title: ExternalReference representa lo que existe en el origen y no en el dominio
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; medición M2
    adr: DECISIONS/0034-external-reference.md
    statement: >
      Las referencias conocidas hacia entidades externas, históricas o todavía no
      migradas que tienen valor operativo dentro de Broker OS se representan mediante
      ExternalReference, con sourceSystem, sourceEntityType, sourceExternalId o valor
      original, relationType, resolutionStatus, unresolvedReason cuando corresponda, y
      resolvedTargetType y resolvedTargetId si posteriormente se resuelve. Resolver una
      referencia nunca borra ni sobrescribe la referencia original. No es una relación
      polimórfica genérica: existe únicamente cuando la referencia no resuelta necesita
      sobrevivir en el dominio o en el producto. Staging sigue siendo la representación
      fiel del origen, y no toda FK rota del origen merece un ExternalReference.

  - id: D-0035
    title: La identidad fiscal es una condición derivada de calidad de datos
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; D-0031
    adr: DECISIONS/0035-identidad-fiscal-derivada.md
    statement: >
      CUIT y CUIL son opcionales y su función en Broker OS es ser señal fuerte de
      matching y detección de duplicados, no un lifecycle propio ni un requisito de
      validez. Su ausencia no impide crear, migrar ni mantener activa una Party.
      Party.status no representa completitud fiscal. Missing, invalid y conflict son
      condiciones derivadas de calidad de datos, no estados de Party. Staging conserva
      siempre el valor original del origen, incluso inválido; el dominio conserva el
      valor normalizado válido. Matching nunca implica merge automático. No se crea
      TaxIdentity.

  - id: D-0036
    title: Una Policy tiene un único tomador; el Contacto asociado no es parte contractual
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; mediciones M5 y D-0031
    adr: DECISIONS/0036-tomador-unico-de-policy.md
    statement: >
      Una PolicyVersion tiene exactamente un tomador. Cuando el origen presenta Cuenta y
      Contacto, la Cuenta es el tomador y el Contacto es una persona de referencia de esa
      empresa que no adquiere por ese hecho ningún rol contractual sobre la Policy.
      Cuando el origen presenta únicamente Contacto, esa persona física es el tomador.
      La relación persona-organización pertenece a OrganizationMembership, no a la
      Policy. El contact_id del origen se preserva en staging para trazabilidad y no se
      promueve automáticamente a una relación Policy-Contact. No se crea PolicyParty.
      Las Policies del origen sin tomador no se promueven al dominio hasta resolverse:
      permanecen en staging como excepción y no reciben un tomador ficticio.

  - id: D-0037
    title: Endorsement es un evento asociado a una Policy y exige Policy padre
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; mediciones M3 y M8
    adr: DECISIONS/0037-endorsement-modeled-now.md
    statement: >
      Endorsement pasa a MODELED NOW como evento del origen asociado a una Policy, no
      necesariamente contractual, con identidad o número, Policy asociada, tipo, fechas,
      referencia de origen y vínculo documental cuando exista. Endorsement.policyId no es
      nullable: un Endorsement existe en Broker OS solo si puede asociarse
      inequívocamente a una Policy que también se importa. Los Endorsements sin Policy
      padre se descartan del conjunto migrable, no entran a staging, no generan
      ExternalReference y permanecen únicamente dentro del export crudo preservado.
      Un Endorsement no sobrescribe el estado anterior. Qué tipos de Endorsement producen
      una nueva PolicyVersion se determina mediante una tabla curada explícita; el
      importador no lo infiere. No se modela todavía workflow, SLA, responsable,
      approvals ni máquina de estados.

  - id: D-0038
    title: El número de póliza es único por aseguradora
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; medición M1
    adr: DECISIONS/0038-unicidad-numero-de-poliza.md
    statement: >
      El par (insurerId, policyNumber) es único. Dos registros del origen con la misma
      combinación son una anomalía por error humano o duplicación, no un caso válido del
      dominio. Toda colisión se resuelve explícitamente antes de importar: el importador
      no descarta, no sobrescribe y no fusiona filas para satisfacer el constraint, y las
      deriva a la cola durable de excepciones. Una Policy del origen sin aseguradora no
      puede formar el par y recibe el mismo tratamiento.

  - id: D-0039
    title: Agentes de desarrollo y agentes de producto tienen reglas distintas de datos
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; ENGINEERING_RULES.md R-19
    adr: DECISIONS/0039-clases-de-agente-y-datos-de-cliente.md
    superseded_in_part_by:
      - clause: Distinción limitada a dos clases y prohibición de información económica empresarial e incidentes operacionales para preparación de Risk OS
        by: D-0070
    statement: >
      Se distinguen agentes de desarrollo y de producto; D-0070 agrega la clase de
      preparación/análisis de datos de Risk OS y refina sólo para ella el alcance de
      las categorías especialmente sensibles descritas abajo. Los agentes de desarrollo no reciben PII real
      de clientes salvo excepción explícita y justificada, y trabajan con identificadores
      internos, datos sintéticos o anonimizados. Los agentes de producto de Broker OS
      pueden procesar datos reales cuando sean necesarios para ejecutar una función
      explícita y autorizada, enviando únicamente los datos mínimos necesarios para esa
      finalidad. En v1 pueden procesarse identidad y contacto, vehículos, inmuebles,
      Policies, coberturas y documentación administrativa o comercial relacionada. Las
      categorías especialmente sensibles de DOMAIN.md quedan prohibidas para modelos
      externos en v1: los documentos que las contengan se rechazan, se redactan o se
      derivan a revisión humana. Nunca se envían credenciales, secretos ni tokens.
      Ningún proveedor ni modelo queda autorizado a procesar datos reales por efecto de
      esta decisión: cada proveedor y modelo requiere aprobación explícita previa. Toda
      operación LLM sobre datos reales es auditable por función, usuario, recurso,
      proveedor y modelo, categoría de datos y timestamp, sin duplicar PII
      innecesariamente ni guardar prompts completos en logs.

  - id: D-0040
    title: La autoridad documental se descompone en ejes; VS01 no escribe en Drive
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; D-0009 y D-0032
    adr: DECISIONS/0040-ejes-de-autoridad-documental.md
    statement: >
      La autoridad documental de D-0009 se descompone en ejes. Drive es autoritativo
      sobre contenido y sobre ACLs y permisos, sin excepción. La ubicación y la
      estructura actuales se leen y se respetan; Broker OS puede proponer una estructura
      canónica futura, y proponerla no lo convierte en autoridad sobre la ubicación.
      Broker OS es autoritativo sobre sus referencias, su clasificación y su metadata.
      VS01 es estrictamente de solo lectura sobre Drive: no crea, no mueve, no renombra,
      no modifica y no elimina archivos ni carpetas. Toda capacidad futura de escritura
      requiere decisión y tarea específicas y aprobación humana. La convención de nombres
      aplica a la estructura futura y no dispara normalización automática de carpetas
      históricas.

  - id: D-0057
    title: Q-15 — VS01 vincula Drive por enlaces con comprobación humana, sin integración API
    status: ACCEPTED
    date: 2026-09-23
    source: >
      Respuesta del owner a Q-15 del 2026-09-23 (sesión de dirección Q4, S0).
      Manuel administra el Workspace. Aplica D-0009, D-0032 y D-0040.
    statement: >
      T-0017 no integra la API de Google Drive ni configura OAuth, proyecto de Google
      Cloud, cuenta de servicio, delegación ni cuenta de integración, y no modifica
      permisos. Broker OS carga referencias documentales desde un insumo local revisado
      y muestra sus enlaces; cada persona abre el destino con su propia sesión de Google
      y Drive sigue determinando el acceso. La vinculación y la comprobación son
      asistidas por una persona, que registra por relación quién la verificó, con qué
      evidencia, cuándo y bajo qué cuenta comprobó la apertura. Esa comprobación no
      garantiza acceso para otros usuarios ni acceso permanente. VS01 ofrece el archivo
      de la póliza cuando su asociación está revisada y, en su defecto, la carpeta del
      cliente cuando su relación con el cliente está sustentada; la interfaz distingue
      "Abrir documento" de "Abrir carpeta del cliente", y una carpeta vinculada conserva
      el pendiente documental. Sin referencia sustentada se muestra la ausencia. Los
      casos no comprobados, ambiguos o inaccesibles permanecen pendientes sin ocultar la
      póliza ni inferir inexistencia; un 404 bajo una cuenta no demuestra inexistencia.
      Abrir una carpeta no cuenta como abrir el documento objetivo. La conciliación
      prioriza los 20 casos congelados para la aceptación, sin reemplazar casos
      difíciles. La consulta automática de metadatos se evaluará en una tarea posterior
      solo si aparece una necesidad concreta. Los enlaces que Zoho informa y nadie
      comprobó se muestran como un nivel propio, distinto del comprobado, según D-0064.
    superseded_in_part_by:
      - clause: sólo se ofrecen como enlace las relaciones comprobadas por una persona
        by: D-0064

  - id: D-0041
    title: InsuranceProduct proviene de un catálogo curado
    status: ACCEPTED
    date: 2026-09-19
    source: T-0015; respuestas humanas definitivas del 2026-09-19; D-0021 y D-0031
    adr: DECISIONS/0041-catalogo-curado-de-producto.md
    statement: >
      El importador no crea InsuranceProduct desde strings ni desde filas desconocidas
      del origen. El catálogo de ramos es curado, del mismo modo que el de aseguradoras
      en D-0021, y las referencias huérfanas se reportan para resolución humana. Esta
      decisión fija la procedencia del catálogo y no resuelve ni estructura D-0026.

  # ── Regularización y controles locales (T-0008) ───────────────────────────

  - id: D-0042
    title: Parser YAML estándar para el contexto versionado
    status: ACCEPTED
    date: 2026-09-20
    source: T-0008; regularización de la dependencia existente en package.json y pnpm-lock.yaml
    adr: DECISIONS/0042-parser-yaml.md
    statement: >
      Los validadores y lectores del contexto versionado usan el paquete yaml como
      parser estándar de decisions.yaml y del frontmatter de tareas. La regularización
      documenta la dependencia existente, sin agregar paquetes ni cambiar su versión.
      La validación semántica del contrato permanece en los scripts del repositorio.

  - id: D-0043
    title: ¿Un segundo proveedor mejora la calidad de la revisión?
    status: OPEN
    date: 2026-09-20
    source: T-0008; pregunta pendiente vinculada a D-0016
    statement: >
      Determinar si un segundo proveedor mejora la detección de defectos en revisiones
      independientes lo suficiente para justificar su costo y complejidad operativa.
      Registrar la pregunta no incorpora otro proveedor ni cambia D-0016.
    unblocked_by: >
      Experimento pareado sobre las mismas TaskSpecs y diffs, con contexto controlado,
      criterios de evaluación definidos antes de medir y tamaño de muestra justificado;
      comparar defectos confirmados, falsos positivos, costo y tiempo de revisión.
      Diseñar y autorizar el experimento antes de ejecutarlo.

  - id: D-0044
    title: Control local de Bash para rutas protegidas
    status: SUPERSEDED
    date: 2026-09-20
    source: T-0008; pedido del owner de completar la tarea y prueba real del hook
    adr: DECISIONS/0044-control-bash-rutas-protegidas.md
    statement: >
      Se incorpora un PreToolUse de Claude Code para Bash que rechaza destinos de escritura
      reconocidos bajo .claude y .github/workflows, incluyendo rutas canónicas y aliases
      por symlink. Los comandos opacos o con efectos no determinables requieren revisión
      humana; nunca reciben autorización automática del hook. Este control no agrega
      rutas a permissions.deny ni modifica D-0016. Los cambios futuros del control
      requieren aprobación humana según R-13/R-15. Es una defensa local,
      no un sandbox ni una garantía frente a todo proceso o proveedor.
    falsified_by: >
      Que una prueba documentada permita una escritura protegida sin intervención humana,
      que el runtime ignore la revisión solicitada o que la tasa de solicitudes sobre el
      trabajo habitual haga inviable el control. Las denegaciones y el caso permitido
      deben conservar pruebas en una sesión real; la prueba aislada no basta.

  # ── Entorno de desarrollo ejecutable (T-0010) ─────────────────────────────

  - id: D-0045
    title: El schema vive en migraciones SQL, no en un modelo de aplicación
    status: PROVISIONAL
    date: 2026-09-20
    source: T-0010; invariantes de PolicyVersion en DOMAIN.md §67; D-0013
    adr: DECISIONS/0045-schema-en-migraciones-sql.md
    statement: >
      Las migraciones SQL son la fuente de verdad del schema y los tipos de TypeScript se
      derivan de la base, no al revés. No se adopta ORM ni DSL de schema. La razón es que
      las invariantes centrales del dominio —intervalos de PolicyVersion no solapados vía
      EXCLUDE USING gist con btree_gist, a lo sumo una versión abierta vía índice único
      parcial— no son expresables en los DSL disponibles, de modo que un modelo en
      TypeScript dejaría esas invariantes fuera del archivo que dice ser el schema. La
      decisión fija dónde vive el schema; no elige driver ni capa de consulta.
    falsified_by: >
      Que la superficie de escritura crezca hasta que el costo por consulta —escribir y
      mantener SQL a mano para cada operación, y derivar los tipos— supere lo que hoy se
      gana en expresividad de constraints y en costo de salida de D-0013. La señal es la
      cantidad de operaciones de escritura distintas y lo repetitivo de su SQL, no la
      cantidad de tablas.

  - id: D-0046
    title: Postgres local nativo, CI en contenedor
    status: PROVISIONAL
    date: 2026-09-20
    source: T-0010; R-17; R-26; D-0013
    adr: DECISIONS/0046-postgres-local-nativo.md
    statement: >
      Postgres corre nativo en la máquina de desarrollo, con la versión mayor fijada en
      .postgres-version y validada antes de cada operación sobre la base. CI corre la
      misma versión mayor dentro de un contenedor. La diferencia entre ambos entornos se
      acepta a conciencia bajo R-17: el veredicto lo da CI y no la máquina local. No se
      adopta Docker ni el stack local de Supabase, que traería productos que D-0013 dejó
      como decisiones separadas.
    falsified_by: >
      Un fallo de CI por deriva de versión o de configuración que la máquina local no
      reproduzca y que un contenedor local habría atrapado, o que el setup manual
      termine costando, sumado entre las máquinas del equipo, más que instalar y
      mantener Docker.

  - id: D-0047
    title: Toolchain de verificación TypeScript, ESLint y el runner de Node
    status: ACCEPTED
    date: 2026-09-20
    source: T-0010; R-05 exige ADR por dependencia nueva; R-25 y R-26
    adr: DECISIONS/0047-toolchain-de-verificacion.md
    statement: >
      La verificación de código se apoya en TypeScript en modo estricto para los tipos,
      ESLint con typescript-eslint para el lint y los límites de módulo de R-25, y el
      runner nativo node --test sobre archivos .ts ejecutados con el type stripping de
      Node. El tsconfig fija erasableSyntaxOnly para que lo que el runtime no puede
      ejecutar falle en el type check. Los tres comandos existen por separado; su
      incorporación a pnpm check es de T-0012.

  - id: D-0048
    title: Procedimiento de revisión ciega por subagente aislado
    status: ACCEPTED
    date: 2026-09-21
    source: T-0009; R-33
    statement: >
      Un subagente que arranca sin el historial de conversación, sin los skills
      invocados y sin los archivos que leyó quien implementó aporta independencia de
      revisión hoy, sin depender de un segundo execution provider ni de resolver
      D-0016. El procedimiento fija cinco condiciones: contrato leído desde main, diff
      completo con tests, decisions.yaml y DOMAIN.md buscados por el reviewer sin
      extracto curado, verificación ejecutada antes de leer la evidencia, y salida
      categorizada Act on / Consider / Noted / Dismissed con justificación obligatoria
      en los Dismissed. No vuelve obligatoria la revisión para ningún PR ni la conecta
      a CI.
    falsified_by: >
      Una revisión que siguiendo el procedimiento no aporte nada que la revisión del
      mismo agente implementador no hubiera encontrado, sobre una muestra de PRs
      suficiente para distinguir señal de ruido.

  # ── Alcance de la revisión ciega (T-0009, cerrado con la evidencia de T-0012) ──

  - id: D-0052
    title: La revisión ciega es obligatoria en FEATURE y MIGRATION
    status: ACCEPTED
    date: 2026-09-21
    source: >
      T-0009; contraste entre las dos primeras revisiones ciegas reales, sobre T-0010
      y sobre T-0012. El id salta de D-0048 porque D-0049 a D-0051 quedaron reservados
      para T-0012, que estaba sin mergear al registrarse esta decisión.
    statement: >
      Todo PR de una tarea de kind FEATURE o MIGRATION pasa por el procedimiento de
      revisión ciega de D-0048 antes del merge, y el reporte queda versionado en
      REVIEWS/. Desde el 2026-11-09 también la exige todo diff que toque una ruta
      sensible, sea cual sea el kind, y CI comprueba que el reporte exista (D-0086). El PR
      que sólo planifica una tarea nueva (la agrega y el resto del diff es texto de la lista
      del ADR de D-0086) no la exige (T-0044). En los demás casos la revisión es opcional y la pide quien implementa o
      quien revisa.
    superseded_in_part_by:
      - clause: La obligatoriedad es de procedimiento y no se hace cumplir por CI
        by: D-0086
  # ── T-0012 ───────────────────────────────────────────────────────────────

  - id: D-0049
    title: Driver de PostgreSQL para consultas y tests de integración
    status: ACCEPTED
    date: 2026-09-21
    source: T-0012; D-0045; R-05 exige ADR por dependencia nueva
    adr: DECISIONS/0049-driver-postgres-para-tests-de-integracion.md
    statement: >
      Se adopta `postgres` (porsager) como driver de PostgreSQL: delgado, sin ORM, sin
      DSL de schema, con tipos de TypeScript anotados por consulta en vez de un modelo
      de tablas declarado por adelantado. D-0045 fijó dónde vive el schema; esta
      decisión fija solo cómo se consulta, no reabre esa elección.

  - id: D-0050
    title: Formato físico mínimo de coverageData en PolicyVersion
    status: ACCEPTED
    date: 2026-09-21
    source: T-0012; respuesta del owner a Q-12, 2026-09-21; D-0033
    adr: DECISIONS/0050-formato-fisico-de-coverage-data.md
    statement: >
      policy_version.coverage_data es jsonb, nullable, sin estructura de claves
      impuesta por el schema ni DEFAULT de relleno. NULL significa dato ausente, nunca
      ausencia de cobertura. coverage_source_batch_id y coverage_source_record_id
      sostienen la trazabilidad mínima hacia el origen que D-0033 exige, sin FK porque
      el schema de staging no existe todavía. Esta decisión no estructura ni interpreta
      contenido de cobertura y no resuelve D-0025, que permanece OPEN.

  - id: D-0051
    title: Schema de VS01 con las invariantes de DOMAIN.md §67 como constraints
    status: ACCEPTED
    date: 2026-09-21
    source: T-0012; DOMAIN.md §63-67; R-05 exige ADR por cambio de schema en Party y Policy
    adr: DECISIONS/0051-schema-vs01-invariantes-como-constraints.md
    statement: >
      Se crea el schema del subconjunto de DOMAIN.md §63 para VS01 en
      packages/db/migrations/0001_vs01_core_schema.sql, con INV-001 a INV-023 e
      INV-PV-001 a INV-PV-006 cubiertas por constraint, índice o trigger donde son
      expresables, y documentadas con su límite donde no lo son. PartyRole.validTo IS
      NULL es la autoridad de "rol activo" para INV-006, acordado con el owner: status
      queda como campo secundario sin participar del enforcement. El EXCLUDE de
      PolicyVersion (policy_id, daterange con effective_to coalescido a infinity) es el
      mecanismo real tanto de INV-PV-003 como de INV-PV-004; el índice único parcial
      adicional no es causalmente independiente mientras ese EXCLUDE exista, y se
      documenta así en vez de reportar una prueba de causalidad ficticia. Ningún
      concepto pasa de NAMED a MODELED. D-0025, D-0022, D-0026 y D-0027 permanecen OPEN.

  # ── Acceso a datos reales en la migración (T-0013) ────────────────────────

  - id: D-0053
    title: Excepción acotada a R-19 para el importador de T-0013
    status: ACCEPTED
    date: 2026-09-21
    source: >
      Q-14, respondida por el owner el 21/09/2026; R-19, que prevé la excepción explícita
      y justificada; D-0039, que separa agentes de desarrollo de agentes de producto.
    adr: DECISIONS/0053-acceso-a-datos-reales-en-t-0013.md
    statement: >
      Para T-0013, y sólo para T-0013, un agente de desarrollo queda autorizado a acceder
      a los datos reales del lote de Zoho preservado por T-0004 — implementar, ejecutar y
      verificar la importación, y diagnosticar sus fallos—. La autorización nombra
      proveedor claude-code y modelo sonnet-5 bajo la cuenta del owner, y alcanza también
      al subagente de revisión ciega que R-33 exige para una tarea MIGRATION, que corre
      bajo esas mismas condiciones. No se extiende a otros modelos, proveedores ni
      tareas, y no se concede de forma general ni permanente.
      El acceso se limita a los datos mínimos necesarios, con preferencia por consultas
      acotadas y resultados agregados sobre la lectura de registros completos. El agente
      puede leer el lote y escribir en staging y en la base local; no accede a Zoho ni a
      Drive, y no los modifica. Los originales se conservan sin cambios, bajo custodia del
      owner en su máquina, y los datos reales quedan fuera del versionado y de CI.
      Los cuatro límites de R-19 siguen vigentes sin excepción: nada de credenciales ni
      secretos; las categorías especialmente sensibles siguen prohibidas para modelos
      externos y se excluyen del contexto y se derivan a revisión humana si aparecen;
      ninguna PII entra a logs, tareas, reportes versionados ni código; y la trazabilidad
      se registra sin reproducir datos personales.

  # ── Pertenencia de referencias documentales (T-0019) ─────────────────────

  - id: D-0054
    title: La pertenencia documental se separa del destino resuelto
    status: ACCEPTED
    date: 2026-09-21
    source: >
      T-0019; STOP de la revisión ciega de T-0016; definición humana del 21/09/2026;
      DOMAIN.md §63 y §74; D-0034.
    adr: DECISIONS/0054-pertenencia-de-referencia-documental.md
    statement: >
      Una referencia documental se asocia a su única Policy de pertenencia mediante
      policy_document_reference, con clave primaria sobre externalReferenceId y claves
      foráneas RESTRICT hacia ExternalReference y Policy. La Policy de pertenencia es
      un eje distinto del destino que la referencia intenta resolver: resolvedTargetType
      y resolvedTargetId permanecen exclusivamente en ExternalReference. La asociación
      no duplica ni modifica sourceSystem, sourceEntityType, sourceExternalId,
      sourceValue, resolutionStatus o unresolvedReason, y no convierte
      ExternalReference en una relación polimórfica genérica. relationType =
      POLICY_DOCUMENT discrimina físicamente estas referencias; la participación en
      la asociación es total y diferible dentro de la transacción, y la asociación
      rechaza cualquier otro relationType.

  # ── Dependencias del importador de Zoho (T-0013) ──────────────────────────

  - id: D-0055
    title: csv-parse como parser de CSV para el importador de T-0013
    status: ACCEPTED
    date: 2026-09-22
    source: R-05 (dependencia nueva); packages/db/src/import/csv.ts
    adr: DECISIONS/0055-csv-parse-para-el-importador.md
    statement: >
      El importador de T-0013 lee los CSV del lote de Zoho con csv-parse (^7.0.2), no
      con un split manual: los CSV reales tienen comas, comillas y saltos de línea
      embebidos en campos de texto libre, y un parser ad hoc los corrompería en silencio
      en vez de fallar de forma visible. Acotado a packages/db/src/import/csv.ts, cuyo
      contrato hacia el resto del importador es un AsyncGenerator de objetos
      header→valor, no un tipo de la librería.

  # ── Session Trust Mode para Bash (Q4, S0) ─────────────────────────────────

  - id: D-0056
    title: El hook de Bash deniega rutas protegidas y delega lo indeterminado al modo de sesión
    status: PROVISIONAL
    date: 2026-09-23
    supersedes: [D-0044]
    source: >
      Pedido del owner del 2026-09-23 (Q4 Operating Plan, sección 9, Session Trust Mode).
      Se cumplió el criterio de falsación de D-0044: la tasa de solicitudes sobre el
      trabajo habitual hizo inviable el control. La documentación de hooks de Claude Code
      indica que "ask" fuerza el prompt incluso en bypassPermissions y auto, e impide
      autorizar la sesión completa.
    statement: >
      El PreToolUse de Bash conserva la denegación de destinos de escritura reconocidos
      bajo .claude y .github/workflows, incluidas rutas canónicas, aliases por symlink,
      traversal y comandos compuestos que mencionan esas rutas; esas denegaciones
      aplican en todos los modos. Pide revisión (ask) solo cuando un argumento es un
      archivo con hardlinks. Para comandos cuyos efectos no puede determinar no emite
      decisión: el flujo normal de permisos y el modo elegido por el owner para la
      sesión deciden (Manual pregunta; auto usa el clasificador; bypassPermissions
      ejecuta). El hook nunca emite allow. No modifica permissions.deny ni D-0016.
      Cambios futuros del control requieren aprobación humana según R-13/R-15. Es una
      defensa local, no un sandbox: en auto o bypass, un programa que calcule su destino
      puede escribir rutas protegidas sin que el hook lo detecte; CI sigue siendo
      autoritativo (R-17).
    falsified_by: >
      Que una sesión en auto o bypass modifique .claude o .github/workflows sin revisión
      humana y el cambio llegue a main, o que el owner necesite revisar por comando para
      mantener confianza en las sesiones, en cuyo caso se reevalúa con sandbox de
      filesystem en lugar de volver al ask universal.

  # ── Preparación de los casos de aceptación de VS01 (T-0018) ───────────────

  - id: D-0061
    title: Excepción acotada a R-19 para armar los casos de aceptación de VS01
    status: ACCEPTED
    date: 2026-09-25
    source: >
      Pedido explícito del owner del 2026-09-25 en la sesión de dirección Q4 (Cowork),
      eligiendo registrar esta excepción; R-19; D-0039; SLICES/VS01.md §4.
    statement: >
      Para la preparación de los 20 casos de aceptación de T-0018, y sólo para eso, un
      agente de desarrollo queda autorizado a tratar datos reales de clientes: proveedor
      Anthropic, modelo claude-opus-5-5, en la sesión Cowork del owner, bajo su cuenta.
      Puede leer los módulos Pólizas, Contactos y Cuentas del lote de Zoho del 16/09
      preservado por T-0004, y los datos que el owner le entregó en esa sesión. Puede
      escribir únicamente en data/vs01-acceptance/ (casos.csv, seleccion.md y
      vinculos.csv), ignorado por Git. No accede a Zoho ni a Drive, no abre documentos y
      no marca relaciones como VERIFIED: la comprobación de enlaces sigue siendo humana
      (D-0057). El agente propone casos; la selección final y el congelamiento los hace
      el owner (SLICES/VS01.md §4.1). La excepción no se extiende a otras tareas,
      modelos, proveedores ni sesiones y vence al congelar los casos. Los límites de
      R-19 siguen vigentes: sin credenciales, sin categorías especialmente sensibles y
      sin PII en Git, logs, tareas, reportes versionados ni código; las salidas del
      agente hacia la conversación se limitan a códigos de caso y chequeos agregados.
      Se registra con honestidad que el owner ya había pegado fichas de pólizas en esa
      conversación antes de esta decisión.

  - id: D-0062
    title: Carga de los datos reales de VS01 en Supabase y Vercel de plan gratuito para el piloto
    status: PROVISIONAL
    date: 2026-09-28
    source: >
      Decisión y autorización del owner del 2026-09-26, ajustada el 2026-09-28 al proyecto nuevo en São Paulo (R-13) en la sesión de dirección
      Q4, tras revisar los riesgos del plan gratuito; pregunta abierta 9 del Q4 Operating
      Plan (presupuesto); D-0013, D-0014, D-0053, D-0058, D-0059.
    statement: >
      El owner autoriza cargar en un proyecto de Supabase nuevo y dedicado a producción, en
      plan Free y región sa-east-1 (São Paulo), los datos de VS01 de su base local de
      T-0013, para el piloto y la medición de aceptación de T-0018, servidos por Vercel en
      plan Hobby. El proyecto con el lote sintético se conserva como base de Preview.
      Se carga sólo lo que la app consulta: party, person_profile, organization_profile,
      organization_membership, insurer, insurer_alias, policy, endorsement,
      policy_version, document_link, external_reference, policy_document_reference y
      staging_import_batch. No se cargan las filas crudas de staging de Zoho, los puntos
      de contacto, los roles de parte, los vínculos de fuente ni usuarios. La carga la
      ejecuta el owner desde su máquina; ningún agente accede a los datos (R-19; D-0053
      no se extiende). Los despliegues de Preview sólo reciben la cadena del proyecto
      sintético, para que ningún preview sirva datos reales. Se aceptan
      explícitamente los riesgos del plan gratuito: las condiciones de uso de Vercel Hobby
      excluyen uso comercial, el proyecto de Supabase se pausa tras una semana sin
      actividad, no hay backups automáticos (el owner guarda una copia manual fuera del
      repositorio), los logs son cortos y el procesamiento implica transferencia
      internacional de datos personales. Los planes pagos se contratarán cuando el sistema
      esté listo para reemplazar al CRM de Zoho, sólo con una configuración concreta que
      el owner apruebe dentro del presupuesto de D-0076.
    falsified_by: >
      Que Vercel o Supabase suspendan el proyecto durante el piloto, que se pierdan datos
      sin copia recuperable, que una revisión legal objete la transferencia o el
      proveedor, o que el sistema pase a ser la base de trabajo antes de contratar los
      planes pagos.

  - id: D-0063
    title: Aislamiento por contexto dentro del monolito modular
    status: ACCEPTED
    date: 2026-09-29
    source: >
      Q4 Operating Plan (Risk OS v1 y Communication OS, sin integración exigida en Q4);
      revisión de arquitectura del 2026-09-29 con dos opiniones independientes, aprobada
      por el owner el mismo día; D-0012,
      D-0014, D-0028, D-0045, D-0062; DOMAIN.md §52 y §76; R-01, R-19, R-25. Pasa de
      PROVISIONAL a ACCEPTED con la decisión de cierre de Q4 del owner del 2026-11-02
      (D-0071, T-0034).
    adr: DECISIONS/0063-aislamiento-por-contexto-q4.md
    superseded_in_part_by:
      - clause: Vigencia limitada a Q4 2026 y prohibición de que Broker OS (packages/* y apps/web) importe un contexto
        by: D-0071
    statement: >
      Dentro del monolito modular de D-0012, el código y los datos se organizan también
      por contexto de negocio. Hay tres contextos: Broker (packages/* y apps/web
      actuales, sin moverse), Risk y Communication. Cada uno de los dos últimos
      es un paquete del workspace bajo contexts/, con dominio, persistencia y aplicación
      propios. Ningún contexto lee ni escribe el esquema de Postgres de otro. Ningún
      contexto importa código de otro, salvo que Broker OS consume la API de aplicación
      de Risk y Communication según D-0071; R-25 lo hace cumplir por lint desde el
      primer código de cada contexto.
      Cada contexto es dueño de su esquema, con sus migraciones. No se crea un núcleo
      compartido en Q4: una referencia a Party, si se agrega, es opaca y sin clave
      foránea. El trabajo largo o continuo corre en un worker propio del contexto, cuyo
      hosting sigue en D-0014. La unidad de despliegue de cada laboratorio la fija su
      contrato. Ninguno se despliega en el entorno de producción de VS01 ni usa sus
      credenciales o datos reales sin una autorización propia; D-0062 no se extiende.
      Colas genéricas, outbox, bus de eventos y adapters genéricos esperan al segundo
      caso (R-01). Extraer un contexto a un servicio independiente requiere evidencia
      operacional, organizacional o de clasificación de datos.

  # ── Enlaces de Drive informados por Zoho (Q4, S1) ─────────────────────────

  - id: D-0064
    title: VS01 muestra los enlaces de Drive de Zoho como un nivel propio, sin comprobar
    status: ACCEPTED
    date: 2026-10-01
    source: >
      Decisión del owner del 2026-10-01 para dejar operativo VS01; reemplaza en parte
      D-0057. Evidencia del lote del 16/09: 590 pólizas con enlace a archivo y 61 a
      carpeta en «URL drive doc poliza»; 264 Contactos y 83 Cuentas con «Drive URL» a
      carpeta.
    adr: DECISIONS/0064-enlaces-de-zoho-sin-comprobar.md
    statement: >
      Además de los vínculos comprobados por una persona (D-0057), VS01 ofrece los
      enlaces de Drive que el lote de Zoho informa, como un nivel distinto y rotulado
      «según Zoho, sin comprobar». El enlace de una Policy proviene de «URL drive doc
      poliza» y sólo se usa si apunta a un archivo de Drive, que se ofrece como documento
      de la póliza; si apunta a una carpeta se omite. El enlace de un Contacto o una
      Cuenta proviene de «Drive URL» y sólo se usa si apunta a una carpeta, que se ofrece
      como carpeta del cliente; si apunta a un archivo se omite. No se comprueba que el
      destino exista, abra o sea un PDF: un 404 puede deberse a permisos de la cuenta.
      Un vínculo comprobado por una persona prevalece siempre sobre uno de Zoho, y
      comprobar un enlace de Zoho lo promueve a comprobado. Los enlaces de Zoho son una
      foto del lote que se cargó y se reemplazan completos en cada carga de un lote
      nuevo; nunca alteran los vínculos comprobados ni los pendientes registrados por una
      persona. No cuentan como evidencia de verificación ni cambian la aceptación de VS01.
      El generador lee el lote en la máquina del owner; los agentes de desarrollo
      trabajan con datos sintéticos (R-19).

  # ── WhatsApp en Communication OS (Q4) ────────────────────────────────────

  - id: D-0065
    title: WhatsApp entra a Communication OS por Cloud API oficial, con copia del contenido
    status: ACCEPTED
    date: 2026-10-03
    supersedes: [D-0028]
    source: >
      T-0020 (SPIKES/T-0020-integracion-whatsapp.md y ops/evidence/T-0020.md), con la
      documentación de Meta consultada el 2026-10-02. Respuesta del owner del
      2026-10-03: el equipo no va a escribir desde la app del teléfono, y no se enviarán
      mensajes fuera de la ventana de servicio. D-0010, D-0063; R-19.
    adr: DECISIONS/0065-whatsapp-cloud-api-y-persistencia.md
    statement: >
      Communication OS integra WhatsApp mediante la Cloud API oficial de Meta, con
      números registrados solo en la API: esos números no se usan desde la app del
      teléfono y todo saliente se envía desde Communication OS. No se usan sesiones de
      dispositivo vinculado ni bibliotecas no oficiales, ni coexistencia con la app
      WhatsApp Business. Como Cloud API no permite releer mensajes, Communication OS
      guarda una copia: el texto de entrantes y salientes, el wamid como clave única,
      la dirección, el phone_number_id, el wa_id y el BSUID del participante (cualquiera
      de los dos puede faltar), el timestamp de WhatsApp y el de recepción, y el último
      estado de cada saliente. El saliente se persiste al enviarlo, con el wamid que
      devuelve la API; los webhooks de estado solo lo actualizan. El payload crudo de
      cada webhook se conserva 30 días para reprocesar y después se borra, incluso si
      sigue pending o failed (confirmación del owner del 2026-10-13). El corte se calcula
      desde received_at y se aplica en la siguiente ejecución de retención. El contenido,
      el wamid y los identificadores del participante se tratan como datos personales
      de clientes (R-19). El email sigue rigiéndose por D-0010.

  - id: D-0066
    title: La UI de Communication OS usa una credencial compartida durante CO01
    status: SUPERSEDED
    date: 2026-10-03
    source: >
      Pedido del owner del 2026-10-03 ("usuario y contraseña genéricos"); SLICES/CO01.md;
      D-0059, D-0063, D-0065; R-05, R-16, R-19.
    adr: DECISIONS/0066-credencial-compartida-co01.md
    statement: >
      Durante CO01, la UI de Communication OS exige una única credencial compartida
      (usuario y contraseña) antes de mostrar conversaciones o permitir responder. La
      credencial se valida en el servidor, solo sobre HTTPS, y se guarda como variable
      del despliegue: la contraseña, como hash, nunca en el repositorio. La genera, carga
      y rota el owner (R-16). El receptor de webhooks queda fuera de esta credencial y se
      protege con la firma de Meta. No se agregan dependencias ni proveedores de
      identidad. El mecanismo concreto (Basic Auth o formulario con cookie de sesión
      firmada) lo elige la tarea que implementa la UI.
    falsified_by: >
      Que Communication OS se integre en Broker OS, que la UI la use más de un operador
      que necesite responsabilidad individual, que entren conversaciones con clientes
      reales, o que la credencial se filtre. Cualquiera de esos casos exige reemplazarla
      por el login de VS01 (D-0059) u otro mecanismo con identidad individual.


  # ── Propiedad de datos entre Broker OS y Risk OS (Q4, EMI-18) ────────────

  - id: D-0067
    title: Propiedad de datos entre Broker OS y Risk OS
    status: ACCEPTED
    date: 2026-10-14
    source: >
      EMI-18 (Linear, proyecto Risk OS); decisiones del owner del 2026-10-14 en el hilo de
      EMI-18 sobre la propuesta de cuatro puntos; contratos de T-0021
      (SPIKES/T-0021/v0/fase-15/contrato/ y decisiones-15a.md, EMI-16), EMI-17; D-0025,
      D-0050, D-0063; DOMAIN.md §25-37, §46 y §76; R-19. Pasa de PROVISIONAL a ACCEPTED
      con la decisión de cierre de Q4 del owner del 2026-11-02 (D-0071, T-0034).
    adr: DECISIONS/0067-propiedad-de-datos-broker-risk.md
    superseded_in_part_by:
      - clause: En Q4 no se copian identificadores internos de Broker OS ni hay flujos automáticos entre los dos contextos
        by: D-0071
    statement: >
      Cada concepto tiene un único contexto autoritativo. Otro contexto conserva sólo
      referencias, proyecciones, snapshots o datos derivados que necesita para sus propias
      responsabilidades: con procedencia cuando corresponde, sin sincronización, sin
      presentarse como el registro canónico del dueño, sin escritura de regreso y sin
      transferir la propiedad conceptual. Broker OS es autoridad sobre Party y sus
      perfiles, roles y contactos; sobre Policy, sus versiones, vigencia, renovación,
      Endorsement, cancelación y el contenido contractual de la cobertura; y sobre
      Insurer, InsuranceProduct, DocumentLink y User. Risk OS es autoridad sobre
      EnterpriseRisk y RiskAssessment, el plan de acción y sus ciclos, la metodología
      versionada y su evaluación de transferencia por riesgo (cobertura considerada,
      límite y sublímite aplicables, exposición retenida y suficiencia). DOMAIN.md los
      identifica como propiedad de Risk OS y no incorpora su modelo. Durante Q4, Risk OS
      puede registrar hechos observados sobre una póliza (firma, renovación, vencimiento,
      ampliación, consumo o cancelación) como observaciones locales con procedencia, que
      no son hechos autoritativos de Policy ni resuelven D-0025; en una integración, esos
      hechos vienen de Broker OS. organizacion_id es una identidad propia de Risk OS
      (ORG-<ULID>) y poliza_ref una referencia documental local, que no es Policy.id ni
      clave foránea y se interpreta dentro de su organización. La correspondencia
      entre la organización evaluada y la empresa de Broker OS, y la lectura de Risk OS
      desde Broker OS, se rigen por D-0071, sin reemplazar las identidades locales; no
      hay sincronización ni escritura de regreso. Esta decisión no autoriza
      usar ni almacenar datos reales en Risk OS, que requiere su propia autorización
      bajo R-19.

  # ── Datos reales de Risk OS v1 (Q4, RO01) ────────────────────────────────

  - id: D-0068
    title: Dónde viven los datos reales de Risk OS v1 y quién los carga
    status: ACCEPTED
    date: 2026-10-15
    source: >
      SLICES/RO01-decisiones.md, punto 1 (opción b), proveedor, región y estado
      elegidos por el owner el 2026-10-15 y su corrección de plan del mismo día;
      SLICES/RO01.md §5 y §7; D-0062, que no se extiende (D-0063); D-0067, que no
      autoriza datos reales; R-19; refinamiento de preparación por el owner del
      2026-10-19, D-0070.
    adr: DECISIONS/0068-datos-reales-risk-os.md
    superseded_in_part_by:
      - clause: Preparación de las históricas exclusivamente por el owner sin asistencia de agentes
        by: D-0070
      - clause: Paso de los proyectos propios de Risk OS a planes pagos cuando Broker OS quede operativo
        by: D-0076
    statement: >
      Los datos de las cinco empresas históricas se alojan en infraestructura hosteada
      y dedicada a Risk OS, sin compartir base ni
      despliegue con Broker OS ni Communication OS; los sintéticos y las previews no
      usan datos reales. H1–H5 y futuros datasets pueden prepararse y actualizarse con
      agentes autorizados según D-0070; el owner conserva la responsabilidad de aprobar
      el dataset y de importarlo desde su máquina. Los agentes de preparación no reciben
      credenciales productivas ni se conectan a Production; Production no es su entorno
      de trabajo. Los agentes de desarrollo conservan los límites de R-19. Los datos
      reales y los artefactos privados quedan fuera del repositorio público. Proveedor: un proyecto nuevo de Supabase en plan Free,
      región sa-east-1 (São Paulo), y un proyecto nuevo de Vercel en plan Hobby, los
      dos propios de Risk OS. No se aprueba infraestructura paga propia de Risk OS ni la
      migración automática de su despliegue: cualquier cambio entra en el presupuesto
      conjunto de D-0076 y se evalúa antes su aislamiento, seguridad, backups y
      continuidad. Se aceptan los riesgos del plan
      gratuito de D-0062: pausa por inactividad, sin backups automáticos (copia manual
      del owner fuera del repositorio), logs cortos y condiciones de uso de Vercel
      Hobby.

  # ── Acceso a la UI de Risk OS v1 (Q4, RO01, T-0030) ──────────────────────

  - id: D-0069
    title: La UI de Risk OS v1 usa una credencial por persona, con autenticación propia
    status: PROVISIONAL
    date: 2026-10-15
    source: >
      SLICES/RO01-decisiones.md, punto 2 (opción b) y punto 6; SLICES/RO01.md §2
      (Acceso) y §7; T-0030; D-0059, D-0063, D-0066; R-05, R-16, R-18, R-22, R-23.
    adr: DECISIONS/0069-acceso-por-persona-risk-os.md
    statement: >
      La UI de Risk OS v1 exige que cada persona entre con su propia credencial antes
      de ver o escribir nada. El usuario y el hash scrypt de la contraseña viven en el
      esquema risk (risk.usuario, risk.credencial), sólo de inserción: la vigente es la
      última, y rotarla o darla de baja invalida las sesiones abiertas. La valida el
      servidor en tiempo constante y emite una cookie de sesión firmada con HMAC, cuyo
      secreto es una variable del despliegue; cada request comprueba la firma, el
      vencimiento y que la credencial siga vigente. La identidad de quien escribe o
      accede es la persona de la sesión. Las credenciales las genera y carga el owner
      con la línea de comandos del contexto, nunca en el repositorio. Sin
      configuración, todo se niega. Sin OIDC, sin roles y sin dependencias nuevas.
      Aprobada por el owner el 2026-10-16: se mantiene propia y aislada durante Q4,
      igual que la de Communication OS; el límite de intentos de login es de T-0032.
    falsified_by: >
      Que Risk OS se integre en Broker OS; que entren usuarios externos o hagan falta
      roles o permisos por persona; que una credencial o el secreto de sesión se
      filtren; o que el despliegue muestre intentos de acceso repetidos que el costo de
      scrypt no alcanza a frenar. Cualquiera de esos casos exige el login de VS01
      (D-0059) u otro mecanismo con proveedor de identidad.

  # ── Preparación asistida de datasets de Risk OS (T-0032) ────────────────

  - id: D-0070
    title: La preparación de datasets de Risk OS es asistida por agentes
    status: ACCEPTED
    date: 2026-10-19
    source: >
      Decisión explícita del owner del 2026-10-19 para T-0032, H1–H5 y futuros
      datasets de Risk OS; refina D-0039 y D-0068; R-16, R-18 y R-19. Pareja
      proveedor/modelo cambiada por el owner el 2026-10-19, en el hilo de H1 del
      proyecto, de Codex de OpenAI (sin modelo identificado) a Anthropic
      claude-opus-5-5. Carpeta de Google Drive como workspace privado, elegida por
      el owner el 2026-10-19 en el mismo hilo.
    adr: DECISIONS/0070-preparacion-asistida-datasets-risk-os.md
    statement: >
      Risk OS admite una tercera clase, agente de preparación/análisis de datos,
      para construir y mantener datasets con asistencia IA por diseño. Para una función
      explícitamente autorizada por el owner puede procesar el mínimo necesario de
      evidencia real empresarial aportada y generar o actualizar material de importación:
      fotografías de instalaciones, informes y análisis técnicos, pólizas y anexos,
      coberturas, sumas aseguradas, límites y sublímites, deducibles, valores expuestos,
      pérdidas, incidentes operacionales, controles, continuidad, acciones, respuestas
      de la empresa o del owner y otra información empresarial necesaria para evaluar
      riesgos y transferencia. La información económica y aseguradora empresarial está
      autorizada en este alcance; no habilita a cualquier agente de desarrollo ni
      extiende permisos a Broker OS o Communication OS (D-0063, D-0067).
      Se minimizan los datos enviados al modelo. Quedan excluidas por defecto la PII
      personal innecesaria y las categorías especialmente sensibles de individuos,
      particularmente salud individual, vida, información médica y datos bancarios
      personales. Un accidente laboral relevante se trata prioritariamente como hecho
      operacional sin nombres, datos médicos ni otra PII sensible de la persona; se
      redacta o separa ese contenido antes de enviarlo. Credenciales, secretos y tokens
      están totalmente prohibidos (R-16, R-18).
      Cada dato o afirmación relevante conserva procedencia y, cuando corresponda,
      distingue DOCUMENTADO (respaldo directo en fuente aportada), CONFIRMADO
      (confirmación humana explícita durante la preparación), INFERIDO (inferencia
      defendible y visible como tal) y UNKNOWN (evidencia insuficiente). Una fuente
      existente no garantiza veracidad. No se inventan faltantes ni se transforma un
      valor plausible o una inferencia en hecho documentado. El agente puede extraer,
      estructurar, relacionar, detectar contradicciones, proponer riesgos y evaluaciones
      según la metodología vigente, preguntar al humano, generar CSV candidatos,
      ejecutar validadores locales e iterar sobre errores. Sus salidas no adquieren
      autoridad por ser generadas por IA: requieren validación mecánica y aprobación
      humana del dataset antes de importar; la revisión profesional posterior subsiste.
      La aprobación no convierte inferencias en hechos documentados. El owner hace el
      backup y la importación con risk_app (D-0068). El agente no recibe credenciales
      productivas, no se conecta ni importa autónomamente a Production. Documentos, CSV
      reales y registros privados de preparación quedan fuera del repositorio público;
      sólo vuelven informes sin valores. R-19 conserva auditoría por función, usuario,
      recurso, proveedor, modelo, categoría y timestamp, sin prompts completos en logs.
      Pareja proveedor/modelo autorizada: proveedor Anthropic, modelo claude-opus-5-5
      (incluida su variante de contexto extendido claude-opus-5-5[1m]), en sesiones de
      Claude Code bajo la cuenta del owner, para la función de preparación de D-0070
      sobre H1–H5 y futuros datasets de Risk OS. Alcance: leer la evidencia que el
      owner aporte o la carpeta privada que el owner designe fuera del repositorio, y
      escribir sólo en esa carpeta privada (candidatos CSV, trazabilidad, salida del
      validador local); leer el repositorio sin modificarlo. Esa carpeta puede ser una
      carpeta de Google Drive del owner, leída y escrita con el conector de Google Drive
      de claude.ai bajo su cuenta y sólo dentro de esa carpeta: el agente no busca ni
      abre otro contenido de Drive, crea archivos nuevos y no modifica archivos que no
      creó. Las copias de trabajo que necesite el validador quedan en el almacenamiento
      efímero de la sesión, fuera del repositorio, y se borran al terminar. El modelo se acredita con
      los metadatos de la sesión, no con el nombre de la herramienta ni de la familia;
      si un turno lo atiende otro modelo, incluido un respaldo automático, el
      procesamiento de datos reales se detiene hasta que ese modelo tenga su propia
      aprobación. No se autoriza Codex de OpenAI ni ningún otro modelo o proveedor;
      cada uno requiere su propia aprobación previa.

  # ── Cierre de Q4 y etapa 1 del paso a producción (T-0034, EMI-47) ────────

  - id: D-0071
    title: Los contextos se integran por API de aplicación y la organización evaluada se vincula a mano con una empresa
    status: ACCEPTED
    date: 2026-11-02
    source: >
      Decisión de cierre de Q4 del owner del 2026-11-02 («Decisiones de cierre Q4 — Del
      Campo OS», punto 0), tomada sin esperar a diciembre, en el hilo de T-0034;
      docs/north-star/09-plan-de-produccion.md (decisiones del owner); DA-9; D-0063,
      D-0067; T-0036.
    adr: DECISIONS/0071-integracion-por-api-y-correspondencia-de-empresas.md
    statement: >
      Broker OS, Risk OS y Communication OS siguen siendo contextos funcionales
      separados, con la propiedad de datos de D-0067: Broker OS administra empresas,
      clientes, pólizas y relaciones comerciales; Risk OS, el conocimiento de riesgos,
      las evaluaciones, las evidencias y las decisiones profesionales; Communication OS,
      las comunicaciones y conversaciones. Los contextos se comunican sólo por la API de
      aplicación que cada uno exporta, nunca leyendo ni escribiendo tablas de otro
      esquema. Broker OS puede consultar esa API de Risk OS y de Communication OS, al
      principio sólo con operaciones de lectura. Una escritura controlada entre
      contextos se incorpora sólo ante una necesidad funcional concreta y con su propia
      decisión. La separación lógica no exige infraestructura física separada; compartir
      base o despliegue se rige por D-0076. Cada organización evaluada de Risk OS se
      vincula como mucho con una única empresa de Broker OS. La vinculación la registra
      y verifica a mano una persona autorizada; guarda el id de la empresa como
      referencia opaca, sin clave foránea entre contextos, y puede quedar pendiente
      mientras no haya una correspondencia confirmada. organizacion_id sigue siendo la
      identidad propia de Risk OS. Una empresa puede contener varios establecimientos,
      actividades y evaluaciones de riesgo. La revisión de diciembre de 2026 evalúa la
      implementación y el uso; no posterga ni reabre esta decisión.

  - id: D-0072
    title: Acceso individual con Google por invitación y roles administrados en las aplicaciones
    status: ACCEPTED
    date: 2026-11-02
    supersedes: [D-0066]
    source: >
      Decisión del owner del 2026-11-02 («Decisiones de cierre Q4 — Del Campo OS», punto
      1, C1) en el hilo de T-0034; docs/north-star/09-plan-de-produccion.md (C1);
      D-0013, D-0022, D-0027, D-0059, D-0060, D-0066, D-0069; R-05; T-0035.
    adr: DECISIONS/0072-acceso-individual-y-roles.md
    statement: >
      Broker OS, Risk OS y Communication OS pasan a autenticación individual y
      autorización por roles, y las credenciales compartidas se eliminan
      progresivamente. Autenticación y autorización son responsabilidades separadas.
      Google es el proveedor principal de autenticación y se admiten cuentas de Google
      externas, personales o profesionales: no se exige pertenecer al Google Workspace
      de Del Campo. Para personas sin cuenta de Google se puede ofrecer un mecanismo
      alternativo seguro, como un enlace por correo. Se prioriza Supabase Auth con Google
      OAuth y, cuando corresponda, enlace por correo; su adopción, que D-0013 pide
      justificar por separado, y su relación con D-0060 se confirman en un ADR de T-0035
      (R-05). El acceso es sólo por invitación o aprobación de un administrador:
      autenticarse no otorga permisos. Roles y permisos se administran dentro de las
      aplicaciones; cada persona tiene identidad individual, permisos específicos y
      trazabilidad de sus acciones, y su acceso se puede revocar de inmediato. Roles
      iniciales: Administrador (usuarios, organizaciones, permisos y configuración),
      Operador Del Campo (empresas, información comercial y evaluaciones según sus
      permisos) y Revisor profesional (consulta evaluaciones, registra observaciones y
      hace validaciones autorizadas). El revisor profesional puede usar una cuenta de
      Google externa autorizada individualmente. Los permisos también limitan sobre qué
      empresas y evaluaciones opera cada persona; dónde se hace cumplir sigue en D-0022
      y la estructura de asignación en D-0027. La autenticación futura de clientes tiene
      permisos y reglas de acceso independientes de los usuarios internos. Al entrar en
      servicio en cada contexto, esta decisión reemplaza a D-0066 y D-0069, y a las
      cláusulas de D-0059 sobre audiencia Internal, pertenencia al Workspace y no uso de
      Supabase Auth; hasta entonces esas decisiones siguen rigiendo sus despliegues.

  - id: D-0073
    title: Communication OS atiende clientes reales como piloto supervisado, después de C1
    status: PROVISIONAL
    date: 2026-11-02
    source: >
      Decisión del owner del 2026-11-02 («Decisiones de cierre Q4 — Del Campo OS», punto
      2, U1) en el hilo de T-0034, y elección del owner del mismo día sobre la transición
      hasta C1 («Transición controlada»); respuesta U1 del owner en la fase 1 del proyecto de la
      north star (el número ya recibe mensajes de clientes); SLICES/CO01.md §3;
      PROJECT.md §4; D-0065, D-0066, D-0072, D-0074; R-13, R-14, R-19.
    adr: DECISIONS/0073-clientes-en-communication-os.md
    statement: >
      El owner autoriza usar el número de Communication OS para atender clientes
      reales como piloto supervisado, una vez completados C1 (D-0072) y los controles
      mínimos de seguridad. Antes de incorporar clientes hay que verificar cuánto
      tiempo se conserva hoy el texto de los mensajes, definir y documentar una política
      de retención y eliminación, verificar los controles de acceso y seguridad, y
      confirmar la fecha efectiva de incorporación de los primeros clientes, que no está
      fijada. Alcance inicial: recibir consultas y mensajes de clientes, identificarlos
      y vincular la conversación cuando corresponda, registrar las comunicaciones
      relevantes, facilitar el trabajo de los operadores y asistir con IA la preparación
      y clasificación de respuestas bajo control humano, dentro de D-0074. No se
      autorizan decisiones automáticas sobre coberturas, aceptación de riesgos,
      siniestros ni compromisos contractuales sin validación humana. Se recopila sólo la
      información necesaria, con acceso individual y trazabilidad. Los mensajes
      operativos se almacenan separados de los documentos o registros incorporados
      formalmente al expediente comercial. El payload crudo se sigue borrando a los 30
      días (D-0065), salvo revisión justificada. Esta decisión amplía el alcance de
      CO01, que se aceptó sólo con el equipo, y es la autorización propia que PROJECT.md
      §4 exige para conversaciones con clientes. Transición hasta C1, elegida por el
      owner el 2026-11-02: se sigue atendiendo a los clientes que ya escriben al número,
      el owner rota la credencial compartida de D-0066 (R-16) y no se suman clientes
      nuevos al canal hasta cumplir las condiciones de entrada.
    falsified_by: >
      Que una conversación de cliente quede expuesta a alguien sin permiso; que la
      política de retención no se pueda cumplir con la copia que exige D-0065; que el
      piloto necesite decisiones automáticas para ser útil; o que el volumen o la
      sensibilidad de los mensajes exijan una frontera de infraestructura (D-0063).

  - id: D-0074
    title: Qué información de clientes puede enviarse a interfaces externas de IA en la gestión de riesgos
    status: ACCEPTED
    date: 2026-11-02
    source: >
      Decisión del owner del 2026-11-02 («Decisiones de cierre Q4 — Del Campo OS», punto
      3, política de información) en el hilo de T-0034; refina R-19 para el uso de
      interfaces externas de IA por el equipo; DA-2, DA-5; D-0039, D-0070.
    adr: DECISIONS/0074-informacion-en-ia-externa.md
    statement: >
      El equipo de Del Campo puede usar interfaces externas de IA, como ChatGPT,
      Claude, Gemini y Codex, como herramientas de razonamiento, investigación, análisis
      y asistencia en la gestión de riesgos. Los sistemas de Del Campo siguen siendo la
      fuente de la información estructurada, las evidencias y las decisiones
      profesionales. La información se clasifica en tres niveles. Los datos
      empresariales generales y el conocimiento sectorial están permitidos. Las
      fotografías, los planos, la información interna y las vulnerabilidades
      específicas de una empresa, y cualquier otra información confidencial de
      clientes, sólo se envían por cuentas registradas antes en decisions.yaml con
      proveedor, cuenta, tipo de plan, condiciones de tratamiento de datos y modelos.
      Quedan excluidos los datos personales innecesarios, la información de salud, los
      datos bancarios y los secretos y credenciales (R-16, R-18). Al 2026-11-02 no hay
      ninguna cuenta registrada para el segundo nivel; la pareja de D-0070 sigue valiendo
      sólo para la preparación de datasets de Risk OS. No se fija un proveedor ni un
      modelo permanente: se priorizan calidad, protección de datos, costo y facilidad de
      uso. Los agentes de desarrollo conservan R-19 sin cambios. Desde D-0088, una cuenta
      puede registrarse con todos los modelos que ofrece su plan, sin nombrarlos uno por uno.
    superseded_in_part_by:
      - clause: El registro de una cuenta nombra cada modelo que se usa, no la familia
        by: D-0088

  - id: D-0075
    title: Un servidor MCP propio y skills de metodología son la dirección de integración con IA
    status: ACCEPTED
    date: 2026-11-02
    source: >
      Decisión del owner del 2026-11-02 («Decisiones de cierre Q4 — Del Campo OS», punto
      3, MCP Server y skills) en el hilo de T-0034; DA-2, DA-4, DA-5;
      docs/north-star/05-contratos-de-integracion.md (contrato B); D-0071, D-0072, D-0074.
    adr: DECISIONS/0075-servidor-mcp-y-skills.md
    statement: >
      La dirección técnica para usar IA es un servidor MCP propio de Del Campo,
      compatible con distintos clientes de IA, más skills basadas en la metodología
      profesional de Del Campo, sin construir un sistema de agentes dentro de Broker OS.
      El servidor ofrece herramientas de consulta y, más adelante, operaciones
      controladas sobre Broker OS, Risk OS y Communication OS. Respeta los límites entre
      contextos y consume sus API de aplicación (D-0071); autentica a la persona y
      verifica sus permisos (D-0072); restringe el acceso a las empresas y evaluaciones
      autorizadas; deja traza de cada operación; y empieza sólo con herramientas de
      lectura. Las escrituras se incorporan de a poco, con autorización y validación
      humana según su criticidad. No es obligatorio para la primera versión en
      producción. Se priorizan tres skills: identificación preliminar de riesgos a partir
      del rubro, la actividad y las características de la empresa, con la base de
      conocimiento sectorial; análisis de inspecciones presenciales o virtuales contra la
      identificación preliminar; y refinamiento y tratamiento de riesgos con la
      metodología, que estima probabilidad e impacto cuando hay información suficiente y
      propone eliminar, mitigar, aceptar o transferir. Las recomendaciones no reemplazan
      las decisiones profesionales. Se busca reutilizar las mismas definiciones de skills
      y herramientas entre Claude, Gemini, Codex y ChatGPT, verificando la compatibilidad
      real por producto, interfaz y tipo de cuenta. El personal operativo no usa línea de
      comandos. Orden: definir las primeras skills y validarlas contra el proceso manual;
      un MCP mínimo de lectura cuando aporte valor concreto; probar la interoperabilidad;
      borradores estructurados; y otras operaciones según necesidades reales. El envío
      de información a cada proveedor se rige por D-0074.

  - id: D-0076
    title: La infraestructura de los tres contextos tiene un tope de USD 45 mensuales
    status: ACCEPTED
    date: 2026-11-02
    superseded_in_part_by:
      - clause: Tope de USD 45 mensuales con impuestos incluidos
        by: D-0079
      - clause: La combinación de Vercel Pro y Supabase Pro no queda autorizada por sí sola
        by: D-0079
    source: >
      Decisión del owner del 2026-11-02 («Decisiones de cierre Q4 — Del Campo OS», punto
      4, D-0062 y D-0068) en el hilo de T-0034; precios base de Vercel Pro y Supabase Pro
      informados por el owner; D-0062, D-0063, D-0068, D-0071; R-13, R-14; T-0037.
    adr: DECISIONS/0076-presupuesto-de-infraestructura.md
    statement: >
      El gasto mensual total de infraestructura de Broker OS, Risk OS y Communication
      OS, incluidos impuestos y consumos variables, no supera el tope que fija D-0079. Los planes pagos se
      activan sólo ante una necesidad concreta y después de que el owner apruebe una
      configuración concreta que respete el tope; si no es viable, se proponen
      alternativas para su aprobación. La configuración con Vercel Pro y Supabase Pro
      es la que aprueba D-0079. Se aprovecha la infraestructura existente, se usan
      planes gratuitos cuando son adecuados a la criticidad y la disponibilidad que se
      necesitan, se comparte infraestructura cuando es técnica y operativamente
      conveniente manteniendo la separación lógica y los controles entre contextos
      (D-0063, D-0071), no se agregan servicios ni instancias que no sean
      indispensables y se monitorean consumos y costos. Risk OS entra en el mismo
      presupuesto: no se aprueba una infraestructura paga propia ni la migración
      automática de su despliegue actual, y antes de modificarlo se evalúan su
      aislamiento, seguridad, backups y continuidad. Cualquier aumento del presupuesto
      requiere aprobación explícita. Contratar servicios, migrar bases y cambiar
      permisos de producción requieren autorización específica del owner (R-13, R-14).

  - id: D-0077
    title: Los tres contextos autentican con el OIDC de Google propio de D-0060, sin Supabase Auth
    status: ACCEPTED
    date: 2026-11-03
    source: >
      Elección del owner del 2026-11-03 en el hilo de T-0035 («Elijo A: extender D-0060
      con OIDC existente»); D-0072 delega la confirmación de Supabase Auth a un ADR de
      T-0035; D-0013, D-0022, D-0060, D-0076; R-05.
    adr: DECISIONS/0077-autenticacion-oidc-propio.md
    statement: >
      Broker OS, Risk OS y Communication OS autentican con Google OIDC reutilizando
      openid-client y jose (D-0060), sin contratar servicios nuevos ni construir un
      proveedor de identidad propio: una capa común y mínima de sesión y de gestión de
      usuarios. Clientes de Google de audiencia External admiten cuentas externas sólo
      por invitación. La identidad común entre contextos es el par (proveedor, sujeto),
      vinculado en cada contexto a su usuario interno; la admisión se resuelve en la base
      en cada request, con revocación inmediata y la autorización híbrida de D-0022.
      Entre contextos viaja un token firmado de corta duración que el destino verifica y
      somete a su propia admisión. El enlace por correo queda para una etapa posterior y
      la arquitectura no lo impide. Supabase Auth sigue como alternativa futura si
      mantener la autenticación propia llega a justificar una migración. Reemplaza la
      cláusula de D-0072 que prioriza Supabase Auth.

  - id: D-0079
    title: El tope de infraestructura sube a USD 55 mensuales y se aprueba Supabase Pro para VS01 con Vercel Pro
    status: ACCEPTED
    date: 2026-11-07
    source: >
      Elección del owner del 2026-11-07 en el hilo de T-0037 («VS01 a Supabase Pro y Vercel
      Pro», y «Subir el tope a USD 55 con impuestos» en la tarjeta de decisión), sobre la
      propuesta de docs/migration/zoho/T-0037-infraestructura.md; precios de lista
      consultados el 2026-11-06; D-0062, D-0068, D-0076; R-13, R-14; T-0037.
    adr: DECISIONS/0079-tope-de-infraestructura-usd-55.md
    statement: >
      El gasto mensual total de infraestructura de Broker OS, Risk OS y Communication
      OS, incluidos impuestos y consumos variables, tiene como objetivo USD 55 y como
      techo USD 66 (D-0081). Reemplaza el tope
      de USD 45 de D-0076; el resto de D-0076 sigue vigente. Se aprueba esta
      configuración: una organización de Supabase en plan Pro con un único proyecto, la
      producción de VS01, transferida desde la organización Free; y el equipo de Vercel
      en plan Pro con un solo asiento que despliega, para los proyectos de VS01,
      Communication OS y Risk OS. Communication OS y Risk OS siguen en Supabase Free. El
      cálculo supone 21 % de IVA como costo y el resumen pagado en dólares, para que no
      se aplique la percepción del 30 %; pagado en pesos, la configuración supera el
      tope. Los dos servicios se contratan con su límite de gasto activado; esos límites
      no garantizan el total (D-0081). La contratación y la transferencia del proyecto las hace el owner
      (R-13, R-14).
    superseded_in_part_by:
      - clause: El gasto mensual total no supera USD 55
        by: D-0081
      - clause: Un límite de gasto que impida consumos por encima del plan
        by: D-0081

  - id: D-0080
    title: Como máximo cinco frentes activos, sin contar las esperas pasivas
    status: ACCEPTED
    date: 2026-11-07
    source: >
      Respuestas del owner del 2026-11-07 en el hilo «Planificar camino a la north star con
      Gantt» del proyecto de Claude («5 frentes totales, no importa si son de construcción,
      productivos o spike»; «esperas pasivas fuera del WIP activo»); plan hacia la north
      star (docs/north-star/12-plan-hacia-la-north-star.md); PROJECT.md §5.
    adr: DECISIONS/0080-cinco-frentes-activos.md
    statement: >
      Como máximo cinco tareas ACTIVE al mismo tiempo, sin sublímites por tipo:
      construcción, producción y spikes cuentan igual. Una tarea ACTIVE cuyo único trabajo
      pendiente es una espera pasiva (una factura, la respuesta de un tercero, un período
      de observación, la pausa de 24 h del operador único) declara `waiting` con la
      condición de salida y la próxima comprobación, y no cuenta. Cuando la espera exige
      trabajo (analizar logs, corregir, ejecutar), quita `waiting` y vuelve a contar.
      Reemplaza el límite de dos tareas ACTIVE y un spike de PROJECT.md §5.

  - id: D-0081
    title: El presupuesto de infraestructura tiene objetivo USD 55 y techo USD 66
    status: ACCEPTED
    date: 2026-11-07
    source: >
      Respuesta del owner del 2026-11-07 en el hilo «Planificar camino a la north star con
      Gantt» («55 USD más 20 % de contingencia, minimizar siempre que sea posible»); D-0079;
      D-0076.
    adr: DECISIONS/0081-presupuesto-con-contingencia.md
    statement: >
      El gasto mensual total de infraestructura de Broker OS, Risk OS y Communication OS,
      con impuestos y consumos variables, tiene como objetivo USD 55 y una contingencia de
      hasta 20 %: el techo es USD 66. Por encima de USD 55 primero se buscan ahorros; una
      previsión por encima de USD 66 frena cualquier expansión hasta reducirla. La
      configuración aprobada por D-0079 no cambia, pero sus límites de gasto no son una
      garantía: el spend cap de Supabase no cubre cómputo, y el presupuesto de Vercel
      cuenta sólo el uso que excede el crédito del plan y pausa con minutos de demora.
      El total se controla con la previsión del checkout y la conciliación de cada
      factura. Las suscripciones de IA del owner no cuentan en este total.

  - id: D-0082
    title: Claude Code, Codex y Gemini trabajan como agentes del repositorio
    status: ACCEPTED
    date: 2026-11-07
    source: >
      Respuestas del owner del 2026-11-07 en el hilo «Planificar camino a la north star con
      Gantt» («disponemos de 3 cuentas premium», «sí, inmediatamente»); D-0016; D-0043;
      D-0074; AGENTS.md.
    adr: DECISIONS/0082-tres-proveedores-de-agentes.md
    statement: >
      Claude Code, Codex y Gemini pueden ejecutar tareas del repositorio con el mismo
      contrato: AGENTS.md, la tarea en TASKS/, revisión ciega y aprobación humana según
      R-13 y R-14. Una tarea tiene un solo agente implementador a la vez. Un proveedor usa
      una capacidad protegida sólo cuando sus protecciones locales aplicables están
      configuradas y comprobadas en el PR que las incorpora o cambia; la captura de
      AgentRun ya no es condición (D-0085). Ningún agente de desarrollo recibe PII real de
      clientes ni credenciales de producción (R-19), y ningún proveedor recibe
      información de nivel 2 sin una cuenta registrada según D-0074. La revisión ciega
      puede hacerla un subagente aislado del mismo proveedor o de otro, sin que eso
      resuelva D-0043.
    superseded_in_part_by:
      - clause: Codex y Gemini sólo con datos sintéticos hasta que T-0039 deje funcionando la captura de AgentRun
        by: D-0085

  - id: D-0083
    title: Aprobación interna por operador único
    status: ACCEPTED
    date: 2026-11-07
    source: >
      Elección del owner del 2026-11-07 en el hilo «Planificar camino a la north star con
      Gantt» (tarjeta de decisión, «Operador único interno», con la excepción explícita de
      su mensaje de las 18:31 UTC); D-0022; DA-8 (docs/north-star/01-arquitectura-funcional.md).
    adr: DECISIONS/0083-aprobacion-interna-por-operador-unico.md
    statement: >
      Mientras Emiliano sea la única persona que opera Broker OS y Risk OS, puede aprobar
      o aceptar lo que él mismo redactó, sólo para uso interno, si hay una revisión de IA
      registrada y pasaron 24 horas desde el último cambio material; un cambio material
      reinicia la espera. Quedan registrados la versión, los hallazgos, las correcciones y
      la aprobación humana. La aprobación se identifica como «aprobación interna por
      operador único» y no habilita publicar, exportar ni entregar al cliente: eso sigue
      exigiendo otra persona humana habilitada, que puede ser interna. La restricción se
      hace cumplir en el servidor y en los permisos de la base. Las 24 horas son una pausa
      para reconsiderar, no evidencia de independencia profesional.

  - id: D-0084
    title: RO01 se acepta para uso interno sin revisor profesional, con A8 no verificado
    status: ACCEPTED
    date: 2026-11-07
    source: >
      Respuestas del owner del 2026-11-07 en el hilo «Planificar camino a la north star con
      Gantt» («no tendremos revisor profesional, Emiliano revisa y aprueba con ayuda de
      agentes IA»; «una observación mínima de Emiliano es suficiente»); SLICES/RO01.md §6;
      T-0032; D-0083.
    adr: DECISIONS/0084-aceptacion-interna-de-ro01.md
    statement: >
      La aceptación de RO01 (T-0032) mide los trece criterios de RO01 §6 y la firma
      Emiliano. Sin una segunda persona idónea, A8 (revisor distinto del evaluador, con
      orden previo ciego) queda registrado como no verificado y no se reemplaza con un
      orden propio ni con una IA. Así aceptada, RO01 habilita el uso interno de Risk OS y
      destraba T-0036, pero no permite afirmar validación profesional independiente ni
      presentar resultados de Risk OS a un cliente. Si más adelante hay un revisor, A8 se
      mide sin repetir el resto.

  # ── T-0043 ───────────────────────────────────────────────────────────────
  - id: D-0085
    title: La captura de AgentRun deja de ser obligatoria
    status: ACCEPTED
    date: 2026-11-09
    source: >
      Revisión de las reglas de gobierno del 2026-11-09, con una segunda revisión
      independiente hecha con Codex; aprobación del owner en el hilo «Revisar las reglas de
      gobierno del repo» («puedes continuar con el siguiente PR»). T-0043.
    adr: DECISIONS/0085-agentrun-opcional.md
    statement: >
      Ninguna sesión de agente está obligada a registrar AgentRun, y el capturador se
      retira de Claude Code, Codex y Gemini. ops/runs/ se conserva como histórico y
      check-agent-run sigue validando su esquema. Un experimento deliberado puede
      registrar eventos con el mismo esquema. AgentRun deja de ser requisito del
      Definition of Done y de la evidencia de nuevas tareas. Reemplaza el criterio de
      promoción por conteo de D-0015 y la condición de captura de D-0082.

  - id: D-0086
    title: El control del cambio mira el diff, no el nombre de la rama ni la etiqueta
    status: ACCEPTED
    date: 2026-11-09
    source: >
      Revisión de las reglas de gobierno del 2026-11-09, con una segunda revisión
      independiente hecha con Codex y sus 19 pruebas de aceptación del congelamiento;
      aprobación del owner en el hilo «Revisar las reglas de gobierno del repo». T-0043.
    adr: DECISIONS/0086-control-del-cambio-por-diff.md
    statement: >
      El contrato de toda tarea existente que una rama modifique queda congelado, con
      cualquier nombre de rama: Why, Outcome, Non-scope, Verification y Data effects, más
      id, kind y workstream; riskClass sólo puede subir y contextRefs sólo puede sumar.
      Marcar una casilla sin cambiar su texto está permitido, y una tarea pasa a DONE en
      su propio PR cuando su outcome está verificado y sus aprobaciones obtenidas. Una
      enmienda del contrato va en una rama amend/ que sólo toca esa tarea. La revisión
      ciega es obligatoria para FEATURE y MIGRATION y para todo diff que toque una ruta
      sensible (migraciones, identidad y autorización, controles de acceso, endpoints,
      operaciones y persistencia, integraciones, guardrails y validadores), y CI exige su
      reporte en REVIEWS/; un PR que sólo planifica la tarea no la exige. CI corre estos controles también en su versión de la base.
      Los guardrails de los tres proveedores y los validadores no se modifican sin
      aprobación humana. La revisión de Gauntlet del prototipo vale como revisión ciega
      si cumple las propiedades de R-33.

  # ── Hilo «Decidir cuándo consolidar Broker y Risk» ─────────────────────────
  - id: D-0087
    title: Los proyectos Supabase Free se alternan por bloques y cada base con datos se copia fuera de Supabase
    status: ACCEPTED
    date: 2026-11-10
    source: >
      Revisión de la consolidación de Broker OS y Risk OS del 2026-11-10, con ajustes de
      una segunda revisión hecha con Codex; respuesta del owner en el hilo «Decidir cuándo
      consolidar Broker y Risk» («adelante puedes preparar el segundo PR»), aprobada con el
      merge de este cambio. D-0068, D-0076, D-0081.
    adr: DECISIONS/0087-alternancia-y-copias-en-free.md
    statement: >
      Mientras los proyectos de Supabase sigan en Free, el de Broker OS queda siempre
      activo y Risk OS y Communication OS se alternan el segundo lugar por bloques de
      trabajo, nunca durante una observación que exija disponibilidad continua. Antes de
      pausar un proyecto se comprueba que no reciba escrituras externas y se hace una copia;
      pausar Communication OS exige además la confirmación del owner cada vez, porque los
      mensajes que lleguen durante la pausa pueden perderse. Se prefiere pausar a borrar, y
      borrar un proyecto exige una decisión explícita. El owner copia cada base con datos
      fuera de Supabase con pg_dump: una vez por día cuando hubo cambios relevantes, y
      siempre antes de una carga, una migración o un cambio material. Las copias van
      cifradas a dos lugares privados y se restauran en local una vez por mes. Ante una
      falla, primero se atiende su causa: un proyecto pausado se reanuda, una configuración
      se corrige, una saturación se diagnostica. Una restauración se usa sólo para datos
      dañados, con los escritores detenidos y el estado actual preservado. Esto no cambia
      el plan de ningún proyecto: el paso a Pro lo decide el owner.

  # ── Hilo «Ejecutar los próximos pasos del plan» (IA-01) ────────────────────
  - id: D-0088
    title: Las cuentas de Claude, ChatGPT/Codex y Gemini del owner quedan registradas para información de nivel 2
    status: ACCEPTED
    date: 2026-11-10
    source: >
      Respuestas del owner del 2026-11-10 en el hilo «Ejecutar los próximos pasos del plan»
      (IA-01 del plan 12): cuentas y planes, entrenamiento apagado en las tres, «no quiero
      restringir ningún modelo», «el nivel 2 está permitido con Claude y Codex» y, después,
      «para gemini quiero agregar todos los modelos del plan y registrarla en nivel 2»; aprobada
      con el merge de este cambio. D-0074, D-0070, D-0082, R-19.
    adr: DECISIONS/0088-cuentas-de-ia-registradas.md
    statement: >
      Quedan registradas para información de nivel 2 (D-0074) tres cuentas de Emiliano del
      Campo, que es la única persona que las usa: Claude de Anthropic, plan Pro, y
      ChatGPT/Codex de OpenAI, plan Plus, las dos personales; y Gemini de Google en el
      Workspace de Del Campo, plan Work Pro. En las tres, el owner declaró apagado el uso de
      sus conversaciones para entrenar modelos. El registro abarca todos los modelos que
      cada plan ofrece, sin restringir ninguno; esto reemplaza en parte a D-0074, que pedía
      nombrar cada modelo. El nivel 3 sigue excluido en todas. Si se vuelve a activar el
      entrenamiento, cambia el plan o el proveedor cambia sus condiciones, la cuenta deja
      de valer para el nivel 2 hasta un nuevo registro. Esto no cambia R-19: Claude Code y
      Codex, como agentes de desarrollo, siguen sin recibir PII real de clientes.
