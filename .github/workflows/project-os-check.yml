name: Project OS check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: project-os-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.0.0
        with:
          runtime: node@24
          require-lockfile: true
          install: true

      - name: Check Project OS
        run: pnpm check
