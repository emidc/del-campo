  return total ? h`<span class="cm-n" title="${total} comentarios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>${total}<span class="sr"> comentarios</span></span>` : '';
}

// ---------- Matriz y lista ----------
function vMatrizLista(e, org, r, modo, base) {
  const d = S.d, yo = S.perfil, rs = ordenD10(d, org), noEv = noEvaluables(d, org);
  const sel = r.q.c ? r.q.c.split('-').map(Number) : null;
  const vistaB = r.q.v === 'b';
  const enCelda = x => sel && x.c.P === sel[0] && x.c.ieff === sel[1];
  const q = k => { const o = { ...r.q }; Object.assign(o, k); Object.keys(o).forEach(x => o[x] == null && delete o[x]); const s = Object.entries(o).map(([a, b]) => `${a}=${encodeURIComponent(b)}`).join('&'); return base + 'matriz' + (s ? '?' + s : ''); };
  const matriz = h`<div class="matriz" role="group" aria-label="Matriz de probabilidad por impacto principal" data-matriz>
    ${[5, 4, 3, 2, 1].map(I => h`<div class="eje" aria-hidden="true">I ${I}</div>${[1, 2, 3, 4, 5].map(P => { const xs = rs.filter(x => x.c.P === P && x.c.ieff === I); return h`<a class="celda ${sel && sel[0] === P && sel[1] === I ? 'sel' : ''}" href="${sel && sel[0] === P && sel[1] === I ? q({ c: null }) : q({ c: `${P}-${I}` })}" aria-label="Probabilidad ${P}, impacto ${I}: ${xs.length} riesgos" data-celda="${P}-${I}" style="background:${tonoCelda(P, I)}">${xs.map(x => h`<span class="marcador b-${x.c.banda} ${x.c.ieffUnknown ? 'dashed' : ''}" title="${x.r.titulo} · ${BANDA_INFO[x.c.banda].nombre}${x.c.ieffUnknown ? ' · falta un dato de impacto' : ''}" data-marcador="${x.r.id}"><span aria-hidden="true">${BANDA_INFO[x.c.banda].simbolo}</span>${codigo(x.r.id)}${x.c.ieffUnknown ? h`<span class="sr"> (falta un dato de impacto)</span>` : ''}</span>`)}</a>`; })}`)}
    <div></div>${[1, 2, 3, 4, 5].map(P => h`<div class="eje">P ${P}</div>`)}</div>`;
  const leyenda = h`<div class="leyenda" data-leyenda>${BANDAS.map(b => h`<span class="banda b-${b}"><span class="forma" aria-hidden="true">${BANDA_INFO[b].simbolo}</span>${BANDA_INFO[b].nombre}</span>`)}<span class="chico suave" data-leyenda-falta><span class="marcador dashed" style="color:var(--texto)" aria-hidden="true">05</span> falta un dato</span></div>`;
  const ayuda = h`<details class="leer-mas" data-nota-matriz><summary>Cómo se lee</summary><p>La celda ubica probabilidad (P) e impacto principal (I). La banda combina probabilidad, impacto y vulnerabilidad de cada tipo de daño y toma el peor, por eso puede no coincidir con la celda. La posición es el orden calculado: banda, criticidad, impacto principal e impacto en personas.</p></details>`;
  const trat = ['sin_accion', 'en_curso', 'decision', 'transferido', 'hecha'];
  const vB = h`<div class="tabla-wrap" tabindex="0"><table class="t" data-vista-b><thead><tr><th>Banda</th>${trat.map(t => h`<th>${TRAT_NOMBRE[t]}</th>`)}</tr></thead><tbody>${BANDAS.map(b => h`<tr><td>${banda({ banda: b })}</td>${trat.map(t => { const n = rs.filter(x => x.c.banda === b && tratamientoDe(d, x.r.id) === t); return h`<td class="num" title="${n.map(x => x.r.titulo).join(', ')}">${n.length}</td>`; })}</tr>`)}</tbody></table></div>`;
  const tec = UI.tecnicos && ['eva', 'emi'].includes(yo);
  const ro = reordenVigente(d, org); const calc = r.q.calc === '1';
  const filas = rs.filter(x => !sel || enCelda(x));
  const abierto = r.q.r || null;
  const fila = (x, posProf) => {
    const ab = abierto === x.r.id, clave = claveDe('riesgo', x.r.id), href = q({ r: ab ? null : x.r.id });
    return h`<tr data-href="${href}" class="fila-r ${ab ? 'sel abierta' : ''}" data-riesgo="${x.r.id}">
    <td data-l="Riesgo"><a class="fila-tit" id="ft-${x.r.id}" href="${href}" aria-expanded="${ab ? 'true' : 'false'}" ${raw(ab ? `aria-controls="det-${x.r.id}"` : '')}><span class="chev" aria-hidden="true"></span><strong>${codigo(x.r.id)}</strong> · ${x.r.titulo}</a> ${simbolosBanderas(x.r)} ${chipNuevos(noLeidos(d, yo, clave).length, itemsHilo(d, clave).length)}</td>
    <td data-l="Banda">${banda(x.c)}${tec ? h`<br><span class="chico suave">C_raw ${x.c.cMin}${x.c.cMax !== x.c.cMin ? '–' + x.c.cMax : ''}</span>` : ''}</td>
    <td data-l="${tec ? 'Determinante' : 'Qué lo hace grave'}">${quéLoHaceGrave(d, x.r, x.c)}</td>
    <td data-l="${tec ? 'Uncertainty' : 'Qué falta saber'}">${quéFaltaSaber(x.r, x.c)}</td>
    <td data-l="Tratamiento">${TRAT_NOMBRE[tratamientoDe(d, x.r.id)]}</td>
    <td data-l="${tec ? 'Pos. D10' : 'Posición'}" class="num" data-pos="${x.pos}">${posProf ? h`${posProf} <span class="chico suave">(calculada ${x.pos})</span>` : x.pos}${x.empate ? h` <span class="sim-l sim-empate" data-empate title="Empate: comparte la posición con otro riesgo"><span aria-hidden="true">=</span><span class="sr"> (empate)</span></span>` : ''}</td></tr>
    ${ab ? h`<tr class="fila-det" id="det-${x.r.id}"><td colspan="6">${vDetalleRiesgo(x.r, modo, q)}</td></tr>` : ''}`;
  };
  // v8: los riesgos sin evaluar van en la misma lista, al final, con lo que falta para evaluarlos.
  const filaSinEval = x => {
    const ab = abierto === x.id, clave = claveDe('riesgo', x.id), href = q({ r: ab ? null : x.id });
    return h`<tr data-href="${href}" class="fila-r fila-sineval ${ab ? 'sel abierta' : ''}" data-riesgo="${x.id}" data-sin-evaluar>
    <td data-l="Riesgo"><a class="fila-tit" id="ft-${x.id}" href="${href}" aria-expanded="${ab ? 'true' : 'false'}" ${raw(ab ? `aria-controls="det-${x.id}"` : '')}><span class="chev" aria-hidden="true"></span><strong>${codigo(x.id)}</strong> · ${x.titulo}</a> ${simbolosBanderas(x)} ${chipNuevos(noLeidos(d, yo, clave).length, itemsHilo(d, clave).length)}</td>
    <td data-l="Banda">${banda({ banda: 'noeval' })}</td>
    <td data-l="${tec ? 'Determinante' : 'Qué lo hace grave'}">—</td>
    <td data-l="${tec ? 'Uncertainty' : 'Qué falta saber'}">${x.evals.some(e => e.estado === 'pendiente') ? h`<span data-eval-pendiente>Evaluación inicial pendiente de aceptar.</span>` : x.motivoNoEval || x.falta || 'Falta la evaluación.'}</td>
    <td data-l="Tratamiento">${TRAT_NOMBRE[tratamientoDe(d, x.id)]}</td>
    <td data-l="${tec ? 'Pos. D10' : 'Posición'}" class="num">—</td></tr>
    ${ab ? h`<tr class="fila-det" id="det-${x.id}"><td colspan="6">${vDetalleRiesgo(x, modo, q)}</td></tr>` : ''}`;
  };
  const grupoSinEval = sel || !noEv.length ? '' : h`<tr class="grupo"><td colspan="6" data-grupo="noeval"><strong>${banda({ banda: 'noeval' })}</strong> <span class="chico suave">${noEv.length} · fuera de la matriz y del orden hasta tener los datos</span></td></tr>${noEv.map(filaSinEval)}`;
  const thead = h`<thead><tr><th>Riesgo</th><th>Banda</th><th>${tec ? 'Determinante (I efectivo)' : 'Qué lo hace grave'}</th><th>${tec ? 'Uncertainty' : 'Qué falta saber'}</th><th>Tratamiento</th><th>${tec ? 'Pos. D10' : 'Posición'}</th></tr></thead>`;
  let lista;
  if (ro && !calc) {
    const ord = [...ro.orden.map(id => filas.find(x => x.r.id === id)).filter(Boolean), ...filas.filter(x => !ro.orden.includes(x.r.id))]; // v13: un riesgo agregado después del reordenamiento va al final
    lista = h`<div class="chico" data-reorden><p><strong>Orden profesional</strong> de ${quien(d, ro.autor)} (${fFecha(ro.fecha)}): ${ro.causa}. <a href="${q({ calc: '1' })}">Ver orden calculado</a></p><details class="leer-mas"><summary>Fundamento</summary><p>${ro.fundamento}</p></details></div>
      <div class="tabla-wrap"><table class="t tarjetas t-riesgos" data-lista="profesional">${thead}<tbody>${ord.map((x, i) => fila(x, i + 1))}${grupoSinEval}</tbody></table></div>`;
  } else {
    lista = h`${ro ? h`<p class="chico">Orden calculado. <a href="${q({ calc: null })}">Volver al orden profesional</a></p>` : ''}<div class="tabla-wrap"><table class="t tarjetas t-riesgos" data-lista="calculado">${thead}<tbody>${BANDAS.filter(b => filas.some(x => x.c.banda === b)).map(b => h`<tr class="grupo"><td colspan="6" data-grupo="${b}"><strong>${banda({ banda: b })}</strong> <span class="chico suave">${filas.filter(x => x.c.banda === b).length}</span></td></tr>${filas.filter(x => x.c.banda === b).map(x => fila(x))}`)}${grupoSinEval}</tbody></table></div>`;
  }
  // Un riesgo abierto que no está en la lista visible (por el filtro de celda) se muestra igual, arriba.
  const rsel = abierto ? byId(d.riesgos, abierto) : null;
  const suelto = rsel && rsel.org === org && !filas.some(x => x.r.id === rsel.id) && (sel || !noEv.some(x => x.id === rsel.id)) ? h`<div class="det-suelto" data-detalle-suelto><div class="fila-sp"><strong>${codigo(rsel.id)} · ${rsel.titulo}</strong><a class="btn chico texto" href="${q({ r: null })}">Cerrar</a></div>${vDetalleRiesgo(rsel, modo, q)}</div>` : '';
  const seguridad = rs.filter(x => x.r.safety);
  return h`<section class="tarjeta" aria-labelledby="h-mat"><header><h2 id="h-mat">${vistaB ? 'Por banda y tratamiento' : 'Matriz'}</h2><a class="btn chico" href="${vistaB ? q({ v: null }) : q({ v: 'b' })}">${vistaB ? 'Ver matriz' : 'Ver por tratamiento'}</a></header>
      ${vistaB ? vB : h`<div class="grid-2 matriz-grid"><div>${matriz}</div><div class="stack">${leyenda}${ayuda}${sel ? h`<p class="chico">Filtro: P${sel[0]} · I${sel[1]}. <a href="${q({ c: null })}">Quitar</a></p>` : ''}</div></div>`}
    </section>
    <section class="tarjeta" aria-labelledby="h-lista"><header><h2 id="h-lista">Lista de riesgos</h2><div class="fila">${['eva', 'emi'].includes(yo) ? h`<label class="fila chico"><input type="checkbox" data-uichange="tecnicos" ${raw(tec ? 'checked' : '')}> Nombres técnicos</label>` : ''}${modo === 'equipo' && puede(yo, 'reordenar', { d, org }) ? uiBtn('Reordenar', 'modal', { tipo: 'reordenar', org }, 'chico') : ''}${puedeEditar(modo, org) && !d.validacion.orgs.includes(org) ? botonAgregar('riesgoForm', org, '+ Agregar riesgo') : ''}${modo === 'equipo' && puede(yo, 'importar') && !d.validacion.orgs.includes(org) ? h`<a class="btn chico" href="#/importacion/lotes?e=${e.id}" data-importar-csv>Importar CSV</a>` : ''}</div></header>
      ${suelto}${lista}
      </section>
    <section class="tarjeta" data-seguridad><h2>Seguridad de personas (${seguridad.length})</h2>${seguridad.length ? h`<ul class="lista">${seguridad.map(x => h`<li><a class="item" href="${q({ r: x.r.id })}">${banda(x.c)}<span>${x.r.titulo}<br><span class="t2">${TRAT_NOMBRE[tratamientoDe(d, x.r.id)]}</span></span><span></span></a></li>`)}</ul>` : h`<p class="chico suave">Ninguno.</p>`}</section>`;
}

// ---------- Detalle de un riesgo (dentro de la lista) ----------
function vProbabilidad(rg, ev, rpj) {
  const pj = rpj && rpj.pj, F = pj ? pj.fuentes.map(f => FUENTES[f]).filter(Boolean) : [];
  return h`<div class="prob" data-prob>
    <div class="prob-cab"><span class="prob-lbl">Probabilidad</span>${pj ? h`<span class="tip"><button type="button" class="tip-btn" aria-describedby="tip-${rg.id}" aria-label="Por qué esta probabilidad">?</button><span class="tip-cuerpo" role="tooltip" id="tip-${rg.id}"><strong>Por qué ${PROB_NOMBRE[pj.P].toLowerCase()}.</strong> ${pj.texto}<span class="tip-fuente">Fuente: ${F.map(f => `${f.autor} (${f.anio})`).join('; ')}. Fuente ficticia, simulada.</span>${pj.P !== ev.P ? h`<span class="tip-fuente">La evaluación vigente cambió la probabilidad a ${ev.P}; la justificación es de la anterior.</span>` : ''}</span></span>` : ''}</div>
    <div class="prob-val"><strong>${ev.P}</strong><span class="prob-nom">${PROB_NOMBRE[ev.P]}</span></div>
    <div class="prob-escala" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => h`<span class="${i <= ev.P ? 'on' : ''}"></span>`)}</div>
    ${pj ? h`<button type="button" class="link-btn chico" data-ui="irRefs" data-p="${J({ id: 'refs-' + rg.id })}">Ver referencias (${F.length})</button>` : ''}
  </div>`;
}
function vDetalleRiesgo(rg, modo, q) {
  const d = S.d, yo = S.perfil, c = calcRiesgo(d, rg), pend = rg.evals.find(e => e.estado === 'pendiente');
  const rpj = rg.tipo === 'padre' && c.determinante ? byId(d.riesgos, c.determinante) : rg;
  const ev = evalVigente(rpj);
  const eid = (empresaDeOrg(d, rg.org) || {}).id, zona = rg.zona ? byId(d.zonas, rg.zona) : null;
  const lay = (modo === 'portal' ? `#/portal/${eid}` : `#/empresa/${eid}`) + `/riesgos/layout?r=${rg.id}`;
  const justAb = !!(UI.justif && UI.justif[rg.id]);
  const F = rpj && rpj.pj ? rpj.pj.fuentes.map(f => [f, FUENTES[f]]).filter(x => x[1]) : [];
  const izq = h`<div class="stack det-izq">
    <p>${rg.desc}</p>${explicarBanderas(rg, c, (ordenD10(d, rg.org).find(x => x.r.id === rg.id) || {}))}
    ${!c.evaluable && !pend ? h`<p class="nota aviso">${rg.motivoNoEval || 'Sin evaluación vigente.'}</p>` : ''}
    ${rg.tipo === 'padre' && c.determinante ? h`<p class="chico suave">Lo determina el sub-riesgo «${rpj.titulo}».</p>` : ''}
    ${ev ? h`${vProbabilidad(rg, ev, rpj)}
      <div class="tabla-wrap" tabindex="0"><table class="t t-imp ${justAb ? 't-imp-just' : ''}" data-tabla-impacto id="imp-${rg.id}"><thead><tr><th>Tipo de daño</th><th>Impacto <span class="th-esc">1–5</span></th><th>Vulnerabilidad <span class="th-esc">1 baja – 5 alta</span></th></tr></thead><tbody>${DIMS.map(([k, n]) => h`<tr class="${c.det === k ? 'det-fila' : ''}${justAb ? ' just-fila' : ''}" data-dim="${k}" ${raw(justAb ? `data-justif="${k}"` : '')}><td class="jv-dim">${n}${c.det === k ? h`<span class="sr"> (define la banda)</span>` : ''}</td>${justAb ? celdasJustif(rpj.id, ev, k) : h`<td class="num">${typeof ev.I[k] === 'object' ? numFalta(ev.I[k].min) : ev.I[k]}</td><td class="num">${ev.V[k]}</td>`}</tr>`)}</tbody></table></div>
      <button type="button" id="jb-${rg.id}" class="link-btn chico just-btn" data-ui="justif" data-p="${J({ id: rg.id })}" aria-expanded="${justAb ? 'true' : 'false'}" aria-controls="imp-${rg.id}">${justAb ? 'Ocultar justificación' : 'Ver justificación de los valores'}</button>${justAb ? h` <span data-justif-sim>${cap('sim', 'Criterios y observaciones ficticios')}</span>` : ''}
      <p class="chico suave">${ev.id} · ${fFecha(ev.fecha)} · ${quien(d, ev.autor)}, aceptó ${quien(d, ev.revisor)}${zona ? h` · <a href="${lay}" data-ver-zona>${zona.nombre}: ver en el plano</a>` : ''}</p>` : zona ? h`<p class="chico"><a href="${lay}" data-ver-zona>${zona.nombre}: ver en el plano</a></p>` : ''}
    ${modo === 'equipo' ? h`<details class="leer-mas"><summary>Historial de evaluaciones (${rg.evals.length})</summary><ul class="lista">${rg.evals.map(e => h`<li class="item"><span class="origen">${e.estado}</span><span>${e.id} · ${fFechaHora(e.fecha)} · ${quien(d, e.autor)} · ${e.motivo}${e.cambios ? h`<br><span class="t2">${e.cambios.join('; ')}</span>` : ''}</span><span class="chico">${e.revisor ? 'revisó ' + nombreDe(d, e.revisor) : ''}</span></li>`)}</ul></details>
      ${pend ? h`<div class="nota aviso" data-reeval-pendiente><strong>${pend.basadaEn === null ? 'Evaluación inicial pendiente:' : 'Reevaluación pendiente:'}</strong> ${pend.cambios.join('; ')} (${quien(d, pend.autor)}). La banda no cambia hasta que se acepte.<div class="fila" style="margin-top:8px">${siPuede('aceptarReeval', { org: rg.org }, btn('Aceptar reevaluación', 'aceptarReeval', { riesgo: rg.id }, 'chico primario', 'data-ok="Reevaluación aceptada"'))}</div></div>` : ''}
      ${!pend && rg.evaluable && rg.tipo === 'simple' && evalVigente(rg) && puede(yo, 'escribirReeval', { d, org: rg.org }) || puedeEditar(modo, rg.org) && !d.validacion.orgs.includes(rg.org) ? h`<div class="fila" data-acciones-riesgo>${!pend && rg.evaluable && rg.tipo === 'simple' && evalVigente(rg) && puede(yo, 'escribirReeval', { d, org: rg.org }) ? uiBtn('Escribir reevaluación', 'modal', { tipo: 'reeval', riesgo: rg.id }, 'chico') : ''}${puedeEditar(modo, rg.org) && !d.validacion.orgs.includes(rg.org) ? botonEditar('riesgoForm', rg.id, 'Modificar riesgo') : ''}</div>` : ''}${lineaEdicion(d, rg)}` : ''}
  </div>`;
  return h`<div class="det" data-detalle-riesgo="${rg.id}">
    <div class="det-grid">${izq}<div class="det-der">${hiloObjeto(d, 'riesgo', rg)}</div></div>
    ${F.length ? h`<section class="refs" id="refs-${rg.id}" tabindex="-1" aria-label="Referencias de la probabilidad"><h4>Referencias ${cap('sim', 'Fuentes ficticias · simulado')}</h4><ol>${F.map(([k, f]) => h`<li data-ref="${k}"><b>${f.autor}</b> (${f.anio}). <i>${f.titulo}</i>.${f.url ? h` <span class="ref-url">${f.url}</span>` : ' Registro interno.'}</li>`)}</ol></section>` : ''}
  </div>`;
}

// ---------- Plan de acción (lista expandible) ----------
function vPlan(e, org, r, modo) {
  const d = S.d, yo = S.perfil, as = d.acciones.filter(a => a.org === org), ctx = { d, org };
  const agregar = puedeEditar(modo, org) ? botonAgregar('accionForm', org, '+ Agregar acción') : '';
  if (!as.length) return vacio('Sin acciones en el plan', 'Todavía no hay acciones para los riesgos de esta empresa.', agregar);
  const base = (modo === 'portal' ? `#/portal/${e.id}` : `#/empresa/${e.id}`) + '/riesgos/plan';
  const abiertas = new Set(accionesAbiertas(d, org, r.q).map(a => a.id));
  const matriz = (modo === 'portal' ? `#/portal/${e.id}` : `#/empresa/${e.id}`) + '/riesgos/matriz';
  const fila = a => {
    const rg = byId(d.riesgos, a.riesgo), ab = abiertas.has(a.id), clave = claveDe('accion', a.id), href = ab ? base : `${base}?a=${a.id}`;
    const safetySin = rg.safety && !['en_curso', 'decision'].includes(tratamientoDe(d, rg.id));
    const items = itemsHilo(d, clave);
    const forms = {
      comentar: formCompose(clave, 'comentar', { form: 'comentarAccion', p: { accion: a.id }, ok: 'Comentario agregado', label: 'Tu comentario', placeholder: 'Los comentarios se agregan; nunca pisan a otros', submit: 'Comentar' }),
      avance: formCompose(clave, 'avance', { form: 'registrarAvance', p: { accion: a.id }, ok: 'Avance registrado', label: 'Qué se hizo', placeholder: 'Ej.: se instaló la línea de vida en la pasarela norte', submit: 'Registrar avance',
        extra: h`<div class="form-grid"><div class="campo"><label for="avev-${a.id}">Evidencia (archivo ficticio)</label><select id="avev-${a.id}" name="evidencia"><option value="">Sin evidencia</option><option>foto-avance.jpg (ficticia)</option><option>informe-tecnico.pdf (ficticio)</option></select></div><div class="campo"><label for="aves-${a.id}">Estado</label><select id="aves-${a.id}" name="estadoNuevo">${Object.keys(ESTADO_ACC).filter(k => k !== 'decision_direccion').map(k => h`<option value="${k}" ${raw(k === a.estado ? 'selected' : '')}>${ESTADO_ACC[k]}</option>`)}</select></div></div>` }),
    };
    if (!puede(yo, 'comentarPlan', ctx)) delete forms.comentar;
    if (!puede(yo, 'registrarAvance', ctx)) delete forms.avance;
    const botones = h`${forms.avance ? botonCompose('Registrar avance', clave, 'avance', true) : ''}${forms.comentar ? botonCompose('Comentar', clave, 'comentar') : ''}${!forms.avance && !forms.comentar ? h`<span class="no-permiso">Solo lectura</span>` : ''}`;
    return h`<li class="fx ${ab ? 'abierta' : ''}" id="acc-${a.id}" data-accion="${a.id}">
      <a class="fx-fila fx-plan" id="fa-${a.id}" href="${href}" aria-expanded="${ab ? 'true' : 'false'}" ${raw(ab ? `aria-controls="accd-${a.id}"` : '')}>

// ---------- Cámara (estado efímero de la interfaz) ----------
function camDe(s) { UI.mapa = UI.mapa || {}; return UI.mapa[s] || (UI.mapa[s] = { k: 1, x: 0, y: 0 }); }
function limitarCam(c) { c.k = Math.min(MAPA_KMAX, Math.max(1, c.k)); c.x = Math.min(0, Math.max(MAPA_W * (1 - c.k), c.x)); c.y = Math.min(0, Math.max(MAPA_H * (1 - c.k), c.y)); return c; }
function zoomCam(c, f, px = MAPA_W / 2, py = MAPA_H / 2) { const k2 = Math.min(MAPA_KMAX, Math.max(1, c.k * f)); c.x = px - (px - c.x) * (k2 / c.k); c.y = py - (py - c.y) * (k2 / c.k); c.k = k2; return limitarCam(c); }
const escalaPin = k => 1 / Math.pow(k, 0.7);
function aplicarCam(svg) {
  const c = camDe(svg.dataset.mapa);
  const g = svg.querySelector('[data-cam]'); if (g) g.setAttribute('transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) scale(${c.k.toFixed(3)})`);
  // Pines de tamaño legible en pantallas chicas: compensan el ancho real del plano (hasta 2,2 veces).
  const ancho = svg.getBoundingClientRect().width || 700, fp = Math.min(2.2, Math.max(1, 700 / ancho));
  svg.querySelectorAll('[data-pin-g]').forEach(p => p.setAttribute('transform', `translate(${p.dataset.x} ${p.dataset.y}) scale(${(escalaPin(c.k) * fp).toFixed(3)})`));
  // Con zoom, los pines que quedan fuera de la vista salen del orden de Tab.
  svg.querySelectorAll('[data-pin]').forEach(a => { const g = a.querySelector('[data-pin-g]'); const x = g.dataset.x * c.k + c.x, y = g.dataset.y * c.k + c.y; const fuera = x < 0 || x > MAPA_W || y < 0 || y > MAPA_H; if (fuera) a.setAttribute('tabindex', '-1'); else a.removeAttribute('tabindex'); });
  const w = svg.closest('[data-mapa-wrap]'); if (w) { const n = w.querySelector('[data-zoom-nivel]'); if (n) n.textContent = Math.round(c.k * 100) + ' %'; w.querySelectorAll('[data-ui="mapaZoom"]').forEach(b => { const f = JSON.parse(b.dataset.p).f; b.disabled = f > 1 ? c.k >= MAPA_KMAX - 1e-6 : c.k <= 1 + 1e-6; }); }
}
function puntoSvg(svg, cx, cy) { const m = svg.getScreenCTM(); if (!m) return { x: MAPA_W / 2, y: MAPA_H / 2 }; const p = new DOMPoint(cx, cy).matrixTransform(m.inverse()); return { x: p.x, y: p.y }; }

const CFG_PANTALLA = { verFacturacion: 'Facturación', verSiniestros: 'Siniestros', verImportacion: 'Importación' };

const permBase = accion => (PERM[accion] || []).filter(esEquipo);
function permEfectivo(accion, d = S.d) { return cfg(d).perm[accion] || permBase(accion); }
function listaNombres(d, ids) { const n = ids.map(id => nombreDe(d, id)); return n.length > 1 ? n.slice(0, -1).join(', ') + ' y ' + n[n.length - 1] : n[0] || 'nadie'; }
// Un permiso cambiado manda sobre la tabla fija solo para el equipo; el resto de las reglas (R1, portal) no cambia.

puede = function (perfil, accion, ctx = {}) {

// El texto de «quién puede» sigue a la configuración en todas las pantallas que lo muestran.
const QUIEN_BASE = { ...QUIEN };
Object.keys(CFG_VER).forEach(v => Object.defineProperty(QUIEN, v, { configurable: true, enumerable: true, get() {

CFG_PERMISOS.forEach(([a]) => Object.defineProperty(QUIEN, a, { configurable: true, enumerable: true, get() { const o = S.d && S.d.config && S.d.config.perm && S.d.config.perm[a]; return o ? `${CFG_ETQ[a]}: lo ${o.length === 1 ? 'hace' : 'hacen'} ${listaNombres(S.d, o)} (según la configuración).` : QUIEN_BASE[a]; } }));

// ---------- Umbrales de alertas (AD-12) ----------

Object.defineProperty(REGLA_ALERTA, 'b', { enumerable: true, get: () => `Alerta (b): ventana de 24 h por cerrar (menos de ${cfgHm(cfgUmbral(S.d, 'ventanaMin'))})` });
Object.defineProperty(REGLA_ALERTA, 'c', { enumerable: true, get: () => `Alerta (c): solicitud sin respuesta en ${cfgUmbral(S.d, 'solicitudDias')} ${cfgUmbral(S.d, 'solicitudDias') === 1 ? 'día hábil' : 'días hábiles'}` });
Object.defineProperty(REGLA_ALERTA, 'e', { enumerable: true, get: () => `Alerta (e): vence en ${cfgUmbral(S.d, 'renovacionDias')} ${cfgUmbral(S.d, 'renovacionDias') === 1 ? 'día' : 'días'} sin renovación iniciada` });

// ---------- Compañías y ramos sugeridos en la carga de pólizas ----------

function catalogoTodo(d, tipo) { const c = cfg(d); return [...new Set([...d.polizas.map(p => p[CFG_CAT[tipo][2]]), ...c.catalogo[tipo]])].sort((a, b) => a.localeCompare(b, 'es')); }
function catalogo(d, tipo) { const oc = cfg(d).ocultas[tipo]; return catalogoTodo(d, tipo).filter(x => !oc.includes(x)); }

// ---------- Datos para ser cliente: lo fijo más lo que agregue la configuración ----------
const prRequisitosBase = prRequisitos;
prRequisitos = function (p) {
  const r = prRequisitosBase(p), x = cfg().extras;
  if (p.tipo !== 'empresa' && x.contactoPersona) r.push(['Teléfono o correo', !!(p.tel || p.mail), 'teléfono o correo']);
  if (p.tipo === 'empresa' && x.domicilioEmpresa) r.push(['Domicilio', !!p.domicilio, 'domicilio']);

};
faltanProspecto = p => prRequisitos(p).filter(r => !r[1]).map(r => r[2] || r[0].replace(/ \(.*\)$/, ''));
const prEditarBase = UI_HANDLERS.prEditar;
UI_HANDLERS.prEditar = function (p) {

    <p class="nota ok">Tiene los datos para ser cliente.</p><p class="no-permiso" data-pr-sin-alta>Convertirlo es dar un alta. ${QUIEN.editarPersona}</p></section>`;
};

// ---------- Capas sobre acciones existentes ----------
const altaPersonaBase = ACCIONES.altaPersona, altaEmpresaBase = ACCIONES.altaEmpresa, simularProspectoBase = ACCIONES.simularProspecto;
ACCIONES.altaPersona = function (d, p, ctx) {

  return altaPersonaBase(d, p, ctx);
};
ACCIONES.altaEmpresa = function (d, p, ctx) {
  const n = String(p.cuit || '').replace(/\D/g, ''), dup = n && d.empresas.find(e => e.cuit.replace(/\D/g, '') === n);
  if (!dup && cfg(d).extras.domicilioEmpresa && puede(ctx.perfil, 'editarPersona')) exigir(p.domicilio && String(p.domicilio).trim(), 'Según la configuración, para dar de alta una empresa hace falta el domicilio.');

ACCIONES.simularProspecto = function (d, p, ctx) {

// Los formularios de alta dicen lo que pide la configuración además del nombre y el documento.
const vAltaPersonaBase = vAltaPersona, vAltaEmpresaBase = vAltaEmpresa;
vAltaPersona = () => h`${puede(S.perfil, 'editarPersona') && cfg().extras.contactoPersona ? h`<p class="nota" data-cfg-extra="persona">Según la configuración, el alta también pide un <strong>teléfono o un correo</strong>.</p>` : ''}${vAltaPersonaBase()}`;
vAltaEmpresa = () => h`${puede(S.perfil, 'editarPersona') && cfg().extras.domicilioEmpresa ? h`<p class="nota" data-cfg-extra="empresa">Según la configuración, el alta también pide el <strong>domicilio</strong>.</p>` : ''}${vAltaEmpresaBase()}`;

// ---------- Acciones de configuración ----------
const cfgEv = (seccion, accion, efecto) => ({ accion: `Configuración · ${accion}`, objeto: 'configuracion', efecto, cfg: seccion });
Object.assign(ACCIONES, {
  cfgPermiso(d, { accion, miembro: mid, valor }, { perfil }) {
    exigirPermiso(perfil, 'configurar'); exigir(propia(CFG_ETQ, accion), 'Ese permiso no se configura acá.'); exigir(esEquipo(mid) && miembro(d, mid), 'Elegí una persona del equipo.');
    const antes = permEfectivo(accion, d), tiene = antes.includes(mid);
    exigir(valor || !esFijo(accion, mid), `${nombreDe(d, mid)} trabaja Risk OS (alertas, solicitudes y revisiones): su «Ver riesgos» queda fijo.`);
    exigir(tiene !== !!valor, valor ? `${nombreDe(d, mid)} ya tiene ese permiso.` : `${nombreDe(d, mid)} no tiene ese permiso.`);
    const ahora = valor ? EQUIPO_IDS.filter(x => antes.includes(x) || x === mid) : antes.filter(x => x !== mid);

    // Importar lee y escribe riesgos de las empresas: solo quien los ve.
    if (accion === 'importar' && valor) exigir(puede(mid, 'verRiesgos'), `Importar lee y cambia riesgos de las empresas: dale primero a ${nombreDe(d, mid)} «Ver los riesgos de las empresas».`);
    if (accion === 'verRiesgos' && !valor) exigir(!puede(mid, 'importar'), `${nombreDe(d, mid)} puede importar, que lee y cambia riesgos: quitale primero «Importar».`);
    if (accion === 'gestionarProspecto' && !valor) { const o = Object.keys(PR_ORIGEN).find(k => cfg(d).llegadas[k] === mid); if (o) exigir(false, `${nombreDe(d, mid)} recibe las llegadas por ${PR_ORIGEN[o].toLowerCase()}: elegí primero a otra persona en «Llegadas de prospectos».`); }
    const c = cfgMut(d), base = permBase(accion);
    if (ahora.length === base.length && ahora.every(x => base.includes(x))) delete c.perm[accion]; else c.perm[accion] = ahora;
    tick(d);
    const pend = accion === 'gestionarProspecto' && !valor ? prospectos(d).filter(x => x.resp === mid && PR_ABIERTO(x.estado)).length : 0;
    return cfgEv('permisos', `${valor ? 'Dio' : 'Quitó'} a ${nombreDe(d, mid)} el permiso «${CFG_ETQ[accion]}»`, `Ahora lo ${ahora.length === 1 ? 'tiene' : 'tienen'}: ${listaNombres(d, ahora)}${pend ? `. ${nombreDe(d, mid)} sigue ${pend === 1 ? 'un prospecto abierto' : pend + ' prospectos abiertos'}: conviene pasarlos a otra persona desde cada prospecto` : ''}`);
  },
  cfgLlegadas(d, { origen, resp }, { perfil }) {
    exigirPermiso(perfil, 'configurar'); exigir(propia(CFG_DEF.llegadas, origen), 'Origen inválido.');
    exigir(miembro(d, resp) && puede(resp, 'gestionarProspecto'), 'Elegí a alguien que pueda gestionar prospectos.');
    const antes = cfg(d).llegadas[origen]; exigir(antes !== resp, `Las llegadas por ${PR_ORIGEN[origen].toLowerCase()} ya van a ${nombreDe(d, resp)}.`);
    cfgMut(d).llegadas = { ...cfg(d).llegadas, [origen]: resp }; tick(d);
    return cfgEv('prospectos', `Las llegadas por ${PR_ORIGEN[origen].toLowerCase()} van a ${nombreDe(d, resp)}`, `${nombreDe(d, antes)} → ${nombreDe(d, resp)}. Los prospectos que ya llegaron no cambian de responsable`);
  },
  cfgExtra(d, { clave, valor }, { perfil }) {
    exigirPermiso(perfil, 'configurar'); exigir(propia(CFG_DEF.extras, clave), 'Opción inválida.');
    exigir(cfg(d).extras[clave] !== !!valor, 'No cambió nada.');
    cfgMut(d).extras = { ...cfg(d).extras, [clave]: !!valor }; tick(d);
    const txt = clave === 'contactoPersona' ? 'un teléfono o un correo para dar de alta a una persona' : 'el domicilio para dar de alta una empresa';
    return cfgEv('clientes', `${valor ? 'Pide' : 'Deja de pedir'} ${txt}`, 'Vale para el alta manual y para convertir un prospecto en cliente; los clientes que ya existen no cambian');
  },
  cfgUmbrales(d, x, { perfil }) {
    exigirPermiso(perfil, 'configurar'); const antes = cfg(d).umbrales, nuevo = { ...antes }, cambios = [];
    CFG_UMBRALES.forEach(([k, , nombre, , unidad, min, max]) => {
      if (x[k] == null || x[k] === '') return; const s = String(x[k]).trim();
      exigir(/^\d+$/.test(s), `${nombre}: escribí un número entero.`); const n = +s;
      exigir(n >= min && n <= max, `${nombre}: tiene que estar entre ${min} y ${max} ${unidad}.`);
      if (n !== antes[k]) { nuevo[k] = n; cambios.push(`${nombre}: ${antes[k]} → ${n} ${unidad}`); }
    });
    exigir(cambios.length, 'No cambiaste ningún umbral.');
    cfgMut(d).umbrales = nuevo; tick(d);
    return cfgEv('alertas', 'Cambió umbrales de alertas', cambios.join('; '));
  },
  cfgCatalogoAgregar(d, { tipo, nombre }, { perfil }) {
    exigirPermiso(perfil, 'configurar'); exigir(propia(CFG_CAT, tipo), 'Tipo inválido.');
    const n = String(nombre || '').trim().replace(/\s+/g, ' '); exigir(n, `Escribí el nombre de la ${CFG_CAT[tipo][1]}.`.replace('la ramo', 'el ramo'));
    exigir(sinBancarios(n) === n, 'El nombre no puede llevar datos de tarjetas ni cuentas bancarias.'); exigir(n.length <= 60, 'El nombre es demasiado largo (60 caracteres como máximo).');
    const ya = catalogoTodo(d, tipo).find(x => normNombre(x) === normNombre(n)); exigir(!ya, `«${ya}» ya está en la lista.`);
    const c = cfgMut(d); c.catalogo = { ...CFG_DEF.catalogo, ...c.catalogo, [tipo]: [...(c.catalogo && c.catalogo[tipo] || []), n] }; tick(d);
    return cfgEv('catalogos', `Agregó ${tipo === 'ramo' ? 'el ramo' : 'la compañía'} «${n}»`, 'Aparece como sugerencia al cargar o editar una póliza');
  },
  cfgCatalogoOcultar(d, { tipo, nombre, valor }, { perfil }) {
    exigirPermiso(perfil, 'configurar'); exigir(propia(CFG_CAT, tipo) && catalogoTodo(d, tipo).includes(nombre), 'No está en la lista.');
    const oc = cfg(d).ocultas[tipo]; exigir(oc.includes(nombre) !== !!valor, 'No cambió nada.');

    const c = cfgMut(d); c.ocultas = { ...CFG_DEF.ocultas, ...c.ocultas, [tipo]: valor ? [...oc, nombre] : oc.filter(x => x !== nombre) }; tick(d);
    return cfgEv('catalogos', `${valor ? 'Ocultó' : 'Volvió a mostrar'} ${tipo === 'ramo' ? 'el ramo' : 'la compañía'} «${nombre}» en las sugerencias`, valor ? 'Las pólizas que ya la usan no cambian; se puede escribir igual' : 'Vuelve a aparecer al cargar una póliza');
  },
  cfgRestablecer(d, { seccion }, { perfil }) {
    exigirPermiso(perfil, 'configurar'); const c = cfg(d), m = cfgMut(d);

    exigir(propia(SEC, seccion), 'Sección inválida.');
    if (seccion === 'permisos') {

      const fuera = Object.keys(PR_ORIGEN).filter(k => c.llegadas[k] && !permBase('gestionarProspecto').includes(c.llegadas[k]));
      exigir(!fuera.length, `Con los permisos iniciales ${listaNombres(d, [...new Set(fuera.map(k => c.llegadas[k]))])} no podría recibir las llegadas automáticas: cambiá primero «Llegadas de prospectos».`);
      m.perm = {};
    } else if (seccion === 'prospectos') {
      exigir(Object.keys(CFG_DEF.llegadas).some(k => c.llegadas[k] !== CFG_DEF.llegadas[k]), 'Las llegadas ya van a Matías.');
      exigir(puede('mat', 'gestionarProspecto'), 'Matías no puede gestionar prospectos: devolvele primero ese permiso.');
      m.llegadas = { ...CFG_DEF.llegadas };
    } else if (seccion === 'clientes') { exigir(c.extras.contactoPersona || c.extras.domicilioEmpresa, 'El alta ya pide solo lo fijo.'); m.extras = { ...CFG_DEF.extras }; }
    else if (seccion === 'alertas') { exigir(Object.keys(CFG_DEF.umbrales).some(k => c.umbrales[k] !== CFG_DEF.umbrales[k]), 'Los umbrales ya tienen los valores iniciales.'); m.umbrales = { ...CFG_DEF.umbrales }; }
    else { exigir(c.catalogo.compania.length || c.catalogo.ramo.length || c.ocultas.compania.length || c.ocultas.ramo.length, 'La lista ya es la inicial.'); m.catalogo = { compania: [], ramo: [] }; m.ocultas = { compania: [], ramo: [] }; }
    tick(d);
    return cfgEv(seccion, `Restableció «${SEC[seccion]}»`, 'Vuelve a los valores iniciales del prototipo');
  },
});

// ---------- Vistas ----------
const CFG_TABS = [['equipo', 'Equipo y permisos'], ['prospectos', 'Llegadas de prospectos'], ['clientes', 'Datos para ser cliente'], ['alertas', 'Alertas'], ['catalogos', 'Compañías y ramos'], ['integraciones', 'Integraciones'], ['historial', 'Historial']];

const restablecer = (seccion, activo) => activo ? uiBtn('Restablecer valores iniciales', 'cfgReset', { seccion }, 'chico', `data-cfg-reset="${seccion}"`) : '';

// ---- equipo-v22.js ----
// v22 · Alta, pausa y baja de miembros del equipo (pedido de Emiliano, 31/10): «manuel tiene que poder dar de alta a nuevos
// miembros del equipo y dar de baja o pausar a los miembros que ya no están en el equipo.» En Configuración › Equipo y permisos.
// Quien sale (pausa o baja) deja de estar en d.equipo, pierde el acceso y su trabajo abierto pasa a otra persona; queda en
// d.equipoInactivo para que el historial siga mostrando su nombre. La pausa se revierte; la baja no. Simulado: no hay cuentas.
Object.assign(PERM, { gestionarEquipo: ['man'] });
Object.assign(QUIEN, { gestionarEquipo: 'Da de alta, pausa y da de baja miembros del equipo Manuel (dirección).' });
const EQUIPO_BASE = [...EQUIPO_IDS], PERFILES_BASE = PERFILES.slice();
// Manuel y Emiliano administran Broker OS y la configuración: no se pausan ni se dan de baja.
const EQ_FIJOS = ['man', 'emi'];
const EQ_SALIDA = { pausa: ['Pausado', 'Pausó', 'pausar'], baja: ['Dado de baja', 'Dio de baja a', 'dar de baja'] };
function inactivos(d = S.d) { return (d && d.equipoInactivo) || []; }
const esInactivo = (id, d = S.d) => inactivos(d).some(x => x.id === id);
// Quién cubre lo que el sistema asigna fijo a alguien que salió: la primera persona de la cadena de traspasos que
// sigue en el equipo y tiene el permiso necesario (si lo hay); si no, Manuel si puede, o la primera persona del equipo que pueda.
function cubre(d, id, perm) {
  if (!esInactivo(id, d)) return id;
  let cur = id;
  for (let i = 0; i < 12; i++) { const x = inactivos(d).find(m => m.id === cur); if (!x) break; if (!x.pasoA) break; cur = x.pasoA; }
  if (!esInactivo(cur, d) && (!perm || puede(cur, perm))) return cur;
  return !perm || puede('man', perm) ? 'man' : (EQUIPO_IDS.find(x => puede(x, perm)) || 'man');
}

// La lista de integrantes (EQUIPO_IDS) y el selector de perfiles (PERFILES) siguen al equipo de la demo.
function sincronizarEquipo() {
  const d = S.d; if (!d || !d.equipo) return;
  EQUIPO_IDS.splice(0, EQUIPO_IDS.length, ...d.equipo.map(m => m.id));
  const otros = PERFILES_BASE.filter(p => !EQUIPO_BASE.includes(p.id));
  PERFILES.splice(0, PERFILES.length, ...d.equipo.map(m => PERFILES_BASE.find(p => p.id === m.id) || { id: m.id, nombre: m.nombre, detalle: m.rol }), ...otros);
  if (S.perfil && !esEquipo(S.perfil) && !esPortal(S.perfil) && S.perfil !== 'r1') { S.perfil = 'man'; guardar(); }
}
const actEquipoBase = act;
act = function (n, p) { const r = actEquipoBase(n, p); sincronizarEquipo(); return r; };
const renderEquipoBase = render;
render = function () { sincronizarEquipo(); return renderEquipoBase(); };
const puedeEquipoBase = puede;
puede = function (perfil, accion, ctx = {}) { return esInactivo(perfil) ? false : puedeEquipoBase(perfil, accion, ctx); };
const nombreDeEquipoBase = nombreDe;
nombreDe = function (d, id) { const x = d && (d.equipoInactivo || []).find(m => m.id === id); return x ? x.nombre : nombreDeEquipoBase(d, id); };
// Quien está fuera del equipo conserva su retrato o sus iniciales en el historial, en gris.
const avEquipoBase = av;
av = function (d, id, tam = '') {
  const x = d && (d.equipoInactivo || []).find(m => m.id === id); if (!x) return avEquipoBase(d, id, tam);
  const foto = fotoDe(id);
  return foto ? h`<span class="av foto inactivo ${tam}" aria-hidden="true" data-av="${id}"><img src="${foto}" alt="" width="64" height="64" decoding="async"></span>` : h`<span class="av inactivo ${tam}" aria-hidden="true">${x.ini}</span>`;
};
// Las alertas fijas de alguien que ya no está (por ejemplo, las de renovaciones de Evangelina) van a Manuel.
const alertasEquipoBase = alertas;
// El ruteo de mensajes (regla 4: gestión abierta) no le asigna la atención a quien salió, sino a quien lo cubre.
const duenosGestionAbiertaEquipoBase = duenosGestionAbierta;
duenosGestionAbierta = function (d, pid) { return [...new Set(duenosGestionAbiertaEquipoBase(d, pid).map(x => cubre(d, x, 'atencion')))]; };
// Las alertas de Risk OS (a, c) piden ver riesgos; las de automatizaciones (d), resolver excepciones.
const EQ_ALERTA_PERM = { a: 'verRiesgos', c: 'verRiesgos', d: 'resolverExcepcion' };
alertas = function (d) { return alertasEquipoBase(d).map(a => a.para.some(x => esInactivo(x, d)) ? { ...a, para: [...new Set(a.para.map(x => cubre(d, x, EQ_ALERTA_PERM[a.regla])))] } : a); };
// Lo que el prototipo asigna fijo (tarea de seguimiento de renovaciones a Evangelina, /cotizar a Lucía) va a quien la cubre.
const resolverPasoEquipoBase = ACCIONES.resolverPaso, r4EjecutarEquipoBase = ACCIONES.r4Ejecutar;
ACCIONES.resolverPaso = function (d, p, ctx) { const n = d.tareas.length, ev = resolverPasoEquipoBase(d, p, ctx); d.tareas.slice(n).forEach(t => { t.resp = cubre(d, t.resp); }); return ev; };
ACCIONES.r4Ejecutar = function (d, p, ctx) { const n = d.cotizaciones.length, ev = r4EjecutarEquipoBase(d, p, ctx); d.cotizaciones.slice(n).forEach(c => { c.resp = cubre(d, c.resp, 'confirmarCotizacion'); }); return ev; };
// Restablecer no puede devolver un permiso solo a quien ya no está, ni las llegadas a Matías si salió.
const cfgRestablecerEquipoBase = ACCIONES.cfgRestablecer;
ACCIONES.cfgRestablecer = function (d, p, ctx) {
  if (p.seccion === 'prospectos') exigir(!esInactivo('mat', d), 'Matías está fuera del equipo: elegí a quién van las llegadas en cada origen.');
  const ev = cfgRestablecerEquipoBase(d, p, ctx);
  const altas = p.seccion === 'permisos' ? EQUIPO_IDS.filter(x => !EQUIPO_BASE.includes(x)) : [];
  if (altas.length && ev) ev.efecto += `. ${listaNombres(d, altas)} ${altas.length === 1 ? 'queda' : 'quedan'} sin permisos de acción, como al darse de alta: se dan en la tabla`;
  if (p.seccion === 'permisos' && inactivos(d).length) {
    const c = cfgMut(d);
    CFG_PERMISOS.forEach(([a]) => { const base = PERM[a] || []; if (!base.some(x => esInactivo(x, d))) return; const ef = base.filter(x => esEquipo(x));
      exigir(ef.length, `Con los permisos iniciales nadie del equipo tendría «${CFG_ETQ[a]}» (${listaNombres(d, base.filter(x => esInactivo(x, d)))} ya no está en el equipo): dáselo a alguien en la tabla.`); c.perm[a] = ef; });
  }
  return ev;
};

const TAREA_RIESGO = ['riesgo', 'accion', 'solicitud', 'transferencia', 'novedadActividad'];
const EQ_TRABAJO = [
  ['tareas', ['tarea abierta', 'tareas abiertas'], null], ['clientes', ['cliente que atiende', 'clientes que atiende'], 'atencion'], ['delegaciones', ['conversación delegada', 'conversaciones delegadas'], null],
  ['prospectos', ['prospecto abierto', 'prospectos abiertos'], 'gestionarProspecto'], ['llegadas', ['origen de llegadas automáticas', 'orígenes de llegadas automáticas'], 'gestionarProspecto'],
  ['siniestros', ['siniestro a cargo', 'siniestros a cargo'], 'gestionarSiniestro'], ['gestiones', ['gestión iniciada a mano', 'gestiones iniciadas a mano'], 'gestionarGestion'], ['expedientes', ['expediente de importación', 'expedientes de importación'], 'verImportacion'], ['cotizaciones', ['cotización abierta', 'cotizaciones abiertas'], 'confirmarCotizacion'], ['guardia', ['guardia de la semana', 'guardias'], null],

function trabajoDe(d, id) {
  return {
    tareas: d.tareas.filter(t => t.resp === id && t.estado !== 'hecha'),
    clientes: d.atenciones.filter(a => a.integrante === id && !a.hasta),

    guardia: d.guardia && d.guardia.integrante === id ? [d.guardia] : [],

      gestionesManuales(d).push({ id: gid, tipo: 'reclamo', obj: { tipo: 'empresa', id: e.id }, titulo: `Reclamar a ${pol.compania}: ${it.concepto.toLowerCase()}`, poliza: pol.id, compania: pol.compania, resp: perfil === 'emi' ? 'eva' : perfil, estado: 'en_curso', desde: t.slice(0, 10), abierta: t, abiertaPor: perfil, origen: { ver: v.id, item: it.id },
        avances: [{ id: nuevoId(d, 'AV'), fecha: t.slice(0, 10), cargado: t, por: perfil, texto: `Gestión iniciada desde la comparación de ${pol.numero}. Pedido: ${it.pedido}. Emitido: ${it.emitida}.${m ? ' ' + m : ''}`, estado: 'en_curso', inicio: true }] });
      efecto += ` (gestión ${gid})`; it.decision = { tipo: decision, por: perfil, t, motivo: m, gestion: gid };
    } else if (decision === 'resuelta') {
      it.decision = { ...it.decision, tipo: 'resuelta', previo: it.decision.tipo, resuelta: { por: perfil, t, motivo: m } };
      const g = it.decision.gestion && byId(d.gestionesManuales || [], it.decision.gestion); if (g && g.estado !== 'cerrada') { g.avances.push({ id: nuevoId(d, 'AV'), fecha: t.slice(0, 10), cargado: t, por: perfil, texto: `Resuelto: ${m}`, estado: 'cerrada', previo: g.estado }); g.estado = 'cerrada'; g.cerrada = t; g.cerradaPor = perfil; }
    } else it.decision = { tipo: decision, por: perfil, t, motivo: m };
    return { accion: `Decidió sobre «${it.concepto}» en la comparación de ${pol.numero}`, objeto: v.id, org: v.org, origen: 'Broker OS', efecto: `${efecto}. La transferencia no cambia sola` };
  },
  // La IA nunca marca una transferencia como verificada: lo hace una persona y, si hay comparación, con todo decidido.
  verificarTransferencia(d, p, ctx) {
    const v = verificacionDeTrf(d, p.id);
    if (v) { const pend = verPendientes(v); exigir(!pend.length, `Primero decidí las ${pend.length} diferencias de la comparación de la póliza: ${pend.map(i => i.concepto.toLowerCase()).join('; ')}.`); }
    const ev = verificarTrfV24(d, p, ctx); if (v) ev.efecto += ` · evidencia: comparación ${v.id}`; return ev;
  },
  informeEditar(d, { id, resumen, recomendaciones }, { perfil }) {
    const inf = byId(d.informes || [], id); exigir(inf, 'Informe inexistente.'); exigirEquipoOrg(d, perfil, 'editarInforme', inf.org); exigir(inf.estado === 'borrador', 'El informe aprobado no se edita.');
    const recs = String(recomendaciones || '').split('\n').map(x => sinBancarios(x.replace(/^[-•·\s]+/, '').trim())).filter(Boolean);
    exigir(resumen && resumen.trim() && recs.length, 'El informe necesita un resumen y al menos una recomendación.');
    inf.resumen = sinBancarios(resumen.trim()); inf.recomendaciones = recs; inf.editado = { por: perfil, t: tick(d) };
    return { accion: 'Revisó el texto del informe anual', objeto: inf.id, org: inf.org, efecto: 'Sigue en borrador; los datos los arma Broker OS' };
  },
  informeAprobar(d, { id }, { perfil }) {
    const inf = byId(d.informes || [], id); exigir(inf, 'Informe inexistente.'); exigirEquipoOrg(d, perfil, 'aprobarInforme', inf.org); exigir(inf.estado === 'borrador', 'El informe ya está aprobado.');
    exigir(perfil !== inf.origen.quien, 'Quien registró el borrador no lo aprueba: lo revisa otra persona.');
    const t = tick(d); inf.instantanea = informeDatos(d, inf.org, t); inf.estado = 'aprobado'; inf.aprobado = { por: perfil, t };
    return { accion: 'Aprobó el informe anual de gestión', objeto: inf.id, org: inf.org, efecto: `Datos congelados al ${fFechaHora(t)}; todavía no lo ve la empresa` };
  },
  informeCompartir(d, { id }, { perfil }) {
    const inf = byId(d.informes || [], id); exigir(inf, 'Informe inexistente.'); exigirEquipoOrg(d, perfil, 'aprobarInforme', inf.org); exigir(inf.estado === 'aprobado', 'Solo se comparte un informe aprobado.');
    inf.estado = 'compartido'; inf.compartido = { por: perfil, t: tick(d) };
    return { accion: 'Compartió el informe anual en el portal de la empresa', objeto: inf.id, org: inf.org, efecto: `${nombreDe(d, inf.empresa)} lo ve en su portal (simulado)` };
  },
  // El lote del relevamiento (LOTE-CL-2) respeta la misma regla que el CSV: las evaluaciones nuevas quedan pendientes y las acepta otra persona.
  loteImportar(d, p, ctx) {
    const l = byId(d.lotes, p.lote);
    if (!l || l.origen === 'csv' || !l.expediente) return loteImportarV24(d, p, ctx);
    const antes = new Set(d.riesgos.map(r => r.id)); const ev = loteImportarV24(d, p, ctx); const evs = [];
    d.riesgos.filter(r => !antes.has(r.id)).forEach(r => { const e = r.evals[0]; e.estado = 'pendiente'; e.revisor = null; e.autor = ctx.perfil; e.lote = l.id; e.cambios = [`Evaluación inicial importada: probabilidad ${e.P}`]; e.evidencia = 'Relevamiento de octubre: inspección del 08/10 y revisión de Manuel del 30/10'; r.creado = { t: l.importado.t, por: ctx.perfil, lote: l.id }; evs.push(r.id); });
    l.evalsPendientes = evs;
    const x = byId(d.expedientes, l.expediente); if (x) { marcarEtapa(x, 'registro', 'hecha', `Importado por ${nombreDe(d, ctx.perfil)} el ${fFechaHora(l.importado.t)}. Desde ahora la gestión sigue en Broker OS.`); }
    if (evs.length) ['man', 'eva', 'emi'].filter(z => z !== ctx.perfil).forEach(z => notificar(d, { para: z, tipo: 'aviso', titulo: `${evs.length} evaluaciones importadas pendientes de aceptar (${l.id})`, detalle: 'Relevamiento de octubre de Bodega Cerro Liso', obj: { tipo: 'empresa', id: empresaDeOrg(d, l.org).id }, org: l.org }));
    return { ...ev, efecto: `${ev.efecto}; ${evs.length} evaluaciones nuevas quedan pendientes de aceptar por otra persona` };
  },
  loteAceptarEvaluaciones(d, p, ctx) {
    const l = byId(d.lotes, p.lote); if (!l || l.origen === 'csv' || !l.expediente) return loteAceptarV24(d, p, ctx);
    l.origen = 'csv'; try { return loteAceptarV24(d, p, ctx); } finally { delete l.origen; }
  },
});
Object.assign(GM_TIPO, { reclamo: 'Reclamo a la compañía' });

// ---------- Datos del informe: siempre salen de Broker OS (nunca del texto del LLM) ----------
function informeDatos(d, org, t) {
  const e = empresaDeOrg(d, org), rs = ordenD10(d, org), c = conteoBandas(d, org), noEv = noEvaluables(d, org);
  const evol = d.riesgos.filter(r => r.org === org).map(r => { const acc = r.evals.filter(x => x.estado === 'aceptada'); if (acc.length < 2) return null; const a = calcEval(acc[acc.length - 2]), b = calcEval(acc[acc.length - 1]); return a.banda !== b.banda ? { titulo: r.titulo, de: a.banda, a: b.banda, fecha: acc[acc.length - 1].aceptada || acc[acc.length - 1].fecha } : null; }).filter(Boolean);
  const nuevos = d.riesgos.filter(r => r.org === org && r.creado).map(r => ({ titulo: r.titulo, lote: r.creado.lote, pendiente: !evalVigente(r) }));
  const acc = d.acciones.filter(a => a.org === org);
  const trf = d.transferencias.filter(x => x.org === org);
  const bre = brechasDe(d, org);
  const sin = [...d.siniestros.filter(s => polizasDe(d, e.id).some(p => p.id === s.poliza)).map(s => ({ titulo: `${s.numero} · ${s.titulo}`, estado: s.etapa })), ...(d.gestionesManuales || []).filter(g => g.tipo === 'siniestro' && g.obj.tipo === 'empresa' && g.obj.id === e.id).map(g => ({ titulo: g.titulo, estado: GM_ESTADO[g.estado][1] }))];
  const cambios = [...(d.novedadesActividad || []).filter(n => n.org === org).map(n => `Cambio de actividad informado por la empresa (${fFecha(n.t)}): «${n.texto}»`), ...d.solicitudes.filter(s => s.org === org && s.estado === 'cerrada').map(s => `Solicitud cerrada: «${s.titulo}»`)];
  return {
    t, bandas: { critica: c.critica, alta: c.alta, media: c.media, baja: c.baja, noeval: c.noeval },
    riesgos: rs.map(x => ({ titulo: x.r.titulo, banda: x.c.banda, seguridad: !!x.r.safety })), noEvaluados: noEv.map(r => r.titulo),
    evolucion: evol, nuevos,
    acciones: acc.map(a => ({ titulo: a.titulo, estado: a.estado, vence: a.vence })),
    verificadas: trf.filter(x => x.estado === 'verificada').map(x => ({ riesgo: byId(d.riesgos, x.riesgo).titulo, poliza: x.polizaRef })),
    sinVerificar: trf.filter(x => x.estado !== 'verificada').map(x => ({ riesgo: byId(d.riesgos, x.riesgo).titulo, estado: x.estado })),
    brechas: bre.filter(b => b.estado === 'confirmada').map(b => ({ riesgo: byId(d.riesgos, b.riesgo).titulo, texto: b.posible, accion: b.recomendada })),
    retenidos: bre.filter(b => b.estado === 'aceptada_cliente').map(b => ({ riesgo: byId(d.riesgos, b.riesgo).titulo, constancia: b.revision.motivo })),
    enRevision: bre.filter(b => ['sin_revisar', 'info_pedida'].includes(b.estado)).length,
    siniestros: sin, cambios,
  };
}
