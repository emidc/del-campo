<title>Broker OS · Del Campo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototipo de Broker OS para Del Campo. Datos ficticios; no es software de producción.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: barra lateral fija + contenido de trabajo + panel lateral de simulaciones; registro de eventos plegable abajo.
   Identidad: petróleo de la landing de Del Campo (RV-6), serif solo en H1 y nombres de entidades (VD-02).
   Tema único claro, elegido a propósito (la marca es clara; AO-07 tema oscuro es opcional). */
:root {
  --marca: #254760; --marca-profunda: #13294d; --acento: #69a3b8; --acento-texto: #357388;
  --fondo: #f2f8f9; --superficie: #ffffff; --superficie-2: #f7fafb; --texto: #394a52; --texto-suave: #5f6e74;
  --oscuro: #183346; --oscuro-2: #34546b; --sobre-oscuro: #ffffff; --sobre-oscuro-suave: #c9dbe3;
  --linea: #d6e3e7; --borde-control: #74868d; --foco: #13294d;
  --b-critica: #b42318; --b-alta: #c2410c; --b-media: #8a5a00; --b-media-fondo: #fff7e0; --b-baja: #137339; --b-noeval: #5f6b75;
  --ok: #15803d; --error: #b42318; --aviso: #8a5a00; --info: #357388;
  --ok-fondo: #ecfdf3; --error-fondo: #fef3f2; --aviso-fondo: #fff8e6; --info-fondo: #eaf4f7;
  --f-display: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radio: 16px; --radio-chico: 10px; --sombra: 0 8px 28px rgba(19, 41, 77, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--fondo); color: var(--texto); }
body { font-family: var(--f-texto); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--superficie); }
a { color: var(--acento-texto); text-underline-offset: 2px; }
a:hover { color: var(--marca); }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { color: var(--marca-profunda); text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 3vw, 34px); line-height: 1.15; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
.serif { font-family: var(--f-display); font-weight: 600; }
p { margin: 0; }
.num, td.num, .tab-num { font-variant-numeric: tabular-nums; }
.suave { color: var(--texto-suave); }
.chico { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Estructura ---------- */
.franja { background: var(--marca-profunda); color: var(--sobre-oscuro); font-size: 12.5px; padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.franja strong { letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--superficie); border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 60px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--marca-profunda); }
.logo-d { width: 34px; height: 34px; border: 1.5px solid var(--marca-profunda); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; line-height: 1; }
.logo-txt { display: flex; flex-direction: column; line-height: 1.05; }
.logo-txt b { font-family: var(--f-display); font-weight: 500; letter-spacing: .12em; font-size: 15px; }
.logo-txt span { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--marca); font-weight: 600; }
.buscar-btn { min-width: 0; flex: 1 1 220px; max-width: 460px; display: flex; align-items: center; gap: 8px; background: var(--superficie-2); border: 1px solid var(--borde-control); border-radius: 999px; padding: 8px 14px; color: var(--texto-suave); font: inherit; cursor: text; text-align: left; min-height: 40px; }
.buscar-btn > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.buscar-btn kbd { margin-left: auto; font-size: 12px; border: 1px solid var(--linea); border-radius: 6px; padding: 0 6px; background: var(--superficie); color: var(--texto); }
.buscar-btn svg, .btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: none; }
.kpi .desglose { font-size: 12px; color: var(--texto); }
.kpi .id { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.top-acciones { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.perfil-sel { display: flex; flex-direction: column; gap: 2px; }
.perfil-sel label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-suave); font-weight: 600; }
select, input, textarea { font: inherit; color: var(--texto); background: var(--superficie); border: 1px solid var(--borde-control); border-radius: var(--radio-chico); padding: 8px 10px; min-height: 40px; max-width: 100%; }
textarea { min-height: 84px; width: 100%; resize: vertical; }
input[type=checkbox], input[type=radio] { min-height: 0; width: 18px; height: 18px; accent-color: var(--marca); }
.campana { position: relative; }
.badge-n { position: absolute; top: -4px; right: -4px; background: var(--b-critica); color: #fff; border-radius: 999px; font-size: 12px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; font-weight: 700; }
.cuerpo { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 100px); }
.cuerpo.con-panel { grid-template-columns: 232px minmax(0, 1fr) 380px; }
.sidebar { background: var(--superficie); border-right: 1px solid var(--linea); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: var(--top-h, 60px); align-self: start; height: calc(100vh - var(--sobre-h, 90px) - var(--reg-h, 44px)); overflow-y: auto; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--texto); text-decoration: none; font-weight: 500; min-height: 40px; }
.sidebar a:hover { background: var(--fondo); color: var(--marca-profunda); }
.sidebar a[aria-current=page] { background: var(--marca); color: #fff; }
.sidebar a[aria-current=page] svg { stroke: #fff; }
.sidebar svg { width: 18px; height: 18px; stroke: var(--marca); fill: none; stroke-width: 1.7; flex: none; }
.sidebar .sep { height: 1px; background: var(--linea); margin: 8px 6px; }
.rol-movil { display: none; }
.sidebar .pie { margin-top: auto; font-size: 12px; color: var(--texto-suave); padding: 10px 12px; }
main { min-width: 0; padding-block: 22px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.contenido { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.encabezado { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.encabezado > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.antetitulo { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--acento-texto); font-weight: 650; }
.antetitulo::before { content: ""; width: 28px; height: 1.5px; background: var(--acento); }
.migas { font-size: 13px; color: var(--texto-suave); display: flex; gap: 6px; flex-wrap: wrap; }
.migas a { color: var(--texto-suave); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- Superficies ---------- */
.tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tarjeta > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid-2b { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fila-sp { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.nota { background: var(--info-fondo); border: 1px solid #b8d6e0; border-radius: var(--radio-chico); padding: 10px 12px; font-size: 13.5px; color: var(--texto); }
.nota.aviso { background: var(--aviso-fondo); border-color: #ecd49a; }
.nota.error { background: var(--error-fondo); border-color: #f3c3bd; }
.nota.ok { background: var(--ok-fondo); border-color: #a9dfbf; }
.nota strong { color: var(--marca-profunda); }
details.brecha { font-size: 13px; border: 1px dashed var(--borde-control); border-radius: var(--radio-chico); padding: 8px 12px; background: var(--superficie-2); }
details.brecha summary { cursor: pointer; font-weight: 600; color: var(--marca); }
details.brecha ul { margin: 8px 0 0; padding-left: 18px; }
.pendiente-owner { font-size: 13px; border-left: 4px solid var(--b-media); background: var(--aviso-fondo); padding: 8px 12px; border-radius: 0 var(--radio-chico) var(--radio-chico) 0; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; border: 1.5px solid var(--marca); background: var(--superficie); color: var(--marca); text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--fondo); }
.btn.primario { background: var(--marca); color: #fff; }
.btn.primario:hover { background: var(--marca-profunda); }
.btn.peligro { border-color: var(--error); color: var(--error); }
.btn.chico { padding: 4px 12px; min-height: 34px; font-size: 13px; }
.btn.texto { border-color: transparent; background: transparent; padding-inline: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--linea); background: var(--superficie); display: grid; place-items: center; cursor: pointer; color: var(--marca); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.no-permiso { font-size: 13px; color: var(--texto-suave); display: inline-flex; gap: 6px; align-items: center; }
.no-permiso::before { content: "🔒︎"; font-size: 12px; }

/* ---------- Chips de capacidad (VD-12) ---------- */
.cap { display: inline-flex; align-items: center; gap: 5px; border-radius: 12px; font-size: 12px; font-weight: 650; padding: 2px 10px; line-height: 1.5; white-space: normal; max-width: 100%; overflow-wrap: anywhere; }
.cap.prod { background: var(--marca); color: #fff; border: 1.5px solid var(--marca); }
.cap.impl { background: var(--superficie); color: var(--marca); border: 1.5px solid var(--marca); }
.cap.sim { background: var(--superficie); color: var(--marca); border: 1.5px dashed var(--marca); }
.cap.fut { background: var(--superficie); color: var(--marca); border: 1.5px dotted var(--marca); font-style: italic; }

/* ---------- Estados (texto + forma + color, VD-04) ---------- */
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.estado .ico { font-size: 12px; width: 14px; text-align: center; }
.e-pendiente { color: var(--texto); } .e-en_curso { color: var(--info); } .e-trabada { color: var(--error); } .e-en_revision { color: var(--aviso); } .e-hecha { color: var(--texto-suave); font-weight: 500; }
.banda { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13px; white-space: nowrap; }
.banda .forma { width: 16px; height: 16px; display: inline-grid; place-items: center; font-size: 14px; line-height: 1; }
.b-critica { color: var(--b-critica); } .b-alta { color: var(--b-alta); } .b-media { color: var(--b-media); } .b-baja { color: var(--b-baja); } .b-noeval { color: var(--b-noeval); }
.prov { font-size: 12px; font-weight: 600; color: var(--aviso); border: 1px dashed var(--aviso); border-radius: 6px; padding: 0 6px; }
/* v9: etiquetas de la lista como símbolos */
.sim-l { position: relative; display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 6px; font-size: 14px; font-weight: 800; line-height: 1; vertical-align: middle; cursor: help; }
.prov.sim-l { padding: 0 3px; }
.sim-empate { color: var(--texto); border: 1.5px solid var(--linea-fuerte, #8a94a0); }
.ban-exp .sim-prov { color: var(--aviso); border: 1px dashed var(--aviso); border-radius: 6px; }
.ban-exp .sim-empate { color: var(--texto); border-radius: 6px; }
.flag { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 650; border: 1px solid var(--borde-control); border-radius: 6px; padding: 1px 7px; color: var(--marca-profunda); background: var(--superficie); white-space: nowrap; }
.doc-e { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; }
.doc-comprobado { color: var(--ok); } .doc-sin_comprobar { color: var(--aviso); } .doc-sin_documento { color: var(--texto-suave); }
.trf { display: inline-flex; gap: 6px; align-items: center; font-weight: 650; font-size: 13px; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.trf-propuesta { border: 1.5px dashed var(--borde-control); color: var(--texto); }
.trf-en_poliza_sin_verificar { border: 1.5px solid var(--aviso); color: var(--aviso); background: linear-gradient(90deg, var(--aviso-fondo) 50%, var(--superficie) 50%); }
.trf-verificada { border: 1.5px solid var(--ok); background: var(--ok); color: #fff; }
.trf-referencia_sin_poliza { border: 1.5px solid var(--error); color: var(--error); }

/* ---------- Tablas y listas ---------- */
.tabla-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--texto-suave); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; height: 40px; }
table.t tr[data-href] { cursor: pointer; }
table.t tr[data-href]:hover td { background: var(--superficie-2); }
table.t tr.hecha td { color: var(--texto-suave); }
table.t tr.sel td { background: var(--info-fondo); }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista > li { border-bottom: 1px solid var(--linea); }
.lista > li:last-child { border-bottom: 0; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 8px; text-decoration: none; color: inherit; border-radius: 10px; min-height: 44px; }
a.item:hover, .item[data-href]:hover { background: var(--superficie-2); cursor: pointer; }
.item .t1 { font-weight: 600; color: var(--marca-profunda); }
.item .t2 { font-size: 13px; color: var(--texto-suave); }
.origen { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--marca); background: var(--info-fondo); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.origen.alerta { background: var(--error-fondo); color: var(--error); }
.kv { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) auto; border-top: 1px solid var(--linea); }
.kv > * { padding: 9px 4px; border-bottom: 1px solid var(--linea); min-width: 0; overflow-wrap: anywhere; }
.kv dt { color: var(--texto-suave); font-size: 13.5px; }
.kv dd { margin: 0; }
.vacio { text-align: left; padding: 18px; border: 1px dashed var(--borde-control); border-radius: var(--radio); background: var(--superficie-2); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.vacio h3 { font-size: 15px; }

/* ---------- Pestañas ---------- */
.pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--linea); overflow-x: auto; scrollbar-width: thin; }
.pestanas a { padding: 10px 14px; text-decoration: none; color: var(--texto); font-weight: 550; border-bottom: 3px solid transparent; white-space: nowrap; min-height: 42px; }
.pestanas a[aria-current=page] { border-bottom-color: var(--marca); color: var(--marca-profunda); font-weight: 700; }
.subpestanas { display: flex; gap: 6px; flex-wrap: wrap; }
.subpestanas a { padding: 6px 14px; border-radius: 999px; text-decoration: none; border: 1px solid var(--linea); color: var(--texto); font-size: 14px; font-weight: 550; background: var(--superficie); min-height: 36px; display: inline-flex; align-items: center; }
.subpestanas a[aria-current=page] { background: var(--marca-profunda); color: #fff; border-color: var(--marca-profunda); }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.kpi { text-align: left; border: 1px solid var(--linea); background: var(--superficie); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; font: inherit; color: inherit; min-height: 92px; }
.kpi:hover { border-color: var(--marca); }
.kpi .v { font-size: 26px; font-weight: 700; color: var(--marca-profunda); font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .v small { font-size: 13px; font-weight: 600; color: var(--texto-suave); }
.kpi .n { font-size: 13px; color: var(--texto); font-weight: 550; }
.kpi .id { font-size: 12px; color: var(--texto-suave); }

/* ---------- Matriz de riesgos (DP-06) ---------- */
.matriz-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; }
.matriz { display: grid; grid-template-columns: 34px repeat(5, minmax(48px, 1fr)); gap: 4px; }
.matriz .celda { background: var(--superficie-2); border: 1px solid var(--linea); border-radius: 8px; min-height: 64px; padding: 5px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; cursor: pointer; font: inherit; }
.matriz .celda.sel { outline: 3px solid var(--marca); outline-offset: -1px; }
.matriz .eje { font-size: 12px; color: var(--texto-suave); display: grid; place-items: center; font-weight: 650; }
.marcador { display: inline-flex; align-items: center; gap: 3px; border-radius: 6px; padding: 1px 5px; font-size: 12px; font-weight: 700; background: var(--superficie); border: 2px solid currentColor; line-height: 1.3; white-space: nowrap; }
.marcador.dashed { border-style: dashed; }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }

/* ---------- Layout por zonas ---------- */
.zonas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.zona { border: 1.5px solid var(--linea); border-radius: 12px; padding: 12px; background: var(--superficie); text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.zona.sel { border-color: var(--marca); box-shadow: inset 0 0 0 2px var(--marca); }
.zona h3 { font-family: var(--f-display); font-weight: 600; font-size: 16px; }

/* ---------- Mensajes ---------- */
.hilo { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 78%; padding: 9px 12px; border-radius: 14px; font-size: 14px; border: 1px solid var(--linea); background: var(--superficie); overflow-wrap: anywhere; }
.msg.in { align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.out { align-self: flex-end; background: var(--info-fondo); border-bottom-right-radius: 4px; }
.msg .meta { font-size: 12px; color: var(--texto-suave); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.canal { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 650; color: var(--texto); }
.canal .wa { width: 14px; height: 14px; border-radius: 50%; background: #25d366; display: inline-block; }
.canal .ml { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--marca); display: inline-block; }

/* ---------- Avatar ---------- */
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--marca); color: #fff; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.av.ext { background: var(--oscuro-2); }

/* ---------- Paneles, modal, búsqueda ---------- */

.toast { pointer-events: none; position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 80; background: var(--marca-profunda); color: #fff; padding: 10px 16px; border-radius: 12px; box-shadow: var(--sombra); max-width: min(560px, calc(100% - 32px)); font-size: 14px; }

/* ---------- Registro de eventos ---------- */
.registro { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--oscuro); color: var(--sobre-oscuro); padding-bottom: env(safe-area-inset-bottom, 0px); }

.registro ol { list-style: none; margin: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); max-height: 34vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }

/* ---------- Portal ---------- */
.portal-top { background: var(--oscuro); color: var(--sobre-oscuro); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* ---------- Documento de demo ---------- */
.docdemo { border: 1px solid var(--linea); border-radius: 10px; padding: 20px; background: var(--superficie); position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.docdemo::after { content: "DOCUMENTO DE DEMOSTRACIÓN · FICTICIO"; position: absolute; top: 44%; left: -10%; right: -10%; text-align: center; transform: rotate(-12deg); font-weight: 800; letter-spacing: .1em; color: rgba(180, 35, 24, .16); font-size: 26px; pointer-events: none; }


/* ---------- Gestiones, importación, simulaciones ---------- */
.kv.dos { grid-template-columns: minmax(110px, 200px) minmax(0, 1fr); }
.kv.dos > span:nth-child(odd) { color: var(--texto-suave); font-size: 13.5px; }

.subpestanas button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--linea); color: var(--texto); font: inherit; font-size: 13.5px; font-weight: 550; background: var(--superficie); min-height: 36px; cursor: pointer; }
.subpestanas button[aria-current=page] { background: var(--marca-profunda); color: #fff; border-color: var(--marca-profunda); }
.btn[aria-disabled=true] { opacity: .62; cursor: not-allowed; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; background: var(--superficie-2); padding: 1px 4px; border-radius: 4px; }

@media (max-width: 1599px) { .cuerpo.con-panel .grid-2, .cuerpo.con-panel .grid-2b { grid-template-columns: minmax(0, 1fr); } }
/* ---------- Responsivo (VD-11) ---------- */
.solo-movil { display: none !important; }
@media (max-width: 1199px) {
  .logo-txt span { display: none; }
  /* Tableta: búsqueda y simulaciones como íconos para que la barra quede en una fila (AV2-04, VD-11). */
  .buscar-btn { flex: none; margin-left: auto; padding: 9px; border-radius: 999px; }
  .buscar-btn > span, .buscar-btn kbd { display: none; }
  .top-acciones .btn .solo-escritorio { display: none !important; }
  .cuerpo, .cuerpo.con-panel { grid-template-columns: 72px minmax(0, 1fr); }
  .sidebar a span.lbl { position: absolute; left: -9999px; }

  .sidebar a:hover span.lbl, .sidebar a:focus-visible span.lbl { left: 64px; background: var(--marca-profunda); color: #fff; padding: 4px 10px; border-radius: 8px; white-space: nowrap; z-index: 5; font-size: 13px; }

}
@media (max-width: 767px) {

  .solo-movil { display: inline-grid !important; }
  .solo-escritorio { display: none !important; }
  .panel-lateral { width: 100%; }
  .grid-2b, .grid-3, .form-grid, .zonas { grid-template-columns: minmax(0, 1fr); }
  /* Celular: barra fija de una sola fila (AV-07); el selector de roles va arriba del contenido y se desplaza con él. */
  .topbar { gap: 6px; flex-wrap: nowrap; }
  .buscar-btn { flex: none; margin-left: auto; padding: 9px; border-radius: 999px; }

  .perfil-sel { flex: 1 1 160px; min-width: 0; }
  .perfil-sel select { width: 100%; min-width: 0; }
  .rol-movil { display: block; margin: -16px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 14px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--superficie); border-bottom: 1px solid var(--linea); }
  .rol-movil .perfil-sel select { width: 100%; min-width: 0; }
  .logo-txt span { display: none; }
  .kv { grid-template-columns: minmax(0, 1fr) auto; }
  .kv dt { grid-column: 1 / -1; border-bottom: 0; padding-bottom: 0; }
  .msg { max-width: 92%; }
  .item { grid-template-columns: auto minmax(0, 1fr); }
  .item > :nth-child(3) { grid-column: 2 / -1; justify-self: start; max-width: 100%; }
  .item:has(> .origen) { grid-template-columns: minmax(0, 1fr); }

  table.t.tarjetas thead { display: none; }
  table.t.tarjetas, table.t.tarjetas tbody, table.t.tarjetas tr, table.t.tarjetas td { display: block; width: 100%; }
  table.t.tarjetas tr { border: 1px solid var(--linea); border-radius: 12px; margin-bottom: 10px; padding: 6px 4px; background: var(--superficie); }
  table.t.tarjetas td { border: 0; height: auto; padding: 4px 10px; }

  .matriz { grid-template-columns: 26px repeat(5, minmax(0, 1fr)); }
  .matriz .celda { min-height: 54px; padding: 3px; }
  .marcador { font-size: 12px; padding: 0 3px; white-space: normal; flex-wrap: wrap; max-width: 100%; row-gap: 0; }

}
select, input, textarea { max-width: 100%; min-width: 0; }
.item > * { min-width: 0; }

/* ===================== v4 · Vistas de riesgos de empresa ===================== */
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--acento-texto); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; align-self: flex-start; }
.link-btn:hover { color: var(--marca); }
details.leer-mas { font-size: 13.5px; color: var(--texto); }

.sp-n, .cm-n, .nuevo-n { position: relative; }

/* Indicadores de comentarios nuevos (estilo Figma) */

.flag.alerta-f { color: var(--error); border-color: var(--error); }

/* Filas expandibles de la matriz */
.t-riesgos .fila-tit { color: var(--marca-profunda); text-decoration: none; font-weight: 550; }
.t-riesgos .fila-tit:hover { text-decoration: underline; }
.chev { display: inline-block; width: 8px; height: 8px; border-right: 2px solid var(--texto-suave); border-bottom: 2px solid var(--texto-suave); transform: rotate(-45deg); margin: 0 9px 2px 1px; transition: transform .15s; flex: none; }
[aria-expanded=true] > .chev { transform: rotate(45deg); }

.det { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; cursor: default; }

.det-der { min-width: 0; }
.det-suelto { border: 1px solid var(--linea); border-left: 3px solid var(--marca); border-radius: var(--radio-chico); background: var(--superficie-2); margin: 4px 0 10px; }
.det-suelto > .fila-sp { padding: 10px 18px 0; }

/* Probabilidad destacada */
.prob { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "cab cab" "val esc" "ref ref"; align-items: center; gap: 6px 16px; padding: 14px 16px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--linea); box-shadow: inset 4px 0 0 var(--marca); }
.prob-cab { grid-area: cab; display: flex; align-items: center; gap: 8px; }

.prob-val { grid-area: val; display: flex; align-items: baseline; gap: 6px; color: var(--marca-profunda); }
.prob-val strong { font-size: 40px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }

.prob .link-btn { grid-area: ref; font-size: 13px; justify-self: start; }
.tip { position: relative; display: inline-flex; }
.tip-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--acento-texto); background: var(--superficie); color: var(--acento-texto); font: inherit; font-size: 12px; font-weight: 800; cursor: help; display: grid; place-items: center; padding: 0; }
.tip-cuerpo { display: none; position: absolute; z-index: 20; left: -8px; top: calc(100% + 8px); width: min(340px, 78vw); background: var(--marca-profunda); color: #fff; font-size: 13px; line-height: 1.45; padding: 10px 12px; border-radius: 10px; box-shadow: var(--sombra); text-transform: none; letter-spacing: 0; font-weight: 400; }
.tip-cuerpo::before { content: ""; position: absolute; top: -6px; left: 14px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--marca-profunda); }

.tip-fuente { display: block; margin-top: 6px; color: var(--sobre-oscuro-suave); font-size: 12px; }
.tip:hover .tip-cuerpo, .tip:focus-within .tip-cuerpo { display: block; }

.t-imp th .th-esc { display: block; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--texto-suave); }

/* Hilo de comentarios */
.hilo-c { display: flex; flex-direction: column; gap: 10px; background: var(--superficie); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 14px; }
.hilo-c h4 { font-size: 14px; }
.cm-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }

.cm-c .cm-ev { font-size: 12.5px; color: var(--texto-suave); }
.compose { border-top: 1px solid var(--linea); padding-top: 10px; }

/* Listas expandibles (plan y transferencia) */
.fx-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.fx { border-bottom: 1px solid var(--linea); }

.fx-plan { grid-template-columns: 18px minmax(0, 2.4fr) 112px 96px minmax(0, 1.1fr) minmax(0, 1.1fr) 84px minmax(70px, auto); }

/* v4.1 · En celular el tooltip de probabilidad flota fijo sobre la pantalla, a todo el ancho y sobre el registro:

}

// ---------- Detección de datos bancarios (AM-10b, INV-P9) ----------
function luhnOk(num) { let s = 0, alt = false; for (let i = num.length - 1; i >= 0; i--) { let n = +num[i]; if (alt) { n *= 2; if (n > 9) n -= 9; } s += n; alt = !alt; } return s % 10 === 0; }
// Datos de tarjetas y bancarios (AM-10b, INV-P9). Una tarjeta es una ventana de grupos de dígitos (cualquier separador que no
// sea letra, número ni salto de línea) con 13 a 19 dígitos que pasa Luhn y empieza con 3–6, o que sigue a una palabra de tarjeta;
// un CBU/CVU son 22 dígitos. Los teléfonos con prefijo internacional se apartan antes para no confundirlos.
const RX_TEL_INTL = /\+\d{1,3}(?:[\s\-().]{0,2}\d){7,13}/g;
const RX_PAL_TARJETA = /(tarjeta|visa|master(card)?|amex|american express|d[eé]bito|cr[eé]dito|naranja|cabal|maestro)[^\n]{0,30}$/i;
function redactarBancarios(texto) {
  let omitidos = 0; const OM = '[dato bancario omitido]';
  const apartados = []; let out = String(texto).replace(RX_TEL_INTL, m => { apartados.push(m); return `\u0000${apartados.length - 1}\u0000`; });
  out = out.replace(/\d(?:[^\p{L}\p{N}\n\u0000]{0,3}\d)*/gu, (run, off, todo) => {
    const grupos = []; run.replace(/\d+/g, (g, pos) => { grupos.push({ g, pos }); return g; });
    const total = grupos.reduce((a, x) => a + x.g.length, 0); if (total < 13) return run;
    const cortes = []; // [desde, hasta) en posiciones de run
    for (let i = 0; i < grupos.length; i++) {
      let dig = '', mejor = null; const ctxTarjeta = RX_PAL_TARJETA.test(todo.slice(Math.max(0, off + grupos[i].pos - 40), off + grupos[i].pos));
      for (let j = i; j < grupos.length; j++) {
        dig += grupos[j].g; if (dig.length > 22) break;
        const n = dig.length;
        const tarjeta = n >= 13 && n <= 19 && ((/^[3-6]/.test(dig) && luhnOk(dig)) || ctxTarjeta);
        if (tarjeta || n === 22) mejor = j;
      }
      if (mejor != null) { cortes.push([grupos[i].pos, grupos[mejor].pos + grupos[mejor].g.length]); i = mejor; }
    }
    if (!cortes.length) return run;
    let r = '', k = 0; for (const [a, b] of cortes) { r += run.slice(k, a) + OM; omitidos++; k = b; } return r + run.slice(k);
  });
  out = out.replace(/\b(?:venc(?:imiento|e)?|vto|exp(?:ira|iraci[oó]n)?)\.?:?\s*(?:(?:0?[1-9]|1[0-2])\s*[\/\-.]\s*\d{2,4}|(?:0[1-9]|1[0-2])\d{2})(?![\/\-.]?\d)/gi, () => { omitidos++; return OM; });
  out = out.replace(/\b(?:alias|cvu|cbu|clave|c[oó]digo de seguridad|cvv|cvc)\b[:\s]+([A-Za-z0-9.\-]{3,})/gi, (m, v) => { if (v.includes('[')) return m; omitidos++; return m.replace(v, OM); });
  out = out.replace(/\bc[oó]digo\s*:?\s*(\d{3,4})(?!\d)/gi, (m, v) => { omitidos++; return m.replace(v, OM); });
  out = out.replace(/\u0000(\d+)\u0000/g, (m, i) => apartados[+i]);
  return { texto: out, omitidos };
}

// En resúmenes dentro de Broker OS (Hoy, listas) los datos de tarjeta también se ocultan (AV-12); el mensaje completo queda en la ficha.
function sinBancarios(t) { return redactarBancarios(t).texto; }
// Resumen de un texto ya redactado: corta en un límite de palabra y nunca dentro de «[dato bancario omitido]» (AV2-03).
function resumen(t, n) {
  t = sinBancarios(t); if (t.length <= n) return t;
  let c = t.slice(0, n); const a = c.lastIndexOf('['), b = c.lastIndexOf(']'); if (a > b) c = c.slice(0, a);
  const sp = c.lastIndexOf(' '); if (sp > n * 0.6) c = c.slice(0, sp);
  return c.replace(/[\s·,;:]+$/, '') + '…';
}

function alertas(d) {
  const now = nowOf(d), out = [];
  // (a) seguridad de personas sin acción ni decisión
  k11Lista(d).forEach(r => { const e = empresaDeOrg(d, r.org); out.push({ id: 'AL-a-' + r.id, regla: 'a', para: ['man', 'eva'], org: r.org, titulo: `«Seguridad de personas» sin tratamiento: ${r.titulo}`, detalle: `${e ? e.nombre : r.org} · ningún responsable con acción en curso ni decisión de la dirección`, ruta: `#/empresa/${e ? e.id : ''}/riesgos/plan?r=${r.id}`, accion: 'Abrir el plan de acción' }); });
  // (b) ventana de 24 h por cerrar sin respuesta
  d.conversaciones.filter(c => c.canal === 'whatsapp' && ultimoMsg(c).dir === 'in').forEach(c => { const r = ventanaRestante(d, c); const at = atencionVigente(d, c.persona); if (r !== null && r > 0 && r < cfgUmbral(d, 'ventanaMin') && at) out.push({ id: 'AL-b-' + c.id, regla: 'b', para: [at.integrante], titulo: `La ventana de 24 h con ${nombreDe(d, c.persona)} cierra en ${Math.floor(r / 60)} h ${r % 60} min`, detalle: 'Último mensaje del cliente sin respuesta', ruta: `#/persona/${c.persona}/comunicacion`, accion: 'Responder ahora' }); });
  // (c) solicitud de empresa sin respuesta en 2 días hábiles
  d.solicitudes.filter(s => s.estado === 'abierta' && s.respuestas.length === 0 && s.autorTipo === 'empresa' && diasHabiles(s.t, now) >= cfgUmbral(d, 'solicitudDias')).forEach(s => out.push({ id: 'AL-c-' + s.id, regla: 'c', para: ['man', 'eva'], org: s.org, titulo: `Solicitud sin respuesta hace ${diasHabiles(s.t, now)} días hábiles: «${s.titulo}»`, detalle: nombreDe(d, s.empresa), ruta: `#/empresa/${s.empresa}/riesgos/solicitudes?s=${s.id}`, accion: 'Responder solicitud' }));
  // (d) excepción de automatización
  d.ejecuciones.forEach(e => { const n = e.items.reduce((a, it) => a + it.pasos.filter(p => p.estado === 'error' && !p.resuelto).length, 0); if (n) out.push({ id: 'AL-d-' + e.id, regla: 'd', para: ['eva', 'emi'], titulo: `${e.nombre}: ${n} ${n === 1 ? 'paso fallido' : 'pasos fallidos'} sin resolver`, detalle: 'Automatización (Futuro)', ruta: `#/automatizaciones/${e.id}`, accion: 'Resolver excepciones' }); });
  // (e) póliza que vence en 15 días sin renovación iniciada (v19: los umbrales se configuran, ver configuracion-v19.js)
  d.polizas.forEach(p => { const dias = diasEntre(now, p.fin); if (dias >= 0 && dias <= cfgUmbral(d, 'renovacionDias') && estadoRenovacion(d, p.id) === 'no_iniciada' && !d.tareas.some(t => t.obj.tipo === 'poliza' && t.obj.id === p.id && t.estado !== 'hecha')) out.push({ id: 'AL-e-' + p.id, regla: 'e', para: ['eva'], titulo: `${p.numero} vence en ${dias} días sin renovación iniciada`, detalle: `${tomadorNombre(d, p)} · ${p.ramo}`, ruta: `#/poliza/${p.id}`, accion: 'Crear tarea de seguimiento' }); });
  // (f) mensaje sin identificar con más de 4 h hábiles
  d.sinIdentificar.filter(u => !u.vinculado && minutosHabiles(u.t, now) > cfgUmbral(d, 'sinIdentMin')).forEach(u => out.push({ id: 'AL-f-' + u.id, regla: 'f', para: [d.guardia.integrante], titulo: `Mensaje sin identificar de ${u.remitente} espera hace más de ${cfgHm(cfgUmbral(d, 'sinIdentMin'))} hábiles`, detalle: u.texto, ruta: '#/comunicacion/sinidentificar', accion: 'Vincular o crear persona' }));
  return out;
}
function estadoRenovacion(d, polId) {
  for (const e of d.ejecuciones.filter(x => x.tipo === 'renovaciones')) {
    const it = e.items.find(i => i.poliza === polId); if (!it) continue;
    if (it.pasos[0].estado === 'error') return it.pasos[0].resuelto ? 'seguimiento' : 'no_iniciada';
    if (it.pasos.some(p => p.estado === 'error' && !p.resuelto)) return 'con_excepcion';
    if (it.pasos.some(p => p.resuelto)) return 'completa_con_intervencion';

}
const REN_NOMBRE = { no_iniciada: 'No iniciada', seguimiento: 'En seguimiento (tarea creada)', con_excepcion: 'Con excepción', completa_con_intervencion: 'Completa con intervención', completa: 'Completa', no_corresponde: 'No corresponde este mes' };

// ===== Acciones: cada una es una función sobre una copia del estado; devuelve el evento a registrar =====
class Rechazo extends Error {}
function exigir(cond, msg) { if (!cond) throw new Rechazo(msg); }
function exigirPermiso(perfil, accion, ctx) { exigir(puede(perfil, accion, ctx), QUIEN[accion] || 'Tu perfil no puede hacer esta acción.'); }
function nuevoId(d, pref) { d.seq = (d.seq || 0) + 1; return `${pref}-${String(d.seq).padStart(3, '0')}`; }
function notificar(d, n) { const t = nowOf(d); if (n.detalle) n = { ...n, detalle: sinBancarios(n.detalle) }; if (n.titulo) n = { ...n, titulo: sinBancarios(n.titulo) }; d.notificaciones.push({ id: nuevoId(d, 'N'), t, leida: false, ...n }); }
function nombreCorto(d, id) { return nombreDe(d, id); }

// ---------- Ruteo de un mensaje entrante (§7.4, INV-P8) ----------
function rutearEntrante(d, { canal, persona: pid, remitente, texto, asunto, adjunto, agente }) {
  const t = tick(d);
  const res = { regla: null, notificados: [], chatbot: null };
  const bot = d.chatbot && canal === 'whatsapp';
  if (!pid) {
    // Regla 1
    const u = { id: nuevoId(d, 'u'), canal, remitente, t, texto, asunto: asunto || null };
    if (bot) u.respuestaBot = 'Hola, soy el asistente de Del Campo (prueba). ¿Me decís tu nombre y DNI para ubicarte?';
    d.sinIdentificar.push(u);
    notificar(d, { para: d.guardia.integrante, tipo: 'llegada', regla: 1, canal, titulo: `Mensaje sin identificar de ${remitente}`, detalle: texto, obj: { tipo: 'sinidentificar', id: u.id } });
    res.regla = 1; res.notificados = [d.guardia.integrante]; res.chatbot = u.respuestaBot || null; res.destino = 'Bandeja «Sin identificar»';
    return res;
  }
  let c = convDe(d, pid, canal);
  if (!c) { c = { id: nuevoId(d, canal === 'whatsapp' ? 'cw' : 'cm'), persona: pid, canal, asunto: asunto || null, mensajes: [] }; d.conversaciones.push(c); }
  const msg = { id: c.id + '-m' + (c.mensajes.length + 1), dir: 'in', t, texto, adjunto: adjunto || null };
  c.mensajes.push(msg);
  const vig = atencionVigente(d, pid);
  const resuelve = bot && chatbotResuelve(texto);
  if (bot) {
    const resp = resuelve ? respuestaChatbot(d, pid) : (/cubre|cobertura|confirm/i.test(texto) ? 'No puedo confirmar coberturas por este medio. Te derivo con una persona del equipo, que revisa tu póliza.' : 'Te derivo con una persona del equipo.');
    c.mensajes.push({ id: c.id + '-m' + (c.mensajes.length + 1), dir: 'out', t, texto: resp, autor: 'chatbot', estado: 'entregado (simulado)' });
    res.chatbot = resp; msg.respondidoPorChatbot = resuelve;
  }
  const base = { tipo: 'llegada', canal, persona: pid, obj: { tipo: 'persona', id: pid, tab: 'comunicacion' }, chatbot: resuelve };
  const dlg = vig && delegacionVigente(d, pid);
  if (dlg) {
    notificar(d, { ...base, para: dlg.a, regla: 2, delegada: true, titulo: `${nombreDe(d, pid)} escribió por ${canal === 'whatsapp' ? 'WhatsApp' : 'correo'} (conversación delegada por ${nombreDe(d, dlg.de)})${resuelve ? ' (respondido por chatbot)' : ''}`, detalle: agente ? agente : texto, agente: agente ? true : undefined });
    res.regla = 2; res.notificados = [dlg.a]; res.destino = `Delegada a ${nombreDe(d, dlg.a)} (atiende ${nombreDe(d, vig.integrante)})`;
    return res;
  }
  if (vig) {
    notificar(d, { ...base, para: vig.integrante, regla: 2, titulo: `${nombreDe(d, pid)} escribió por ${canal === 'whatsapp' ? 'WhatsApp' : 'correo'}${resuelve ? ' (respondido por chatbot)' : ''}`, detalle: agente ? agente : texto, agente: agente ? true : undefined });
    res.regla = 2; res.notificados = [vig.integrante]; res.destino = `Responsable vigente: ${nombreDe(d, vig.integrante)}`;
    return res;
  }
  if (resuelve) { res.regla = 3; res.destino = 'Respondido por chatbot; sin notificación'; return res; }
  const duenos = duenosGestionAbierta(d, pid);
  if (duenos.length === 1) {
    const a = { id: nuevoId(d, 'at'), persona: pid, integrante: duenos[0], desde: t, hasta: null, motivo: 'Gestión abierta (derivación automática, regla 4)' };
    d.atenciones.push(a);
    const pol = d.polizas.find(p => p.tomador === pid);
    notificar(d, { ...base, para: duenos[0], regla: 4, titulo: `${nombreDe(d, pid)} escribió y se te asignó (gestión abierta)`, detalle: `«${texto}» · Póliza ${pol ? pol.numero : '—'} · motivo: gestión abierta` });
    res.regla = 4; res.notificados = [duenos[0]]; res.destino = `Dueño único de gestión abierta: ${nombreDe(d, duenos[0])} (se creó la atención)`;
    return res;
  }
  const sa = { id: nuevoId(d, 'sa'), persona: pid, canal, t, texto, tomadoPor: null };
  d.sinAsignar.push(sa);
  notificar(d, { ...base, para: d.guardia.integrante, regla: 5, titulo: `Mensaje sin asignar de ${nombreDe(d, pid)}`, detalle: texto, obj: { tipo: 'sinasignar', id: sa.id } });
  res.regla = 5; res.notificados = [d.guardia.integrante]; res.destino = 'Bandeja «Sin asignar» (aviso a la guardia)';
  return res;
}

const ACCIONES = {
  // ----- Notificaciones -----
  marcarLeida(d, { id }, { perfil }) { const n = byId(d.notificaciones, id); exigir(n && n.para === perfil, 'Notificación inexistente.'); n.leida = true; return null; },

  // ----- Tareas -----
  tareaEstado(d, { id, estado }, { perfil }) {
    const t = byId(d.tareas, id); exigir(t, 'Tarea inexistente.');
    exigir(perfil === 'man' || t.resp === perfil, 'Solo la persona responsable o Manuel cambian el estado de esta tarea.');
    const antes = t.estado; t.estado = estado; if (estado === 'hecha') t.hechaEl = nowOf(d); else t.hechaEl = null;
    return { accion: `Cambió el estado de «${t.titulo}»`, objeto: id, efecto: `${ESTADO_TAREA[antes]} → ${ESTADO_TAREA[estado]}` };
  },
  tareaComentar(d, { id, texto }, { perfil }) {
    const t = byId(d.tareas, id); exigir(t, 'Tarea inexistente.'); exigir(texto && texto.trim(), 'Escribí un comentario.');
    exigir(perfil === 'man' || t.resp === perfil, 'Comentan la persona responsable o Manuel.');
    t.comentarios.push({ autor: perfil, t: tick(d), texto: texto.trim() });
    return { accion: `Comentó en «${t.titulo}»`, objeto: id, efecto: texto.trim() };
  },
  tareaReasignar(d, { id, a, comentario, destrabar }, { perfil }) {
    exigirPermiso(perfil, 'reasignarTareas');
    const t = byId(d.tareas, id); exigir(t, 'Tarea inexistente.'); exigir(miembro(d, a), 'Elegí a quién reasignar.'); exigir(comentario && comentario.trim(), 'Escribí el motivo de la reasignación: queda en la tarea (AV-14).');
    const antes = t.resp; t.resp = a; const destrabada = destrabar && t.estado === 'trabada'; if (destrabada) { t.estado = 'en_curso'; t.motivoAnterior = t.motivo; }
    if (comentario && comentario.trim()) t.comentarios.push({ autor: perfil, t: tick(d), texto: comentario.trim() });
    if (a !== perfil) notificar(d, { para: a, tipo: 'aviso', titulo: `Manuel te asignó «${t.titulo}»`, detalle: comentario || '', obj: { tipo: 'tarea', id } });
    if (antes !== perfil && antes !== a) notificar(d, { para: antes, tipo: 'aviso', titulo: `«${t.titulo}» se reasignó a ${nombreDe(d, a)}`, detalle: comentario || '', obj: { tipo: 'tarea', id } });
    return { accion: `Reasignó «${t.titulo}»`, objeto: id, efecto: `${nombreDe(d, antes)} → ${nombreDe(d, a)}${destrabada ? '; pasa a «en curso»' : ''}` };
  },
  crearTarea(d, { titulo, resp, vence, obj, origen, motivo }, { perfil }) {
    exigirPermiso(perfil, 'crearTarea'); exigir(titulo && titulo.trim(), 'La tarea necesita un título.'); exigir(miembro(d, resp), 'Elegí una persona responsable.');
    const id = nuevoId(d, 't');
    d.tareas.push({ id, titulo: titulo.trim(), resp, estado: 'pendiente', vence: vence || TODAY, obj: obj || { tipo: 'gestion', id: 'general' }, origen: origen || null, motivo: motivo || null, comentarios: [], creada: tick(d), creadaPor: perfil });
    if (resp !== perfil) notificar(d, { para: resp, tipo: 'aviso', titulo: `${nombreDe(d, perfil)} te asignó «${titulo.trim()}»`, detalle: '', obj: { tipo: 'tarea', id } });
    return { accion: `Creó la tarea «${titulo.trim()}» para ${nombreDe(d, resp)}`, objeto: id, efecto: 'Tarea pendiente en el inicio de ' + nombreDe(d, resp) };
  },

  // ----- Atenciones (I-34) -----
  tomarAtencion(d, { persona: pid }, { perfil }) {
    exigirPermiso(perfil, 'atencion'); const vig = atencionVigente(d, pid);
    exigir(!vig, vig ? `Ya la atiende ${nombreDe(d, vig.integrante)}: usá «Transferir».` : '');
    d.atenciones.push({ id: nuevoId(d, 'at'), persona: pid, integrante: perfil, desde: tick(d), hasta: null, motivo: 'Tomada manualmente' });
    return { accion: `Tomó la atención de ${nombreDe(d, pid)}`, objeto: pid, efecto: 'Los próximos mensajes notifican a ' + nombreDe(d, perfil) };
  },
  transferirAtencion(d, { persona: pid, a, motivo }, { perfil }) {
    exigirPermiso(perfil, 'atencion'); const vig = atencionVigente(d, pid); exigir(vig, 'Nadie atiende a esta persona: usá «Tomar».');
    exigir(miembro(d, a) && a !== 'emi', 'Elegí a quién transferir.'); exigir(a !== vig.integrante, 'Ya la atiende esa persona.'); exigir(motivo && motivo.trim(), 'Indicá el motivo de la transferencia.');
    const t = tick(d); vig.hasta = t; vig.cierre = `Transferida a ${nombreDe(d, a)} por ${nombreDe(d, perfil)}: ${motivo.trim()}`;
    d.atenciones.push({ id: nuevoId(d, 'at'), persona: pid, integrante: a, desde: t, hasta: null, motivo: `Transferencia de ${nombreDe(d, vig.integrante)}: ${motivo.trim()}` });
    notificar(d, { para: a, tipo: 'aviso', titulo: `${nombreDe(d, perfil)} te transfirió la atención de ${nombreDe(d, pid)}`, detalle: motivo.trim(), obj: { tipo: 'persona', id: pid, tab: 'comunicacion' } });
    return { accion: `Transfirió la atención de ${nombreDe(d, pid)}`, objeto: pid, efecto: `${nombreDe(d, vig.integrante)} → ${nombreDe(d, a)}; la próxima notificación llega a ${nombreDe(d, a)}` };
  },
  cerrarAtencion(d, { persona: pid }, { perfil }) {
    exigirPermiso(perfil, 'atencion'); const vig = atencionVigente(d, pid); exigir(vig, 'No hay atención vigente.');
    vig.hasta = tick(d); vig.cierre = `Cerrada por ${nombreDe(d, perfil)}`;
    return { accion: `Cerró la atención de ${nombreDe(d, pid)}`, objeto: pid, efecto: 'Sin atención vigente: el próximo mensaje sigue la tabla de §7.4' };
  },
  tomarSinAsignar(d, { id }, { perfil }) {
    exigirPermiso(perfil, 'atencion'); const sa = byId(d.sinAsignar, id); exigir(sa && !sa.tomadoPor, 'Ese mensaje ya fue tomado.');
    const vig = atencionVigente(d, sa.persona); exigir(!vig, `Ya la atiende ${vig ? nombreDe(d, vig.integrante) : ''}.`);
    sa.tomadoPor = perfil; d.atenciones.push({ id: nuevoId(d, 'at'), persona: sa.persona, integrante: perfil, desde: tick(d), hasta: null, motivo: 'Tomada desde «Sin asignar»' });
    return { accion: `Tomó el mensaje de ${nombreDe(d, sa.persona)} desde «Sin asignar»`, objeto: id, efecto: `Atención vigente: ${nombreDe(d, perfil)}` };
  },
  asignarSinAsignar(d, { id, a }, { perfil }) {
    exigir(perfil === d.guardia.integrante || perfil === 'man', QUIEN.asignarSinAsignar);
    const sa = byId(d.sinAsignar, id); exigir(sa && !sa.tomadoPor, 'Ese mensaje ya fue tomado.'); exigir(miembro(d, a) && a !== 'emi', 'Elegí a quién asignar.');
    sa.tomadoPor = a; d.atenciones.push({ id: nuevoId(d, 'at'), persona: sa.persona, integrante: a, desde: tick(d), hasta: null, motivo: `Asignada por ${nombreDe(d, perfil)} (guardia)` });
    if (a !== perfil) notificar(d, { para: a, tipo: 'aviso', titulo: `${nombreDe(d, perfil)} te asignó a ${nombreDe(d, sa.persona)}`, detalle: sa.texto, obj: { tipo: 'persona', id: sa.persona, tab: 'comunicacion' } });
    return { accion: `Asignó el mensaje de ${nombreDe(d, sa.persona)}`, objeto: id, efecto: `Atención vigente: ${nombreDe(d, a)}` };
  },

  // ----- Mensajes -----
  entrante(d, p, { perfil }) {
    const r = rutearEntrante(d, p); d.ultimoRuteo = { ...r, persona: p.persona || null, remitente: p.remitente || null, canal: p.canal, texto: p.texto, t: nowOf(d) };
    return { accion: `Mensaje entrante simulado (${p.canal === 'whatsapp' ? 'WhatsApp' : 'correo'}) de ${p.persona ? nombreDe(d, p.persona) : p.remitente}`, objeto: p.persona || p.remitente, origen: p.canal === 'whatsapp' ? 'Teléfono del cliente (simulado)' : 'Correo entrante (simulado)', efecto: `Regla ${r.regla}: ${r.destino}. Notificaciones: ${r.notificados.length ? r.notificados.map(x => nombreDe(d, x)).join(', ') : 'ninguna'}`, entrada: p.texto, salida: r.chatbot || '' };
  },
  setChatbot(d, { on }) { d.chatbot = !!on; return { accion: `Chatbot (Futuro) ${on ? 'activado' : 'desactivado'} en la simulación`, objeto: 'chatbot', efecto: on ? 'La regla 3 de §7.4 aplica' : 'Sin chatbot: la regla 3 no existe' }; },
  responder(d, { conv, texto, plantilla }, { perfil }) {
    exigirPermiso(perfil, 'responder'); const c = byId(d.conversaciones, conv); exigir(c, 'Conversación inexistente.'); exigir(texto && texto.trim(), 'Escribí la respuesta.');
    if (c.canal === 'whatsapp') { const r = ventanaRestante(d, c); exigir(plantilla || (r !== null && r > 0), 'La ventana de 24 h está cerrada: hace falta una plantilla aprobada.'); }
    c.mensajes.push({ id: c.id + '-m' + (c.mensajes.length + 1), dir: 'out', t: tick(d), texto: texto.trim(), autor: perfil, estado: c.canal === 'whatsapp' ? 'enviado (simulado)' : 'enviado (simulado)', plantilla: !!plantilla });
    return { accion: `Respondió a ${nombreDe(d, c.persona)} por ${c.canal === 'whatsapp' ? 'WhatsApp' : 'correo'}${plantilla ? ' con plantilla' : ''}`, objeto: conv, origen: 'Communication OS (simulado)', efecto: 'Mensaje enviado (simulado), escrito por una persona', entrada: texto.trim() };
  },
  vincularSinIdentificar(d, { id, persona: pid }, { perfil }) {
    exigirPermiso(perfil, 'responder'); const u = byId(d.sinIdentificar, id); exigir(u && !u.vinculado, 'Mensaje ya vinculado.'); exigir(persona(d, pid), 'Elegí una persona.');
    u.vinculado = pid; u.vinculadoPor = perfil; const p = persona(d, pid);
    p.canalesExtra = p.canalesExtra || []; p.canalesExtra.push({ canal: u.canal, valor: u.remitente, por: perfil, t: tick(d) });
    let c = convDe(d, pid, u.canal); if (!c) { c = { id: nuevoId(d, 'cv'), persona: pid, canal: u.canal, asunto: u.asunto, mensajes: [] }; d.conversaciones.push(c); }
    c.mensajes.push({ id: c.id + '-m' + (c.mensajes.length + 1), dir: 'in', t: u.t, texto: u.texto, desde: u.remitente });
    c.mensajes.sort((a, b) => a.t.localeCompare(b.t));
    const vig = atencionVigente(d, pid); let efecto = `Mensaje movido a la ficha de ${p.nombre}; ${u.remitente} queda como canal de la persona.`;
    if (vig) { efecto += ` Reevaluado desde la regla 2: lo atiende ${nombreDe(d, vig.integrante)}.`; if (vig.integrante !== perfil) notificar(d, { para: vig.integrante, tipo: 'aviso', titulo: `Se vinculó un mensaje de ${p.nombre}`, detalle: u.texto, obj: { tipo: 'persona', id: pid, tab: 'comunicacion' } }); }
    return { accion: `Vinculó el mensaje de ${u.remitente} a ${p.nombre}`, objeto: id, efecto };
  },

  // ----- Personas -----
  altaPersona(d, { nombre, dni, tel, mail, decision, motivo, existente }, { perfil }) {
    exigirPermiso(perfil, 'editarPersona'); exigir(nombre && nombre.trim() && dni && dni.trim(), 'Nombre y DNI son obligatorios.');
    const norm = s => s.replace(/\D/g, '');
    const dup = d.personas.find(p => p.dni && norm(p.dni) === norm(dni));
    if (dup && decision !== 'crear') {
      exigir(decision === 'vincular', `Ya existe ${dup.nombre} con ese DNI: elegí vincular, crear igual con motivo o cancelar.`);
      return { accion: `Vinculó el alta a la persona existente ${dup.nombre}`, objeto: dup.id, efecto: 'No se creó un duplicado', irA: `#/persona/${dup.id}/resumen` };
    }
    if (dup || decision === 'crear') exigir(motivo && motivo.trim(), 'Para crear igual hace falta un motivo.');
    const id = 'p' + String(d.personas.length + 1).padStart(2, '0') + 'x' + (d.seq || 0);
    exigir(sinBancarios(nombre.trim()) === nombre.trim(), 'El nombre no puede llevar datos de tarjetas ni cuentas bancarias.');
    d.personas.push({ id, nombre: nombre.trim(), dni: dni.trim(), tel: tel || null, mail: mail || null, nac: null, domicilio: null, tipo: 'cliente', org: null, nota: dup || decision === 'crear' ? `Alta con posible duplicado decidida por ${nombreDe(d, perfil)}: ${motivo}` : null });
    tick(d);
    return { accion: `Dio de alta a ${nombre.trim()}`, objeto: id, efecto: dup ? 'Creada igual, con motivo registrado' : 'Persona nueva', irA: `#/persona/${id}/resumen` };
  },
  // v16: carga manual y edición de pólizas. Cada edición deja una versión con lo que cambió (campo: antes → después).
  guardarPoliza(d, { id, numero, ramo, compania, tomador, inicio, fin, doc, motivo }, { perfil }) {
    exigirPermiso(perfil, 'editarPoliza');
    const t = s => (s && String(s).trim()) || '', num = t(numero).toUpperCase().replace(/\s+/g, ''), fecha = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(Date.parse(s + 'T00:00:00Z')) && new Date(s + 'T00:00:00Z').toISOString().slice(0, 10) === s;
    exigir(num && t(ramo) && t(compania), 'Número, ramo y compañía son obligatorios.');
    // Un número con aspecto de tarjeta o CBU se rechaza: redactado no serviría para buscar la póliza.
    exigir(sinBancarios(num) === num && sinBancarios(t(numero)) === t(numero), 'El número de póliza no puede tener el formato de una tarjeta o de una cuenta bancaria.');
    const tp = persona(d, tomador); exigir((tp && tp.tipo !== 'tercero') || empresa(d, tomador), 'Elegí el tomador (una empresa o una persona cliente).');
    exigir(fecha(inicio) && fecha(fin), 'Completá las fechas de vigencia.'); exigir(fin > inicio, 'La vigencia tiene que terminar después de empezar.');
    exigir(DOC_INFO[doc || 'sin_documento'], 'Estado de documento inválido.');
    const otra = d.polizas.find(x => x.numero.toUpperCase().replace(/\s+/g, '') === num && x.id !== id); exigir(!otra, `Ya existe la póliza ${num} (${nombreDe(d, otra && otra.tomador)}).`);
    const nuevo = { numero: num, ramo: sinBancarios(t(ramo)), compania: sinBancarios(t(compania)), tomador, inicio, fin, doc: doc || 'sin_documento' };
    const hoy = tick(d), mot = t(motivo) ? sinBancarios(t(motivo)) : null;
    if (!id) {
      d.seq = (d.seq || 0) + 1; const pid = `pol-m${d.seq}`;
      d.polizas.push({ id: pid, ...nuevo, objetos: [], prima: null, versiones: [{ v: 1, fecha: hoy.slice(0, 10), tipo: 'Carga manual', detalle: 'Póliza cargada a mano en Broker OS', por: perfil }] });
      return { accion: `Cargó a mano la póliza ${num} de ${nombreDe(d, tomador)}`, objeto: pid, efecto: 'Póliza nueva', irA: `#/poliza/${pid}` };
    }
    const p = byId(d.polizas, id); exigir(p, 'Póliza inexistente.');
    const NOM = { numero: 'Número', ramo: 'Ramo', compania: 'Compañía', tomador: 'Tomador', inicio: 'Desde', fin: 'Hasta', doc: 'Documento' };
    const ver = (k, x) => k === 'tomador' ? nombreDe(d, x) : k === 'doc' ? DOC_INFO[x][1] : (k === 'inicio' || k === 'fin') ? fFecha(x) : x;
    const cambios = Object.keys(NOM).filter(k => p[k] !== nuevo[k]).map(k => `${NOM[k]}: ${ver(k, p[k])} → ${ver(k, nuevo[k])}`);
    exigir(cambios.length, 'No cambiaste ningún dato.');
    Object.assign(p, nuevo);
    p.versiones.push({ v: p.versiones.length + 1, fecha: hoy.slice(0, 10), tipo: 'Edición manual', detalle: cambios.join('; '), por: perfil, motivo: mot });
    return { accion: `Editó la póliza ${num}`, objeto: id, efecto: cambios.join('; '), irA: `#/poliza/${id}` };
  },
  altaEmpresa(d, { nombre, cuit, sector, actividad, domicilio, decision, motivo }, { perfil }) {
    exigirPermiso(perfil, 'editarPersona'); const n = String(cuit || '').replace(/\D/g, '');
    exigir(nombre && nombre.trim() && n.length === 11, 'La razón social y un CUIT de 11 dígitos son obligatorios.');

const REGLA_ALERTA = { a: 'Alerta (a): Seguridad de personas sin tratamiento', b: 'Alerta (b): ventana de 24 h por cerrar', c: 'Alerta (c): solicitud sin respuesta en 2 días hábiles', d: 'Alerta (d): excepción de automatización', e: 'Alerta (e): vence en 15 días sin renovación iniciada', f: 'Alerta (f): sin identificar hace más de 4 h hábiles' };
function itemsHoy(d, yo) {
  const hoy = nowOf(d).slice(0, 10), items = [];
  alertas(d).filter(a => a.para.includes(yo)).forEach(a => items.push({ pri: 0, origen: 'Alerta', alerta: true, titulo: a.titulo, motivo: REGLA_ALERTA[a.regla] + ' · ' + a.detalle, ruta: a.ruta, accion: a.accion, id: a.id }));
  const notifConvs = new Set();
  d.notificaciones.filter(n => n.para === yo && !n.leida).slice().reverse().forEach(n => {
    if (n.persona) notifConvs.add(n.persona);
    const origen = n.canal === 'whatsapp' ? 'WhatsApp' : n.canal === 'correo' ? 'Correo' : n.candidato ? 'Avance de empresa' : 'Aviso';
    const motivo = n.tipo === 'llegada' ? (n.delegada ? 'Te llegó porque te delegaron esta conversación' : n.regla === 2 ? 'Te llegó porque atendés a esta persona (regla 2)' : n.regla === 4 ? 'Te llegó porque sos el único dueño de una gestión abierta de esta persona (regla 4)' : n.regla === 5 ? 'Te llegó porque estás de guardia y nadie atiende a esta persona (regla 5)' : n.regla === 1 ? 'Te llegó porque estás de guardia y el remitente no está identificado (regla 1)' : '') : n.candidato ? 'El agente (simulado) lo marcó como candidato a cambio de actividad: decidí si abrís una revisión' : (n.detalle || '');
    items.push({ pri: 1, origen, notif: n, titulo: n.titulo, motivo: (n.tipo === 'llegada' ? `«${n.detalle}» · ` : '') + motivo, ruta: rutaObj(d, n.obj), id: n.id });
  });
  d.tareas.filter(t => t.resp === yo && t.estado !== 'hecha').forEach(t => {
    const venc = t.vence < hoy, hoyV = t.vence === hoy;
    const pri = t.estado === 'trabada' ? 2 : venc ? 3 : hoyV ? 4 : 6;
    const motivo = t.estado === 'trabada' ? `Trabada: ${t.motivo || 'sin motivo'}` : venc ? `Venció el ${fFecha(t.vence)}` : hoyV ? 'Vence hoy' : `Vence el ${fFecha(t.vence)} · ${ESTADO_TAREA[t.estado]}`;
    const om = t.origen && t.origen.tipo === 'mensaje' ? (d.conversaciones.find(c => c.id === t.origen.conv) || { mensajes: [] }).mensajes.find(m => m.id === t.origen.msg) : null;
    items.push({ pri, origen: 'Tarea', titulo: t.titulo, motivo: motivo + (om ? ` · origen: «${resumen(om.texto, 80)}»` : ''), ruta: `#/tarea/${t.id}`, id: t.id, estado: t.estado });
  });
  ['whatsapp', 'correo'].forEach(canal => convsEsperando(d, yo, canal).filter(c => !notifConvs.has(c.persona)).forEach(c => {
    const u = ultimoMsg(c); items.push({ pri: 5, origen: canal === 'whatsapp' ? 'Conversación' : 'Correo', titulo: `${nombreDe(d, c.persona)} espera respuesta`, motivo: `«${resumen(u.texto, 90)}» · último mensaje del cliente el ${fCorta(u.t)}`, ruta: `#/persona/${c.persona}/comunicacion`, id: c.id });
  }));
  if (['man', 'eva'].includes(yo)) d.solicitudes.filter(s => s.estado === 'abierta' && !s.respuestas.length && !alertas(d).some(a => a.id === 'AL-c-' + s.id)).forEach(s => items.push({ pri: 5, origen: 'Solicitud', titulo: s.titulo, motivo: `${nombreDe(d, s.empresa)} · abierta el ${fFecha(s.t)} · sin respuesta`, ruta: `#/empresa/${s.empresa}/riesgos/solicitudes?s=${s.id}`, id: s.id }));
  if (['man', 'eva'].includes(yo)) d.revisiones.filter(r => r.estado !== 'cerrada' && !d.solicitudes.some(s => s.revision === r.id)).forEach(r => { const e = empresaDeOrg(d, r.org); items.push({ pri: 5, origen: 'Revisión', titulo: `Revisión de riesgos abierta en ${e.nombre}`, motivo: r.motivo, ruta: `#/empresa/${e.id}/riesgos/solicitudes`, id: r.id }); });
  if (yo === d.guardia.integrante) sinAsignarAbiertos(d).filter(x => !notifConvs.has(x.persona)).forEach(x => items.push({ pri: 5, origen: 'Sin asignar', titulo: `Mensaje sin asignar de ${nombreDe(d, x.persona)}`, motivo: 'Estás de guardia', ruta: '#/comunicacion/sinasignar', id: x.id }));
  return items.sort((a, b) => a.pri - b.pri);
}

  if (r.q.f === 'semana') ts = ts.filter(t => t.estado !== 'hecha' && t.vence > hoy && diasEntre(hoy, t.vence) <= 7);
